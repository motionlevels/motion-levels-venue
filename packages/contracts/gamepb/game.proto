syntax = "proto3";

package motionlevels.engine.game.v1;

option go_package = "github.com/lobis/motion-levels/packages/contracts/gamepb";

message GameSessionRecord {
  string session_id = 1;
  uint64 sequence = 2;
  int64 unix_nanos = 3;
  string venue_session_id = 4;

  oneof payload {
    SessionStarted session_started = 10;
    SessionEnded session_ended = 11;
    ApiInteraction api_interaction = 12;
    MenuCommand menu_command = 13;
    PressureInput pressure_input = 14;
    GameEvent game_event = 15;
    AudioCue audio_cue = 16;
    DisplaySnapshot display_snapshot = 17;
    LevelAttemptStarted level_attempt_started = 18;
    LevelAttemptFinished level_attempt_finished = 19;
    VenueSessionStarted venue_session_started = 20;
    VenueSessionEnded venue_session_ended = 21;
    MenuEvent menu_event = 22;
  }
}

// Venue-scoped records describe a client visit at the kiosk. They are written
// with an empty session_id and only venue_session_id set, because a visit
// spans multiple game sessions (including the ambient loop).
message VenueSessionStarted {
  string team_name = 1;
  string kiosk_id = 2;
  int64 started_unix_nanos = 3;
}

message VenueSessionEnded {
  string reason = 1;
  int64 ended_unix_nanos = 2;
}

message MenuEvent {
  string name = 1;            // menu taxonomy: player_added, game_selected, ...
  string kiosk_id = 2;
  string properties_json = 3; // raw JSON properties from the menu
  int64 unix_nanos = 4;
  uint64 venue_sequence = 5;  // engine-side monotonic sequence per venue session
}

message SessionStarted {
  string game = 1;
  string label = 2;
  uint32 player_count = 3;
  int64 rng_seed = 4;
  int64 started_unix_nanos = 5;
  string difficulty = 6;
  string level = 7;
  string team_name = 8;
  repeated DisplayPlayer players = 9;
  string venue_session_id = 10;
}

message SessionEnded {
  string reason = 1;
  int64 ended_unix_nanos = 2;
}

message ApiInteraction {
  string method = 1;
  string path = 2;
  string remote_addr = 3;
  int64 unix_nanos = 4;
  uint32 status = 5;
}

message MenuCommand {
  string command = 1;
  string game = 2;
  uint32 player_count = 3;
  int64 unix_nanos = 4;
}

message PressureInput {
  uint64 source_sequence = 1;
  int64 unix_nanos = 2;
  uint32 x = 3;
  uint32 y = 4;
  bool pressed = 5;
  string source = 6;
  uint32 controller = 7;
  uint32 channel = 8;
  uint32 position = 9;
}

message GameEvent {
  string cue = 1;
  string message = 2;
  int64 unix_nanos = 3;
}

message AudioCue {
  string ref = 1;
  string cue = 2;
  double volume = 3;
  int64 unix_nanos = 4;
}

message LevelAttemptStarted {
  string attempt_id = 1;
  string game = 2;
  string level_id = 3;
  uint32 level_number = 4;
  string difficulty = 5;
  uint32 player_count = 6;
  int32 lives_start = 7;
  int32 score_start = 8;
  uint32 active_targets_start = 9;
  int64 started_unix_nanos = 10;
  int64 gameplay_started_unix_nanos = 11;
}

message LevelAttemptFinished {
  string attempt_id = 1;
  string game = 2;
  string level_id = 3;
  uint32 level_number = 4;
  string difficulty = 5;
  string result = 6;
  int32 score_start = 7;
  int32 score_end = 8;
  int32 lives_start = 9;
  int32 lives_end = 10;
  uint32 active_targets_start = 11;
  uint32 active_targets_end = 12;
  int64 started_unix_nanos = 13;
  int64 gameplay_started_unix_nanos = 14;
  int64 ended_unix_nanos = 15;
  int64 elapsed_millis = 16;
}

message DisplaySnapshot {
  string current_game = 1;
  string label = 2;
  string phase = 3;
  uint32 player_count = 4;
  repeated DisplayPlayer players = 5;
  int32 score = 6;
  int32 lives = 7;
  int64 started_unix = 8;
  int64 ends_unix = 9;
  int64 elapsed_millis = 10;
  int64 remaining_millis = 11;
  uint32 active_targets = 12;
  bool audio_enabled = 13;
  int64 last_event_unix_nanos = 14;
  string last_event_cue = 15;
  string last_event_message = 16;
  int64 intro_remaining_millis = 17;
  int64 countdown_remaining_millis = 18;
  bool audio_muted = 19;
  string level = 20;
  string difficulty = 21;
  bool success = 22;
}

message DisplayPlayer {
  uint32 index = 1;
  string label = 2;
  Color color = 3;
  int32 score = 4;
  int32 lives = 5;
}

message Color {
  uint32 r = 1;
  uint32 g = 2;
  uint32 b = 3;
}
