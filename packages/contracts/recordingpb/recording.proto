syntax = "proto3";

package motionlevels.engine.recording.v1;

option go_package = "github.com/lobis/motion-levels/packages/contracts/recordingpb";

message FrameRecord {
  uint64 sequence = 1;
  int64 unix_nanos = 2;
  uint32 width = 3;
  uint32 height = 4;
  repeated TileState tiles = 5;
}

message TileState {
  uint32 x = 1;
  uint32 y = 2;
  uint32 r = 3;
  uint32 g = 4;
  uint32 b = 5;
  bool pressed = 6;
}
