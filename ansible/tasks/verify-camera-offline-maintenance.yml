---
- name: Require an existing complete native release for camera-offline maintenance
  ansible.builtin.shell: |
    set -eu
    current="{{ motion_levels_install_root }}/current"
    test -L "$current"
    target="$(readlink -f "$current")"
    test -d "$target"
    test -f "$target/release-manifest.json"
    test -f "$target/.complete"
  args:
    executable: /bin/sh
  changed_when: false

- name: Prove the configured GoPro is physically absent for camera-offline maintenance
  ansible.builtin.shell: |
    set -eu
    matches=0
    for device in /sys/bus/usb/devices/*; do
      test -r "$device/idVendor" || continue
      test -r "$device/idProduct" || continue
      vendor="$(tr -d '[:space:]' < "$device/idVendor")"
      product="$(tr -d '[:space:]' < "$device/idProduct")"
      if [ "$vendor" = "{{ motion_levels_camera.usb.vendor_id }}" ] \
        && [ "$product" = "{{ motion_levels_camera.usb.product_id }}" ]; then
        matches=$((matches + 1))
      fi
    done
    test "$matches" -eq 0
    test ! -e "/sys/bus/usb/devices/{{ motion_levels_camera.usb.expected_port }}"
    test ! -e "/sys/class/net/{{ motion_levels_camera.usb.network_interface }}"
    if systemctl is-active --quiet motion-levels-gopro-reconcile.service; then
      echo "GoPro reconcile is still active while the camera is declared physically absent" >&2
      exit 1
    fi
  args:
    executable: /bin/sh
  changed_when: false

- name: Require the fail-closed native camera service during camera-offline maintenance
  ansible.builtin.shell: |
    set -eu
    systemctl is-active --quiet motion-levels-cameras.service
    systemctl is-enabled --quiet motion-levels-cameras.service
  args:
    executable: /bin/sh
  changed_when: false

- name: Read the camera process health during camera-offline maintenance
  ansible.builtin.uri:
    url: http://127.0.0.1:8040/healthz
    return_content: true
    status_code: 200
    timeout: 10
  register: motion_levels_camera_offline_health
  retries: 30
  delay: 1
  until: motion_levels_camera_offline_health.status == 200

- name: Require camera readiness to remain fail-closed while physically absent
  ansible.builtin.uri:
    url: http://127.0.0.1:8040/readyz
    return_content: true
    status_code: 503
    timeout: 10
  register: motion_levels_camera_offline_ready

- name: Refresh the camera state during camera-offline maintenance
  ansible.builtin.uri:
    url: "{{ motion_levels_camera.api_url }}/api/v1/cameras/{{ motion_levels_camera.camera_id }}/status?refresh=true"
    return_content: true
    status_code: 200
    timeout: 10
  register: motion_levels_camera_offline_status
  retries: 10
  delay: 1
  until:
    - motion_levels_camera_offline_status.json.serial | default('') == motion_levels_camera.expected_serial
    - not (motion_levels_camera_offline_status.json.connected | default(true) | bool)
    - not (motion_levels_camera_offline_status.json.usb_detected | default(true) | bool)
    - not (motion_levels_camera_offline_status.json.command_ready | default(true) | bool)

- name: Read managed capture state during camera-offline maintenance
  ansible.builtin.uri:
    url: "{{ motion_levels_camera.api_url }}/api/v1/cameras/{{ motion_levels_camera.camera_id }}/capture"
    return_content: true
    status_code: 200
    timeout: 10
  register: motion_levels_camera_offline_capture

- name: Read host recording state during camera-offline maintenance
  ansible.builtin.uri:
    url: "{{ motion_levels_camera.api_url }}/api/v1/cameras/{{ motion_levels_camera.camera_id }}/host-recording"
    return_content: true
    status_code: 200
    timeout: 10
  register: motion_levels_camera_offline_host_recording

- name: Read durable media jobs during camera-offline maintenance
  ansible.builtin.uri:
    url: "{{ motion_levels_camera.api_url }}/api/v1/media/jobs?limit=1000"
    return_content: true
    status_code: 200
    timeout: 10
  register: motion_levels_camera_offline_jobs

- name: Require a completely idle fail-closed camera boundary
  ansible.builtin.assert:
    that:
      - motion_levels_camera_offline_health.json.ok | bool
      - motion_levels_camera_offline_health.json.mediaPipelineConfigured | default(false) | bool
      - motion_levels_camera_offline_health.json.pendingMediaJobs | default(-1) | int == 0
      - not (motion_levels_camera_offline_health.json.cameraConnected | default(true) | bool)
      - not (motion_levels_camera_offline_health.json.commandReady | default(true) | bool)
      - not (motion_levels_camera_offline_health.json.preview.connected | default(true) | bool)
      - not (motion_levels_camera_offline_health.json.hostRecording.active | default(true) | bool)
      - not (motion_levels_camera_offline_ready.json.ok | default(true) | bool)
      - not (motion_levels_camera_offline_ready.json.cameraConnected | default(true) | bool)
      - not (motion_levels_camera_offline_ready.json.commandReady | default(true) | bool)
      - not (motion_levels_camera_offline_ready.json.previewReady | default(true) | bool)
      - motion_levels_camera_offline_status.json.serial == motion_levels_camera.expected_serial
      - not (motion_levels_camera_offline_status.json.connected | bool)
      - not (motion_levels_camera_offline_status.json.usb_detected | bool)
      - not (motion_levels_camera_offline_status.json.command_ready | bool)
      - motion_levels_camera_offline_status.json.health == 'offline'
      - motion_levels_camera_offline_status.json.recording is none or not (motion_levels_camera_offline_status.json.recording | bool)
      - motion_levels_camera_offline_status.json.recording_files | default([]) | length == 0
      - motion_levels_camera_offline_capture.json.state | default('') == 'idle'
      - not (motion_levels_camera_offline_capture.json.active | default(true) | bool)
      - not (motion_levels_camera_offline_capture.json.loopEnabled | default(true) | bool)
      - not (motion_levels_camera_offline_capture.json.loopActive | default(true) | bool)
      - not (motion_levels_camera_offline_capture.json.interruptible | default(true) | bool)
      - not (motion_levels_camera_offline_host_recording.json.active | default(true) | bool)
      - motion_levels_camera_offline_host_recording.json.uploadQueue.queued | default(-1) | int == 0
      - motion_levels_camera_offline_host_recording.json.uploadQueue.pending | default(-1) | int == 0
      - motion_levels_camera_offline_host_recording.json.uploadQueue.retry | default(-1) | int == 0
      - motion_levels_camera_offline_jobs.json.summary.pending | default(-1) | int == 0
      - motion_levels_camera_offline_jobs.json.jobs | rejectattr('state', 'equalto', 'complete') | list | length == 0
    fail_msg: >-
      Camera-offline maintenance refused because the recorder is not completely
      idle, is not fail-closed, or still has durable media work.

- name: Require no active clip state or host spool entries
  ansible.builtin.shell: |
    set -eu
    database="{{ motion_levels_camera_state_root }}/state.db"
    spool="{{ motion_levels_state_root }}/camera-recordings/spool"
    test -f "$database"
    test -d "$spool"
    python3 - "$database" <<'PY'
    import sqlite3
    import sys

    connection = sqlite3.connect(sys.argv[1])
    try:
        count = connection.execute(
            "SELECT COUNT(*) FROM service_state WHERE key = 'active_recording_clip'"
        ).fetchone()[0]
    finally:
        connection.close()
    if count != 0:
        raise SystemExit("active_recording_clip is still present")
    PY
    first_spool_entry="$(find "$spool" -mindepth 1 -print -quit)"
    if [ -n "$first_spool_entry" ]; then
      echo "camera media spool is not empty" >&2
      exit 1
    fi
  args:
    executable: /bin/sh
  changed_when: false
