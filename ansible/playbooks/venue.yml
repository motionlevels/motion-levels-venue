---
- name: Build the pinned native venue release on the control machine
  hosts: motion_levels_venues
  gather_facts: false
  connection: local
  become: false
  any_errors_fatal: true
  serial: 1
  vars:
    motion_levels_repo_root: "{{ playbook_dir }}/../.."
    motion_levels_component_lock_path: "{{ motion_levels_repo_root }}/deploy/motionlevels-pc/venue-components.lock.json"
    motion_levels_local_build_root: "{{ lookup('env', 'MOTION_LEVELS_NATIVE_BUILD_ROOT') | default('/tmp/motion-levels-venue-native', true) }}"
    motion_levels_component_source_roots:
      controller: "{{ lookup('env', 'MOTION_LEVELS_CONTROLLER_SOURCE') | default(motion_levels_repo_root ~ '/../motion-levels-controller', true) }}"
      games: "{{ lookup('env', 'MOTION_LEVELS_GAMES_SOURCE') | default(motion_levels_repo_root ~ '/../motion-levels-games', true) }}"
      cameras: "{{ lookup('env', 'MOTION_LEVELS_CAMERAS_SOURCE') | default(motion_levels_repo_root ~ '/../motion-levels-cameras', true) }}"
  tasks:
    - name: Load the source component lock
      ansible.builtin.set_fact:
        motion_levels_component_lock: "{{ lookup('file', motion_levels_component_lock_path) | from_json }}"

    - name: Validate venue identity and native source pins
      ansible.builtin.assert:
        that:
          - motion_levels_component_lock.schema == 'motion-levels-venue-components-v2'
          - motion_levels_component_lock.components.controller.revision is match('^[0-9a-f]{40}$')
          - motion_levels_component_lock.components.controller.target == 'linux/amd64'
          - motion_levels_component_lock.components.controller.protocol == 'v1+v2'
          - motion_levels_component_lock.components.games.revision is match('^[0-9a-f]{40}$')
          - motion_levels_component_lock.components.cameras.revision is match('^[0-9a-f]{40}$')
          - motion_levels_venue.slug is match('^[a-z0-9]+(?:-[a-z0-9]+)*$')
          - motion_levels_venue.platform_room_id is match('^[0-9a-f-]{36}$')
          - motion_levels_camera.expected_serial | length > 0
          - motion_levels_camera.usb.vendor_id is match('^[0-9a-f]{4}$')
          - motion_levels_camera.usb.product_id is match('^[0-9a-f]{4}$')
          - motion_levels_camera.usb.expected_port is match('^[0-9]+-[0-9]+(?:\.[0-9]+)*$')
          - motion_levels_camera.usb.network_interface is match('^[a-zA-Z0-9_.:-]+$')
          - motion_levels_camera.usb.network_mac is match('^[0-9a-f]{2}(?::[0-9a-f]{2}){5}$')
          - motion_levels_camera.usb.host_address is match('^(?:[0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$')
          - motion_levels_camera.usb.dhcp_metric | int > 0
          - motion_levels_camera.gopro.base_url.startswith('http://')
          - motion_levels_network.floor.source_address == (motion_levels_network.lan.address | regex_replace('/.*$', ''))
          - motion_levels_camera.api_token_file.startswith('/etc/')
          - motion_levels_camera.platform_token_file.startswith('/etc/')
          - (motion_levels_display.alsa.card | int) >= 0
          - (motion_levels_display.alsa.device | int) >= 0
        fail_msg: "Venue host vars or deploy/motionlevels-pc/venue-components.lock.json are incomplete."

    - name: Inspect the configured local component source roots
      ansible.builtin.stat:
        path: "{{ item.value }}"
      register: motion_levels_component_sources
      loop: "{{ motion_levels_component_source_roots | dict2items }}"

    - name: Require every pinned component source checkout
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
        fail_msg: "The {{ item.item.key }} source checkout is unavailable at {{ item.item.value }}."
      loop: "{{ motion_levels_component_sources.results }}"
      loop_control:
        label: "{{ item.item.key }}"

    - name: Resolve the exact venue source revision
      ansible.builtin.command:
        cmd: git rev-parse HEAD
        chdir: "{{ motion_levels_repo_root }}"
      register: motion_levels_venue_revision_command
      changed_when: false

    - name: Refuse an uncommitted venue deployment  # noqa command-instead-of-module
      ansible.builtin.command:
        cmd: git status --porcelain --untracked-files=normal
        chdir: "{{ motion_levels_repo_root }}"
      register: motion_levels_venue_dirty
      changed_when: false
      failed_when: motion_levels_venue_dirty.stdout | length > 0

    - name: Build and verify the native source release
      ansible.builtin.command:
        cmd: "{{ motion_levels_repo_root }}/scripts/build-native-release.sh"
        chdir: "{{ motion_levels_repo_root }}"
      environment:
        MOTION_LEVELS_NATIVE_BUILD_ROOT: "{{ motion_levels_local_build_root }}"
        MOTION_LEVELS_CONTROLLER_SOURCE: "{{ motion_levels_component_source_roots.controller }}"
        MOTION_LEVELS_GAMES_SOURCE: "{{ motion_levels_component_source_roots.games }}"
        MOTION_LEVELS_CAMERAS_SOURCE: "{{ motion_levels_component_source_roots.cameras }}"
      register: motion_levels_native_build
      changed_when: false

    - name: Share immutable release facts
      ansible.builtin.set_fact:
        motion_levels_venue_revision: "{{ motion_levels_venue_revision_command.stdout | trim }}"
        motion_levels_local_release_dir: "{{ motion_levels_native_build.stdout_lines | last }}"
        motion_levels_remote_release_dir: "{{ motion_levels_install_root }}/releases/{{ motion_levels_venue_revision_command.stdout | trim }}"

- name: Deploy the native Debian venue stack
  hosts: motion_levels_venues
  gather_facts: true
  any_errors_fatal: true
  serial: 1
  vars:
    motion_levels_repo_root: "{{ playbook_dir }}/../.."
    motion_levels_candidate_dir: "{{ motion_levels_remote_release_dir }}.candidate"
    motion_levels_idle_games:
      - loop
      - animations
      - salvapantallas
      - ambient-comet
      - ambient-pulse
      - ambient-spark
    motion_levels_core_services:
      - motion-levels-floor-controller.service
      - motion-levels-venue-runtime.service
      - motion-levels-venue-supervisor.service
      - motion-levels-cameras.service
      - motion-levels-security-recorder.service
      - motion-levels-camera-helper.service
    motion_levels_display_services:
      - motion-levels-kiosk.service
      - motion-levels-hdmi-watchdog.service
    motion_levels_legacy_core_services:
      - motion-levels-floor-controller.service
      - motion-levels-game-engine.service
      - motion-levels-venue-supervisor.service
      - motion-levels-security-recorder.service
      - motion-levels-camera-helper.service
    motion_levels_legacy_restore_sources:
      - Caddyfile
      - motion-levels-floor-controller.service
      - motion-levels-game-engine.service
      - motion-levels-venue-supervisor.service
      - motion-levels-security-recorder.service
      - motion-levels-camera-helper.service
      - motion-levels-kiosk.service
      - motion-levels-hdmi-watchdog.service
      - motion-levels-player-kiosk
      - motion-levels-hdmi-watchdog
    motion_levels_cutover_conflicting_services:
      - motion-levels-hdmi-agent.service
      - motion-levels-audio-keepalive.service
      - motion-levels-audio.socket
    motion_levels_managed_live_files:
      - "{{ motion_levels_config_root }}/motion-levels.env"
      - "{{ motion_levels_config_root }}/stack.json"
      - "{{ motion_levels_state_root }}/public/stack.json"
      - /etc/asound.conf
      - /etc/motion-levels-cameras.env
      - /etc/caddy/Caddyfile
      - /etc/chromium/policies/managed/motion-levels-kiosk.json
      - /usr/local/bin/motion-levels-player-kiosk
      - /usr/local/bin/motion-levels-hdmi-watchdog
      - /usr/local/sbin/motion-levels-gopro-reconcile
      - /usr/local/sbin/motion-levels-lan-ip
      - /etc/udev/rules.d/72-motion-levels-gopro.rules
      - /etc/systemd/system/motion-levels-gopro-reconcile.service
      - /etc/systemd/system/motion-levels-lan-ip.service
      - /etc/systemd/system/motion-levels-floor-controller.service
      - /etc/systemd/system/motion-levels-venue-runtime.service
      - /etc/systemd/system/motion-levels-venue-supervisor.service
      - /etc/systemd/system/motion-levels-cameras.service
      - /etc/systemd/system/motion-levels-security-recorder.service
      - /etc/systemd/system/motion-levels-camera-helper.service
      - /etc/systemd/system/motion-levels-kiosk.service
      - /etc/systemd/system/motion-levels-hdmi-watchdog.service
    motion_levels_public_health_urls:
      - http://127.0.0.1/controller/health
      - http://127.0.0.1/engine/api/status
      - http://127.0.0.1/menu/
      - http://127.0.0.1/display/
    motion_levels_rollback_root: "{{ motion_levels_state_root }}/deploy-rollback/{{ motion_levels_venue_revision }}"
  pre_tasks:
    - name: Require Debian 13 amd64 with supported native runtimes
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == 'Debian'
          - ansible_facts.distribution_major_version | int >= 13
          - ansible_facts.architecture == 'x86_64'
        fail_msg: "Native venue deployment requires Debian 13+ on x86_64."

    - name: Install native host packages
      ansible.builtin.apt:
        name: "{{ motion_levels_runtime_packages }}"
        state: present
        update_cache: true

    - name: Verify native Node and Python versions
      ansible.builtin.shell: |
        set -eu
        node_major="$(node -p 'Number(process.versions.node.split(".")[0])')"
        python_minor="$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
        test "$node_major" -ge 20
        test "$python_minor" = "3.13"
      args:
        executable: /bin/sh
      changed_when: false

    - name: List legacy Docker workloads before native cutover
      ansible.builtin.command:
        argv:
          - docker
          - ps
          - --format
          - "{{ '{{' }}.Names{{ '}}' }}"
      register: motion_levels_legacy_containers
      changed_when: false
      failed_when: false

    - name: Refuse to remove Docker when it owns anything except the camera
      ansible.builtin.assert:
        that:
          - motion_levels_legacy_containers.rc != 0 or (motion_levels_legacy_containers.stdout_lines | difference(['motion-levels-cameras']) | length == 0)
        fail_msg: "Docker still owns non-camera workloads; migrate them before removing Docker."

  tasks:
    - name: Set the venue hostname
      ansible.builtin.hostname:
        name: "{{ motion_levels_venue.hostname }}"

    - name: Read the configured venue timezone
      ansible.builtin.command:
        argv:
          - timedatectl
          - show
          - --property=Timezone
          - --value
      register: motion_levels_current_timezone
      changed_when: false

    - name: Set the venue timezone
      ansible.builtin.command:
        argv:
          - timedatectl
          - set-timezone
          - "{{ motion_levels_venue.timezone }}"
      when: motion_levels_current_timezone.stdout | trim != motion_levels_venue.timezone
      changed_when: true

    - name: Prevent ARP flux between wired and wireless venue interfaces
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/90-motion-levels-arp.conf
        sysctl_set: true
        reload: true
        state: present
      loop:
        - { name: net.ipv4.conf.all.arp_ignore, value: "1" }
        - { name: net.ipv4.conf.all.arp_announce, value: "2" }

    - name: Create native release, state, and configuration directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner | default('root') }}"
        group: "{{ item.group | default('root') }}"
        mode: "{{ item.mode | default('0755') }}"
      loop:
        - { path: "{{ motion_levels_install_root }}" }
        - { path: "{{ motion_levels_install_root }}/releases" }
        - { path: "{{ motion_levels_state_root }}" }
        - { path: "{{ motion_levels_state_root }}/public" }
        - { path: "{{ motion_levels_state_root }}/floor-controller" }
        - { path: "{{ motion_levels_state_root }}/platform-asset-cache" }
        - { path: "{{ motion_levels_state_root }}/camera-recordings" }
        - { path: "{{ motion_levels_state_root }}/security-recordings" }
        - { path: "{{ motion_levels_config_root }}", mode: "0750" }

    - name: Ensure the camera runtime account exists
      ansible.builtin.group:
        name: motion-levels-cameras
        gid: "{{ motion_levels_camera_gid }}"
        system: true
      when: motion_levels_camera.enabled

    - name: Ensure the camera runtime user exists
      ansible.builtin.user:
        name: motion-levels-cameras
        uid: "{{ motion_levels_camera_uid }}"
        group: motion-levels-cameras
        system: true
        shell: /usr/sbin/nologin
        home: "{{ motion_levels_camera_state_root }}"
        create_home: false
      when: motion_levels_camera.enabled

    - name: Allow the camera account to traverse the shared config directory
      ansible.builtin.file:
        path: "{{ motion_levels_config_root }}"
        state: directory
        owner: root
        group: motion-levels-cameras
        mode: "0710"
      when: motion_levels_camera.enabled

    - name: Create camera state directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: motion-levels-cameras
        group: motion-levels-cameras
        mode: "0750"
      loop:
        - "{{ motion_levels_camera_state_root }}"
        - "{{ motion_levels_state_root }}/camera-recordings"
      when: motion_levels_camera.enabled

    - name: Check required camera secret files
      ansible.builtin.stat:
        path: "{{ item }}"
      register: motion_levels_camera_secrets
      loop:
        - "{{ motion_levels_camera.api_token_file }}"
        - "{{ motion_levels_camera.platform_token_file }}"
      when: motion_levels_camera.enabled

    - name: Require camera secrets to exist outside Git
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.size > 0
        fail_msg: "Required host secret is missing or empty: {{ item.item }}"
      loop: "{{ motion_levels_camera_secrets.results | default([]) }}"
      no_log: true

    - name: Allow the native camera account to read its secrets
      ansible.builtin.file:
        path: "{{ item }}"
        owner: root
        group: motion-levels-cameras
        mode: "0440"
      loop:
        - "{{ motion_levels_camera.api_token_file }}"
        - "{{ motion_levels_camera.platform_token_file }}"
      no_log: true
      when: motion_levels_camera.enabled

    - name: Inspect the immutable release directory
      ansible.builtin.stat:
        path: "{{ motion_levels_remote_release_dir }}"
      register: motion_levels_release_directory

    - name: Inspect the immutable release manifest
      ansible.builtin.stat:
        path: "{{ motion_levels_remote_release_dir }}/release-manifest.json"
      register: motion_levels_release_manifest

    - name: Inspect the immutable release completion marker
      ansible.builtin.stat:
        path: "{{ motion_levels_remote_release_dir }}/.complete"
      register: motion_levels_release_complete

    - name: Refuse a partial immutable release
      ansible.builtin.assert:
        that:
          - >-
            not motion_levels_release_directory.stat.exists
            or (
              motion_levels_release_directory.stat.isdir
              and (motion_levels_release_manifest.stat.isreg | default(false))
              and (motion_levels_release_complete.stat.isreg | default(false))
            )
        fail_msg: >-
          {{ motion_levels_remote_release_dir }} exists without both its verified
          manifest and .complete marker; inspect it instead of overwriting it.

    - name: Stage the verified native release
      when: not motion_levels_release_directory.stat.exists
      block:
        - name: Recreate the candidate directory
          ansible.builtin.file:
            path: "{{ motion_levels_candidate_dir }}"
            state: "{{ item }}"
            mode: "0755"
          loop:
            - absent
            - directory

        - name: Transfer only built runtime output to the venue
          ansible.posix.synchronize:
            src: "{{ motion_levels_local_release_dir }}/"
            dest: "{{ motion_levels_candidate_dir }}/"
            archive: true
            checksum: true
            delete: true

        - name: Verify the candidate manifest without relying on deployed scripts
          ansible.builtin.shell: |
            python3 - "{{ motion_levels_candidate_dir }}" <<'PY'
            from hashlib import sha256
            import json
            from pathlib import Path
            import sys
            root = Path(sys.argv[1])
            manifest = json.loads((root / "release-manifest.json").read_text())
            assert manifest["schema"] == "motion-levels-native-venue-release-v1"
            for record in manifest["files"]:
                path = root / record["path"]
                payload = path.readlink().as_posix().encode() if path.is_symlink() else path.read_bytes()
                assert len(payload) == record["bytes"]
                assert sha256(payload).hexdigest() == record["sha256"]
            PY
          args:
            executable: /bin/sh
          changed_when: false

        - name: Create the candidate camera virtual environment
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - -m
              - venv
              - "{{ motion_levels_candidate_dir }}/venvs/cameras"
          changed_when: true

        - name: Install exact camera dependencies and verify pinned source
          ansible.builtin.shell: |
            set -eu
            venv="{{ motion_levels_candidate_dir }}/venvs/cameras"
            source="{{ motion_levels_candidate_dir }}/components/cameras/source"
            "$venv/bin/pip" install --disable-pip-version-check \
              --no-deps --only-binary=:all: --require-hashes \
              --requirement "{{ motion_levels_candidate_dir }}/components/cameras/requirements-native.lock"
            PYTHONPATH="$source" "$venv/bin/python" -c \
              'import motion_levels_cameras; from motion_levels_cameras.main import run'
          args:
            executable: /bin/sh
          changed_when: true

        - name: Mark the verified candidate complete
          ansible.builtin.file:
            path: "{{ motion_levels_candidate_dir }}/.complete"
            state: touch
            owner: root
            group: root
            mode: "0644"

        - name: Inspect the candidate completion marker
          ansible.builtin.stat:
            path: "{{ motion_levels_candidate_dir }}/.complete"
          register: motion_levels_candidate_complete

        - name: Require a regular candidate completion marker
          ansible.builtin.assert:
            that:
              - motion_levels_candidate_complete.stat.isreg | default(false)
            fail_msg: "The native candidate is not complete and cannot be promoted."

        - name: Make the candidate immutable to the camera account
          ansible.builtin.file:
            path: "{{ motion_levels_candidate_dir }}"
            state: directory
            owner: root
            group: root
            mode: "u=rwX,go=rX"
            recurse: true

        - name: Promote the complete candidate release
          ansible.builtin.command:
            argv:
              - /bin/mv
              - "{{ motion_levels_candidate_dir }}"
              - "{{ motion_levels_remote_release_dir }}"
          changed_when: true

    - name: Ensure the Debian network interface configuration directory exists
      ansible.builtin.file:
        path: /etc/network/interfaces.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: motion_levels_camera.enabled

    - name: Install the venue-specific GoPro USB network configuration
      ansible.builtin.template:
        src: "{{ motion_levels_repo_root }}/ansible/templates/motion-levels-gopro-interface.j2"
        dest: /etc/network/interfaces.d/gopro
        owner: root
        group: root
        mode: "0644"
      when: motion_levels_camera.enabled

    - name: Resolve the currently active native release before cutover
      ansible.builtin.shell: |
        set -eu
        current="{{ motion_levels_install_root }}/current"
        test -L "$current"
        target="$(readlink -f "$current")"
        test -d "$target"
        printf '%s\n' "$target"
      args:
        executable: /bin/sh
      register: motion_levels_pre_cutover_native
      changed_when: false
      failed_when: false

    - name: Inspect the complete first-migration legacy rollback source
      ansible.builtin.stat:
        path: "/opt/motion-levels/rebuild/current/deploy/motionlevels-pc/{{ item }}"
        follow: true
      register: motion_levels_legacy_restore_checks
      loop: "{{ motion_levels_legacy_restore_sources }}"

    - name: Record whether the legacy rollback source is complete
      ansible.builtin.set_fact:
        motion_levels_legacy_source_ready: >-
          {{
            (
              motion_levels_legacy_restore_checks.results
              | selectattr('stat.exists', 'defined')
              | selectattr('stat.exists')
              | list
              | length
            ) == (motion_levels_legacy_restore_sources | length)
          }}

    - name: Detect the legacy engine service before cutover
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - --quiet
          - motion-levels-game-engine.service
      register: motion_levels_legacy_engine_active
      changed_when: false
      failed_when: false

    - name: Detect the native engine service before cutover
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - --quiet
          - motion-levels-venue-runtime.service
      register: motion_levels_native_engine_active
      changed_when: false
      failed_when: false

    - name: Detect an engine listener before cutover
      ansible.builtin.shell: |
        set -o pipefail
        ss -H -ltn | awk '$4 ~ /:4102$/ { found = 1 } END { exit !found }'
      args:
        executable: /bin/bash
      register: motion_levels_engine_listener
      changed_when: false
      failed_when: false

    - name: Detect any active managed venue runtime before cutover
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - --quiet
          - "{{ item }}"
      register: motion_levels_pre_cutover_service_states
      changed_when: false
      failed_when: false
      loop: >-
        {{
          (
            motion_levels_core_services
            + motion_levels_display_services
            + motion_levels_cutover_conflicting_services
            + ['motion-levels-game-engine.service']
          ) | unique | list
        }}

    - name: Capture active managed venue services
      ansible.builtin.set_fact:
        motion_levels_pre_cutover_active_services: >-
          {{
            motion_levels_pre_cutover_service_states.results
            | selectattr('rc', 'equalto', 0)
            | map(attribute='item')
            | list
          }}

    - name: Read venue state before any live replacement
      ansible.builtin.uri:
        url: http://127.0.0.1/engine/api/status
        return_content: true
        status_code: 200
        timeout: 5
      register: motion_levels_cutover_status
      changed_when: false
      failed_when: false

    - name: Require a known engine or a genuinely fresh idle host
      ansible.builtin.assert:
        that:
          - >-
            (motion_levels_cutover_status.status | default(0) | int) == 200
            or (
              motion_levels_legacy_engine_active.rc != 0
              and motion_levels_native_engine_active.rc != 0
              and motion_levels_engine_listener.rc != 0
              and (motion_levels_pre_cutover_active_services | length) == 0
              and not ('motion-levels-cameras' in (motion_levels_legacy_containers.stdout_lines | default([])))
            )
          - >-
            (motion_levels_cutover_status.status | default(0) | int) != 200
            or motion_levels_pre_cutover_native.rc == 0
            or (motion_levels_legacy_engine_active.rc == 0 and motion_levels_legacy_source_ready)
        fail_msg: >-
          Native cutover refused because the engine state is unavailable while a
          listener/service exists, or its rollback provenance is not complete.

    - name: Require an idle venue before disrupting runtime services
      ansible.builtin.assert:
        that:
          - motion_levels_cutover_status.json is mapping
          - >-
            (motion_levels_cutover_status.json.currentGame | default('')) in motion_levels_idle_games
            or (motion_levels_cutover_status.json.currentGame | default('')).startswith('animation-')
          - (motion_levels_cutover_status.json.phase | default('')) in ['idle', 'ambient']
          - motion_levels_cutover_status.json.venueSessionId | default('', true) | string | length == 0
        fail_msg: >-
          Native cutover refused while the venue is busy: game={{ motion_levels_cutover_status.json.currentGame | default('unknown') }},
          phase={{ motion_levels_cutover_status.json.phase | default('unknown') }},
          venueSessionId={{ motion_levels_cutover_status.json.venueSessionId | default('none', true) }}.
      when: (motion_levels_cutover_status.status | default(0) | int) == 200

    - name: Refuse to interrupt an active camera capture during cutover
      ansible.builtin.import_tasks: ../tasks/verify-camera-cutover-safety.yml

    - name: Classify the pre-cutover stack for rollback
      ansible.builtin.set_fact:
        motion_levels_pre_cutover_stack: >-
          {{
            'native' if motion_levels_pre_cutover_native.rc == 0
            else 'legacy' if motion_levels_legacy_engine_active.rc == 0 and motion_levels_legacy_source_ready
            else 'fresh'
          }}
        motion_levels_legacy_camera_was_running: >-
          {{ 'motion-levels-cameras' in (motion_levels_legacy_containers.stdout_lines | default([])) }}

    - name: Record whether Caddy was active before cutover
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - --quiet
          - caddy.service
      register: motion_levels_caddy_was_active
      changed_when: false
      failed_when: false

    - name: Record active legacy display and audio services before cutover
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - --quiet
          - "{{ item }}"
      register: motion_levels_conflicting_service_states
      changed_when: false
      failed_when: false
      loop: "{{ motion_levels_cutover_conflicting_services }}"

    - name: Capture legacy display and audio services that rollback must restart
      ansible.builtin.set_fact:
        motion_levels_pre_cutover_conflicting_services: >-
          {{
            motion_levels_conflicting_service_states.results
            | selectattr('rc', 'equalto', 0)
            | map(attribute='item')
            | list
          }}

    - name: Recreate the exact live-file rollback snapshot directory
      ansible.builtin.file:
        path: "{{ motion_levels_rollback_root }}"
        state: "{{ item }}"
        owner: root
        group: root
        mode: "0700"
      loop:
        - absent
        - directory

    - name: Inspect live files before native replacement
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      register: motion_levels_live_file_stats
      loop: "{{ motion_levels_managed_live_files }}"

    - name: Snapshot every pre-existing live file for rollback
      ansible.builtin.copy:
        src: "{{ item.item }}"
        dest: "{{ motion_levels_rollback_root }}/{{ item.item | regex_replace('^/', '') | replace('/', '__') }}"
        remote_src: true
        owner: root
        group: root
        mode: preserve
      loop: "{{ motion_levels_live_file_stats.results }}"
      when: item.stat.exists

    - name: Initialize the stable venue controller identity
      ansible.builtin.copy:
        dest: "{{ motion_levels_state_root }}/floor-controller/controller-id"
        content: "{{ motion_levels_venue.platform_room_id }}\n"
        owner: root
        group: root
        mode: "0644"
        force: false

    - name: Activate and health-gate the native release
      block:
        - name: Replace live native files inside the rollback boundary
          ansible.builtin.import_tasks: ../tasks/install-native-live.yml

        - name: Stop the legacy runtime before binding the native runtime port
          ansible.builtin.systemd_service:
            name: motion-levels-game-engine.service
            state: stopped
          failed_when: false

        - name: Stop legacy display and audio services before native activation
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            state: stopped
          loop: "{{ motion_levels_cutover_conflicting_services }}"
          failed_when: false

        - name: Stop the previous Docker camera after the native candidate is complete
          ansible.builtin.command:
            cmd: docker stop --time 45 motion-levels-cameras
          register: motion_levels_old_camera_container
          changed_when: motion_levels_old_camera_container.rc == 0
          failed_when: false
          when: motion_levels_legacy_camera_was_running

        - name: Activate the native venue release atomically
          ansible.builtin.shell: |
            set -eu
            root="{{ motion_levels_install_root }}"
            candidate="{{ motion_levels_remote_release_dir }}"
            active=""
            test -f "$candidate/release-manifest.json"
            test -f "$candidate/.complete"
            if [ -L "$root/current" ]; then
              active="$(readlink -f "$root/current")"
            fi
            if [ "$active" = "$candidate" ]; then
              echo already-active
              exit 0
            fi
            if [ -n "$active" ] && [ -d "$active" ]; then
              ln -sfn "$active" "$root/previous"
            fi
            ln -sfn "$candidate" "$root/current"
          args:
            executable: /bin/sh
          register: motion_levels_release_activation
          changed_when: motion_levels_release_activation.stdout | trim != 'already-active'

        - name: Install deployed stack metadata
          ansible.builtin.copy:
            dest: "{{ motion_levels_config_root }}/stack.json"
            owner: root
            group: root
            mode: "0644"
            content: |
              {
                "schema": "motion-levels-native-stack-v1",
                "revision": "{{ motion_levels_venue_revision }}",
                "deployed_at": "{{ ansible_facts.date_time.iso8601 }}",
                "venue": "{{ motion_levels_venue.slug }}",
                "target": "{{ inventory_hostname }}",
                "deployment_health_contract": "software-only",
                "hardware_state_contract": "observed-not-gated"
              }

        - name: Publish non-secret deployed stack metadata
          ansible.builtin.copy:
            src: "{{ motion_levels_config_root }}/stack.json"
            dest: "{{ motion_levels_state_root }}/public/stack.json"
            remote_src: true
            owner: root
            group: root
            mode: "0644"

        - name: Reload systemd for the activated release
          ansible.builtin.systemd_service:
            daemon_reload: true

        - name: Queue exact GoPro hotplug reconciliation without gating activation
          ansible.builtin.command:
            argv:
              - timeout
              - "5"
              - udevadm
              - trigger
              - --action=change
              - --subsystem-match=usb
              - "--attr-match=idVendor={{ motion_levels_camera.usb.vendor_id }}"
              - "--attr-match=idProduct={{ motion_levels_camera.usb.product_id }}"
          changed_when: false
          failed_when: false
          when: motion_levels_camera.enabled

        - name: Enable and restart the venue LAN address reconciler
          ansible.builtin.systemd_service:
            name: motion-levels-lan-ip.service
            enabled: true
            state: restarted

        - name: Verify the venue LAN address reconciler process
          ansible.builtin.command:
            argv:
              - systemctl
              - show
              - motion-levels-lan-ip.service
              - --property=SubState
              - --value
          register: motion_levels_lan_reconciler_substate
          changed_when: false
          failed_when: motion_levels_lan_reconciler_substate.stdout | trim != 'running'

        - name: Validate the rendered Caddy configuration
          ansible.builtin.command:
            cmd: caddy validate --config /etc/caddy/Caddyfile
          changed_when: false

        - name: Enable and restart native core services in dependency order
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            enabled: true
            state: restarted
          loop: "{{ motion_levels_core_services }}"
          when: item != 'motion-levels-cameras.service' or motion_levels_camera.enabled

        - name: Verify native core service health before switching the web boundary
          ansible.builtin.uri:
            url: "{{ item }}"
            status_code: 200
          register: motion_levels_health
          retries: 60
          delay: 2
          until: motion_levels_health.status == 200
          loop:
            - http://127.0.0.1:4101/health
            - http://127.0.0.1:4102/api/status
            - http://127.0.0.1:4103/v1/snapshot

        - name: Verify native camera service health independently of hardware
          ansible.builtin.uri:
            url: http://127.0.0.1:8040/healthz
            return_content: true
            status_code: 200
          register: motion_levels_camera_health
          retries: 60
          delay: 2
          until:
            - motion_levels_camera_health.status == 200
            - motion_levels_camera_health.json.ok | default(false) | bool
            - motion_levels_camera_health.json.mediaPipelineConfigured | default(false) | bool
          when: motion_levels_camera.enabled

        - name: Enable and restart Caddy on the activated release
          ansible.builtin.systemd_service:
            name: caddy.service
            enabled: true
            state: restarted

        - name: Verify the public engine, menu, and display routes before kiosk restart
          ansible.builtin.uri:
            url: "{{ item }}"
            status_code: 200
          register: motion_levels_public_health
          retries: 60
          delay: 2
          until: motion_levels_public_health.status == 200
          loop: "{{ motion_levels_public_health_urls }}"

        - name: Enable and restart the kiosk and hotplug watchdog
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            enabled: true
            state: restarted
          loop: "{{ motion_levels_display_services }}"

        - name: Verify the complete venue snapshot
          ansible.builtin.uri:
            url: http://127.0.0.1/venue-api/v1/snapshot
            return_content: true
            status_code: 200
          register: motion_levels_venue_snapshot
          retries: 60
          delay: 2
          until: motion_levels_venue_snapshot.status == 200

      rescue:
        - name: Stop every native unit before rollback
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            state: stopped
          loop: >-
            {{
              (motion_levels_display_services | reverse | list)
              + (motion_levels_core_services | reverse | list)
              + ['motion-levels-gopro-reconcile.service', 'motion-levels-lan-ip.service']
            }}
          failed_when: false

        - name: Stop Caddy before restoring its exact previous configuration
          ansible.builtin.systemd_service:
            name: caddy.service
            state: stopped
          failed_when: false

        - name: Recheck the first-migration legacy rollback source
          ansible.builtin.stat:
            path: "/opt/motion-levels/rebuild/current/deploy/motionlevels-pc/{{ item }}"
            follow: true
          register: motion_levels_legacy_rollback_checks
          loop: "{{ motion_levels_legacy_restore_sources }}"
          when: motion_levels_pre_cutover_stack == 'legacy'

        - name: Refuse to invent a legacy rollback without its source
          ansible.builtin.assert:
            that:
              - >-
                (
                  motion_levels_legacy_rollback_checks.results
                  | selectattr('stat.exists', 'defined')
                  | selectattr('stat.exists')
                  | list
                  | length
                ) == (motion_levels_legacy_restore_sources | length)
            fail_msg: "The captured legacy stack cannot be restored because its source is incomplete."
          when: motion_levels_pre_cutover_stack == 'legacy'

        - name: Remove files introduced by the failed native activation
          ansible.builtin.file:
            path: "{{ item.item }}"
            state: absent
          loop: "{{ motion_levels_live_file_stats.results }}"
          when: not item.stat.exists

        - name: Restore every pre-existing live file exactly
          ansible.builtin.copy:
            src: "{{ motion_levels_rollback_root }}/{{ item.item | regex_replace('^/', '') | replace('/', '__') }}"
            dest: "{{ item.item }}"
            remote_src: true
            owner: "{{ item.stat.pw_name | default(item.stat.uid) }}"
            group: "{{ item.stat.gr_name | default(item.stat.gid) }}"
            mode: "{{ item.stat.mode }}"
          loop: "{{ motion_levels_live_file_stats.results }}"
          when: item.stat.exists

        - name: Reload restored GoPro hotplug rules
          ansible.builtin.command:
            cmd: udevadm control --reload-rules
          changed_when: false
          when: motion_levels_camera.enabled

        - name: Restore the exact prior native release symlink
          ansible.builtin.command:
            argv:
              - ln
              - -sfn
              - "{{ motion_levels_pre_cutover_native.stdout | trim }}"
              - "{{ motion_levels_install_root }}/current"
          changed_when: true
          when: motion_levels_pre_cutover_stack == 'native'

        - name: Remove the failed first native release symlink
          ansible.builtin.file:
            path: "{{ motion_levels_install_root }}/current"
            state: absent
          when: motion_levels_pre_cutover_stack != 'native'

        - name: Reload systemd after exact rollback
          ansible.builtin.systemd_service:
            daemon_reload: true

        - name: Restart legacy display and audio services that were previously active
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            enabled: true
            state: restarted
          loop: "{{ motion_levels_pre_cutover_conflicting_services }}"

        - name: Restart the previous native core stack
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            state: restarted
          loop: "{{ motion_levels_core_services }}"
          when:
            - motion_levels_pre_cutover_stack == 'native'
            - item != 'motion-levels-cameras.service' or motion_levels_camera.enabled

        - name: Restart the first-migration legacy core stack
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            state: restarted
          loop: "{{ motion_levels_legacy_core_services }}"
          when: motion_levels_pre_cutover_stack == 'legacy'

        - name: Restore the Docker camera only when it was running before migration
          ansible.builtin.command:
            cmd: docker start motion-levels-cameras
          register: motion_levels_legacy_camera_restore
          changed_when: "'already running' not in (motion_levels_legacy_camera_restore.stdout | default(''))"
          when:
            - motion_levels_pre_cutover_stack == 'legacy'
            - motion_levels_legacy_camera_was_running

        - name: Restart Caddy for the restored stack
          ansible.builtin.systemd_service:
            name: caddy.service
            state: restarted
          when: >-
            motion_levels_pre_cutover_stack in ['native', 'legacy']
            or motion_levels_caddy_was_active.rc == 0

        - name: Restart the restored native or legacy display stack
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            state: restarted
          loop: "{{ motion_levels_display_services }}"
          when: motion_levels_pre_cutover_stack in ['native', 'legacy']

        - name: Health-check the restored stack
          ansible.builtin.uri:
            url: "{{ item }}"
            status_code: 200
          register: motion_levels_rollback_health
          retries: 60
          delay: 2
          until: motion_levels_rollback_health.status == 200
          loop: >-
            {{
              motion_levels_public_health_urls
              + ['http://127.0.0.1/venue-api/v1/snapshot']
              + (['http://127.0.0.1:8040/healthz'] if motion_levels_camera.enabled else [])
            }}
          when: motion_levels_pre_cutover_stack in ['native', 'legacy']

        - name: Fail after restoring or safely halting the previous stack
          ansible.builtin.fail:
            msg: "{{ motion_levels_rollback_failure_message }}"
          vars:
            motion_levels_rollback_failure_message: >-
              Native release {{ motion_levels_venue_revision }} failed health checks.
              Pre-cutover stack={{ motion_levels_pre_cutover_stack }};
              {{
                'the captured stack was restored and health-checked'
                if motion_levels_pre_cutover_stack in ['native', 'legacy']
                else 'no previous stack existed, so native units were stopped and the original files were restored'
              }}.

    - name: Remove the legacy non-serial GoPro hotplug rule after healthy cutover
      ansible.builtin.file:
        path: /etc/udev/rules.d/72-motion-levels-gopro-reconcile.rules
        state: absent
      register: motion_levels_legacy_gopro_rule
      when: motion_levels_camera.enabled

    - name: Reload udev after retiring the legacy GoPro rule
      ansible.builtin.command:
        cmd: udevadm control --reload-rules
      changed_when: true
      when:
        - motion_levels_camera.enabled
        - motion_levels_legacy_gopro_rule.changed

    - name: Disable retired native and container services after verified cutover
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop: "{{ motion_levels_retired_services }}"
      failed_when: false

    - name: Remove retired unit files after verified cutover
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}"
        state: absent
      loop: "{{ motion_levels_retired_services }}"

    - name: Stop and disable the retired container runtime
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - docker.socket
        - docker.service
        - containerd.service
      failed_when: false

    - name: Remove the retired container control plane after verified cutover
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ motion_levels_retired_container_control_paths }}"

    - name: Reload systemd after retiring old units and container control files
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Clear failed state for units retired after healthy cutover
      ansible.builtin.command:
        argv:
          - systemctl
          - reset-failed
      changed_when: false

    - name: Remove successful and stale cutover rollback snapshots
      ansible.builtin.file:
        path: "{{ motion_levels_state_root }}/deploy-rollback"
        state: absent

    - name: Retain only current and previous native releases
      ansible.builtin.shell: |
        set -eu
        root="{{ motion_levels_install_root }}"
        current="$(readlink -f "$root/current")"
        previous=""
        if [ -L "$root/previous" ]; then previous="$(readlink -f "$root/previous")"; fi
        for release in "$root"/releases/*; do
          test -d "$release" || continue
          [ "$release" = "$current" ] && continue
          [ -n "$previous" ] && [ "$release" = "$previous" ] && continue
          rm -rf -- "$release"
        done
      args:
        executable: /bin/sh
      changed_when: false
