---
- name: Deploy Motion Levels venue stack
  hosts: motion_levels_venues
  gather_facts: true
  vars:
    motion_levels_repo_root: "{{ playbook_dir }}/../.."
    motion_levels_remote_src: "{{ motion_levels_remote_root }}/current"
    motion_levels_releases_root: "{{ motion_levels_remote_root }}/releases"
    motion_levels_venue_components_lock_path: "{{ motion_levels_repo_root }}/deploy/motionlevels-pc/venue-components.lock.json"
    motion_levels_ghcr_username: "{{ lookup('env', 'GHCR_USERNAME') | default('lobis', true) }}"
    motion_levels_ghcr_token: "{{ lookup('env', 'GHCR_TOKEN') }}"
    motion_levels_deploy_mode: "{{ lookup('env', 'MOTION_LEVELS_DEPLOY_MODE') | default('all', true) }}"
    motion_levels_frontend_modes: ["all", "frontends"]
    motion_levels_runtime_modes: ["all", "runtime"]
    motion_levels_services:
      - motion-levels-floor-controller.service
      - motion-levels-game-engine.service
      - motion-levels-venue-supervisor.service
      - motion-levels-security-recorder.service
      - motion-levels-camera-helper.service
      - motion-levels-kiosk.service
      - motion-levels-hdmi-watchdog.service
    motion_levels_old_services:
      - motion-levels-player-menu.service
      - motion-levels-player-display.service
      - motion-levels-player-tv.service
      - motion-levels-camera-recorder.service
      - motion-levels-venue-containers.service
      - motion-levels-player-container.service
      - motion-levels-display-wayland.service
      - motion-levels.service
    motion_levels_health_urls:
      - http://127.0.0.1/controller/health
      - http://127.0.0.1/engine/api/status
      - http://127.0.0.1/stack.json
      - http://127.0.0.1/menu/
      - http://127.0.0.1/display/
      - http://127.0.0.1:4101/health
      - http://127.0.0.1:4102/api/status
      - http://127.0.0.1:4103/health
      - http://127.0.0.1/venue-api/v1/snapshot
    motion_levels_frontend_health_urls:
      - http://127.0.0.1/stack.json
      - http://127.0.0.1/menu/
      - http://127.0.0.1/display/
    motion_levels_common_sync_items:
      - src: deploy/
        dest: "{{ motion_levels_remote_src }}/deploy/"
      - src: game-bundles/
        dest: "{{ motion_levels_remote_src }}/game-bundles/"
    motion_levels_runtime_sync_items:
      - src: go.mod
        dest: "{{ motion_levels_remote_src }}/"
      - src: go.sum
        dest: "{{ motion_levels_remote_src }}/"
      - src: game-engine/
        dest: "{{ motion_levels_remote_src }}/game-engine/"
      - src: packages/
        dest: "{{ motion_levels_remote_src }}/packages/"
      - src: content/
        dest: "{{ motion_levels_remote_src }}/content/"
      - src: content/
        dest: "{{ motion_levels_remote_root }}/content/"
    motion_levels_frontend_sync_items:
      - src: apps/player-menu/
        dest: "{{ motion_levels_remote_src }}/apps/player-menu/"
      - src: apps/player-display/
        dest: "{{ motion_levels_remote_src }}/apps/player-display/"
      - src: apps/player-menu/dist/
        dest: "{{ motion_levels_remote_root }}/apps/player-menu/dist/"
      - src: apps/player-display/dist/
        dest: "{{ motion_levels_remote_root }}/apps/player-display/dist/"
    motion_levels_rsync_opts:
      - --exclude=node_modules
      - --exclude=release
      - --exclude=.vite
      - --exclude=*.tsbuildinfo
      - --exclude=recordings
      - --exclude=game-recordings
      - --exclude=*.pbstream
      - --exclude=*.pbstream.*
      - --exclude=.DS_Store
  tasks:
    - name: Load the immutable venue component lock
      ansible.builtin.set_fact:
        motion_levels_venue_components_lock: >-
          {{ lookup('file', motion_levels_venue_components_lock_path) | from_json }}

    - name: Validate the pinned controller component contract
      ansible.builtin.assert:
        that:
          - motion_levels_venue_components_lock.schema == 'motion-levels-venue-components-v1'
          - motion_levels_venue_components_lock.components.controller.repository == 'ghcr.io/motionlevels/motion-levels-controller'
          - motion_levels_venue_components_lock.components.controller.revision is match('^[0-9a-f]{40}$')
          - motion_levels_venue_components_lock.components.controller.platform == 'linux/amd64'
          - motion_levels_venue_components_lock.components.controller.protocol == 'v1+v2'
        fail_msg: >-
          deploy/motionlevels-pc/venue-components.lock.json must pin the
          controller repository, full revision, linux/amd64 platform, and v1+v2 protocol.
      delegate_to: localhost
      become: false

    - name: Validate venue deploy mode
      ansible.builtin.assert:
        that:
          - motion_levels_deploy_mode in ["all", "frontends", "runtime"]
        fail_msg: "motion_levels_deploy_mode must be one of: all, frontends, runtime"

    - name: Resolve venue bundle revision
      ansible.builtin.command:
        cmd: git rev-parse HEAD
        chdir: "{{ motion_levels_repo_root }}"
      delegate_to: localhost
      become: false
      register: motion_levels_venue_revision
      changed_when: false

    - name: Validate GHCR pull credentials
      ansible.builtin.assert:
        that:
          - motion_levels_ghcr_token | length > 0
        fail_msg: Set GHCR_TOKEN to a classic GitHub token with read:packages.
      no_log: true

    - name: Set venue bundle release facts
      ansible.builtin.set_fact:
        motion_levels_venue_image: "ghcr.io/motionlevels/motion-levels-venue-bundle:sha-{{ motion_levels_venue_revision.stdout | trim }}"
        motion_levels_venue_release_dir: "{{ motion_levels_releases_root }}/{{ motion_levels_venue_revision.stdout | trim }}"
        motion_levels_controller_image: >-
          {{
            motion_levels_venue_components_lock.components.controller.repository
          }}:sha-{{
            motion_levels_venue_components_lock.components.controller.revision
          }}

    - name: Verify pinned motion-levels-games bundle
      ansible.builtin.command:
        cmd: node scripts/verify-motion-levels-games-bundle.mjs
        chdir: "{{ motion_levels_repo_root }}"
      changed_when: false
      delegate_to: localhost
      run_once: true

    - name: Install fixed LAN address helper
      ansible.builtin.copy:
        dest: /usr/local/sbin/motion-levels-lan-ip
        mode: "0755"
        content: |
          #!/bin/sh
          set -eu

          IFACE="{{ motion_levels_lan_interface }}"
          IP="{{ motion_levels_lan_ipv4 }}"
          ADDR="{{ motion_levels_lan_ipv4 | regex_replace('/.*$', '') }}"
          GATEWAY="{{ motion_levels_lan_gateway | default('') }}"

          if ! ip link show dev "$IFACE" >/dev/null 2>&1; then
            echo "Interface $IFACE not found" >&2
            exit 1
          fi

          ip link set "$IFACE" up
          ip addr show dev "$IFACE" | grep -q "${ADDR}/" || ip addr add "$IP" dev "$IFACE"

          if [ -n "$GATEWAY" ] && ! ip route show default dev "$IFACE" | grep -q "default via $GATEWAY"; then
            ip route replace default via "$GATEWAY" dev "$IFACE" metric 1002
          fi
      when: motion_levels_lan_interface is defined and motion_levels_lan_ipv4 is defined

    - name: Install fixed LAN address service
      ansible.builtin.copy:
        dest: /etc/systemd/system/motion-levels-lan-ip.service
        mode: "0644"
        content: |
          [Unit]
          Description=Keep Motion Levels Ethernet LAN address
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/motion-levels-lan-ip
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
      when: motion_levels_lan_interface is defined and motion_levels_lan_ipv4 is defined

    - name: Enable fixed LAN address service
      ansible.builtin.systemd_service:
        name: motion-levels-lan-ip.service
        daemon_reload: true
        enabled: true
        state: started
      when: motion_levels_lan_interface is defined and motion_levels_lan_ipv4 is defined

    - name: Prevent ARP flux on the venue LAN
      # The venue PC can end up with both its ethernet and wifi interfaces on
      # the same 192.168.1.0/24 LAN. With the default arp_ignore/arp_announce
      # the box answers ARP for an interface address on every interface, so a
      # LAN client may cache the wifi MAC for the ethernet IP and its traffic
      # then takes an asymmetric path that switches/clients silently drop. This
      # makes each interface only answer/announce ARP for its own address.
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/90-motion-levels-arp.conf
        sysctl_set: true
        reload: true
        state: present
      loop:
        - { name: net.ipv4.conf.all.arp_ignore, value: "1" }
        - { name: net.ipv4.conf.all.arp_announce, value: "2" }

    - name: Pin the venue LAN address statically in dhcpcd
      # The venue PC uses dhcpcd. A DHCP lease on the ethernet interface is not
      # stable (it can land on a different address and wipe any IP added out of
      # band), so the wired LAN address — the only place /tv and /cameras are
      # served — is pinned here. This keeps the ethernet interface on the fixed
      # 192.168.1.142 used by the Caddy host matchers.
      ansible.builtin.blockinfile:
        path: /etc/dhcpcd.conf
        marker: "# {mark} MOTION LEVELS LAN"
        block: |
          interface {{ motion_levels_lan_interface }}
          static ip_address={{ motion_levels_lan_ipv4 }}
          static routers={{ motion_levels_lan_gateway }}
          static domain_name_servers={{ motion_levels_lan_gateway }}
        create: false
      notify: Reconfigure dhcpcd LAN interface
      when:
        - motion_levels_lan_interface is defined
        - motion_levels_lan_ipv4 is defined
        - motion_levels_lan_gateway is defined

    - name: Remove legacy venue-local recording files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ motion_levels_remote_root }}/var/floor-controller/recordings"
        - "{{ motion_levels_remote_root }}/var/game-engine/replays"
      when: motion_levels_deploy_mode in motion_levels_runtime_modes

    - name: Install runtime packages
      ansible.builtin.apt:
        name:
          - caddy
          - curl
          - docker.io
          - ffmpeg
          - libasound2
          - libudev1
          - libusb-1.0-0
          - python3-opencv
          - rclone
          - usbutils
          - v4l-utils
          - zstd
          - xinit
          - xserver-xorg
          - x11-xserver-utils
          - chromium
          - unclutter
          - alsa-utils
        state: present
        update_cache: true
      when: ansible_facts.os_family == "Debian"

    - name: Create deployment directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ motion_levels_remote_root }}"
        - "{{ motion_levels_releases_root }}"
        - /etc/motion-levels
        - /etc/caddy
        - /var/lib/motion-levels
        - /var/lib/motion-levels/camera-recordings
        - /var/lib/motion-levels/security-recordings
        - "{{ motion_levels_remote_root }}/var/floor-controller"

    - name: Initialize the engine-owned stable venue identity
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - "import pathlib,sys,uuid; pathlib.Path(sys.argv[1]).write_text(str(uuid.uuid4()) + '\n', encoding='utf-8')"
          - "{{ motion_levels_remote_root }}/var/floor-controller/controller-id"
        creates: "{{ motion_levels_remote_root }}/var/floor-controller/controller-id"

    - name: Restrict the stable venue identity
      ansible.builtin.file:
        path: "{{ motion_levels_remote_root }}/var/floor-controller/controller-id"
        state: file
        owner: root
        group: root
        mode: "0644"

    - name: Log Docker into GHCR
      ansible.builtin.command:
        cmd: docker login ghcr.io --username "{{ motion_levels_ghcr_username }}" --password-stdin
        stdin: "{{ motion_levels_ghcr_token }}"
      changed_when: false
      no_log: true

    - name: Pull immutable venue bundle
      ansible.builtin.command:
        cmd: docker pull "{{ motion_levels_venue_image }}"
      register: motion_levels_venue_pull
      changed_when: "'Downloaded newer image' in motion_levels_venue_pull.stdout"

    - name: Pull the immutable controller image for the native release
      ansible.builtin.command:
        cmd: docker pull "{{ motion_levels_controller_image }}"
      register: motion_levels_controller_pull
      changed_when: "'Downloaded newer image' in motion_levels_controller_pull.stdout"

    - name: Verify and pin the native controller image digest
      ansible.builtin.shell: |
        /usr/bin/python3 - \
          "{{ motion_levels_controller_image }}" \
          "{{ motion_levels_venue_components_lock.components.controller.revision }}" \
          "{{ motion_levels_venue_components_lock.components.controller.platform.split('/', 1)[1] }}" \
          "{{ motion_levels_venue_components_lock.components.controller.protocol }}" <<'PY'
        import json
        import subprocess
        import sys

        image, expected_revision, expected_architecture, expected_protocol = sys.argv[1:]
        payload = json.loads(subprocess.check_output(["docker", "image", "inspect", image]))[0]
        labels = payload.get("Config", {}).get("Labels") or {}
        revision = labels.get("org.opencontainers.image.revision")
        if revision != expected_revision:
            raise SystemExit(f"{image} revision label is {revision!r}, expected {expected_revision!r}")
        architecture = payload.get("Architecture")
        if architecture != expected_architecture:
            raise SystemExit(
                f"{image} architecture is {architecture!r}, expected {expected_architecture!r}"
            )
        protocol = labels.get("io.motionlevels.controller.protocol")
        if protocol != expected_protocol:
            raise SystemExit(
                f"{image} controller protocol is {protocol!r}, expected {expected_protocol!r}"
            )
        repository = image.rsplit(":sha-", 1)[0]
        digests = [
            value
            for value in payload.get("RepoDigests") or []
            if value.startswith(repository + "@sha256:")
        ]
        if not digests:
            raise SystemExit(f"{image} has no matching registry digest")
        print(digests[0])
        PY
      args:
        executable: /bin/sh
      register: motion_levels_controller_digest
      changed_when: false

    - name: Select the verified native controller digest
      ansible.builtin.set_fact:
        motion_levels_controller_pinned_image: "{{ motion_levels_controller_digest.stdout | trim }}"

    - name: Extract immutable venue bundle
      ansible.builtin.shell: |
        set -eu
        image="{{ motion_levels_venue_image }}"
        release_dir="{{ motion_levels_venue_release_dir }}"
        release_tmp="${release_dir}.tmp"
        current="{{ motion_levels_remote_root }}/current"
        container="motion-levels-release-{{ (motion_levels_venue_revision.stdout | trim)[:12] }}"
        controller_image="{{ motion_levels_controller_pinned_image }}"
        controller_container="motion-levels-controller-release-{{ motion_levels_venue_components_lock.components.controller.revision[:12] }}"
        if [ -e "$release_dir/.complete" ]; then
          echo already-present
          exit 0
        fi
        if [ -L "$current" ] && [ "$(readlink -f "$current")" = "$release_dir" ] && [ -d "$release_dir" ]; then
          touch "$release_dir/.complete"
          echo already-active
          exit 0
        fi
        rm -rf "$release_tmp"
        mkdir -p "$release_tmp"
        docker rm -f "$container" "$controller_container" >/dev/null 2>&1 || true
        docker create --name "$container" "$image" >/dev/null
        docker create --name "$controller_container" "$controller_image" >/dev/null
        cleanup() {
          docker rm -f "$container" "$controller_container" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT
        docker cp "$container:/release/." "$release_tmp/"
        mkdir -p "$release_tmp/bin"
        docker cp \
          "$controller_container:/app/bin/motion-levels-controller" \
          "$release_tmp/bin/floor-controller"
        chmod 0755 "$release_tmp/bin/floor-controller"
        touch "$release_tmp/.complete"
        rm -rf "$release_dir"
        mv "$release_tmp" "$release_dir"
      args:
        executable: /bin/sh
      register: motion_levels_venue_extract
      changed_when: motion_levels_venue_extract.stdout | trim not in ['already-present', 'already-active']

    - name: Preserve the legacy host release for first-container rollback
      ansible.builtin.shell: |
        set -eu
        root="{{ motion_levels_remote_root }}"
        legacy="$root/releases/legacy-pre-container"

        if [ -L "$root/current" ] || [ -e "$legacy/.complete" ]; then
          echo already-present
          exit 0
        fi

        mkdir -p "$legacy/src"
        for path in bin apps content; do
          if [ -e "$root/$path" ]; then
            cp -a "$root/$path" "$legacy/$path"
          fi
        done
        for path in deploy game-bundles; do
          if [ -e "$root/src/$path" ]; then
            cp -a "$root/src/$path" "$legacy/src/$path"
          fi
        done
        touch "$legacy/.complete"
        ln -sfn "$legacy" "$root/previous"
      args:
        executable: /bin/sh
      register: motion_levels_legacy_release
      changed_when: motion_levels_legacy_release.rc == 0 and motion_levels_legacy_release.stdout != 'already-present'

    - name: Activate venue release atomically
      ansible.builtin.shell: |
        set -eu
        root="{{ motion_levels_remote_root }}"
        candidate="{{ motion_levels_venue_release_dir }}"
        active=""
        if [ -L "$root/current" ]; then
          active="$(readlink -f "$root/current")"
        fi
        if [ "$active" = "$candidate" ]; then
          echo already-active
          exit 0
        fi
        if [ -n "$active" ]; then
          ln -sfn "$active" "$root/previous"
        fi
        ln -sfn "$candidate" "$root/current"
        printf '%s\t%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "{{ motion_levels_venue_image }}" >> "$root/releases/history.tsv"
      args:
        executable: /bin/sh
      register: motion_levels_venue_activate
      changed_when: motion_levels_venue_activate.stdout | trim != 'already-active'

    - name: Point local game assets at the pinned bundle
      ansible.builtin.file:
        src: "{{ motion_levels_remote_src }}/game-bundles/motion-levels-games/{{ (lookup('file', motion_levels_repo_root ~ '/game-bundles/motion-levels-games/pin.json') | from_json).bundlePath }}"
        dest: "{{ motion_levels_remote_src }}/game-bundles/motion-levels-games/current"
        state: link
        force: true

    - name: Remove retired host-native Insta360 artifacts
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/local/bin/motion-levels-insta360
        - /usr/local/bin/motion-levels-insta360.disabled-by-motion-levels-cameras
        - /usr/local/bin/motion-levels-x5ctl
        - /opt/insta360
      when: motion_levels_deploy_mode in motion_levels_runtime_modes

    - name: Install default motion-levels env if missing
      ansible.builtin.copy:
        src: "{{ motion_levels_remote_src }}/deploy/motionlevels-pc/motion-levels.env"
        dest: /etc/motion-levels/motion-levels.env
        mode: "0644"
        remote_src: true
        force: false
      when: motion_levels_deploy_mode in motion_levels_runtime_modes

    - name: Ensure platform asset cache env is configured
      ansible.builtin.lineinfile:
        path: /etc/motion-levels/motion-levels.env
        regexp: '^MOTION_LEVELS_PLATFORM_ASSET_CACHE_DIR='
        line: MOTION_LEVELS_PLATFORM_ASSET_CACHE_DIR=/var/lib/motion-levels/platform-asset-cache
        mode: "0644"
      when: motion_levels_deploy_mode in motion_levels_runtime_modes

    - name: Ensure motion-levels-games runner env is configured
      ansible.builtin.lineinfile:
        path: /etc/motion-levels/motion-levels.env
        regexp: '^MOTION_LEVELS_GAMES_ROOT='
        line: "MOTION_LEVELS_GAMES_ROOT={{ motion_levels_remote_src }}/game-bundles/motion-levels-games"
        mode: "0644"
      when: motion_levels_deploy_mode in motion_levels_runtime_modes

    - name: Ensure LED broadcast env is configured
      ansible.builtin.lineinfile:
        path: /etc/motion-levels/motion-levels.env
        regexp: '^MOTION_LEVELS_LED_BROADCAST_IP='
        line: "MOTION_LEVELS_LED_BROADCAST_IP={{ motion_levels_led_broadcast_ip | default('255.255.255.255') }}"
        mode: "0644"
      when: motion_levels_deploy_mode in motion_levels_runtime_modes

    - name: Ensure HDMI audio env is configured
      ansible.builtin.lineinfile:
        path: /etc/motion-levels/motion-levels.env
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
        mode: "0644"
      loop:
        - key: MOTION_LEVELS_HDMI_ALSA_DEVICE
          value: plughw:0,5
        - key: MOTION_LEVELS_FORCE_ALSA_OUTPUT
          value: "1"
        - key: MOTION_LEVELS_HDMI_WATCHDOG_INTERVAL
          value: "10"
        - key: MOTION_LEVELS_HDMI_WATCHDOG_FAILURES
          value: "3"
        - key: MOTION_LEVELS_HDMI_WATCHDOG_RESTART_COOLDOWN
          value: "45"
      when: motion_levels_deploy_mode in motion_levels_runtime_modes

    - name: Install HDMI ALSA dmix config
      ansible.builtin.copy:
        src: "{{ motion_levels_remote_src }}/deploy/motionlevels-pc/asound.conf"
        dest: /etc/asound.conf
        mode: "0644"
        remote_src: true
      when: motion_levels_deploy_mode in motion_levels_runtime_modes

    - name: Configure the externally owned GoPro recorder integration
      ansible.builtin.lineinfile:
        path: /etc/motion-levels/motion-levels.env
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
        mode: "0644"
      loop:
        - key: MOTION_LEVELS_CAMERA_RECORDER_URL
          value: "{{ motion_levels_native_camera_recorder_url | default('http://127.0.0.1:8040') }}"
        - key: MOTION_LEVELS_CAMERA_RECORDER_TIMEOUT
          value: 20s
        - key: MOTION_LEVELS_CAMERA_RECORDER_SEGMENT_SECONDS
          value: "{{ lookup('env', 'MOTION_LEVELS_CAMERA_RECORDER_SEGMENT_SECONDS') | default('300', true) }}"
        - key: MOTION_LEVELS_CAMERA_RECORDER_BACKEND
          value: fake
        - key: MOTION_LEVELS_CAMERA_RECORDINGS_ROOT
          value: /var/lib/motion-levels/camera-recordings
        - key: MOTION_LEVELS_CAMERA_DELETE_LOCAL_AFTER_UPLOAD
          value: "1"
        - key: MOTION_LEVELS_CAMERA_HDR_DEFAULT
          value: "0"
        - key: MOTION_LEVELS_CAMERA_VIDEO_PROJECTION_DEFAULT
          value: "360"
        - key: MOTION_LEVELS_CAMERA_VIDEO_LENS_DEFAULT
          value: all
        - key: MOTION_LEVELS_INSTA360_VIDEO_RESOLUTION
          value: 5.7kplus30
        - key: MOTION_LEVELS_INSTA360_VIDEO_FRAME_RATE
          value: "30"
        - key: MOTION_LEVELS_CAMERA_SESSION_SEGMENT_SECONDS
          value: "{{ lookup('env', 'MOTION_LEVELS_CAMERA_RECORDER_SEGMENT_SECONDS') | default('300', true) }}"
        - key: MOTION_LEVELS_CAMERA_SESSION_MAX_SECONDS
          value: "7200"
        - key: MOTION_LEVELS_CAMERA_DELETE_REMOTE_AFTER_DOWNLOAD
          value: "1"
      when: motion_levels_deploy_mode in motion_levels_runtime_modes

    - name: Ensure security recorder env is configured
      ansible.builtin.lineinfile:
        path: /etc/motion-levels/motion-levels.env
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
        mode: "0644"
      loop:
        - key: MOTION_LEVELS_SECURITY_RECORDER_ENABLED
          value: "1"
        - key: MOTION_LEVELS_SECURITY_CAMERA_ID
          value: "130"
        - key: MOTION_LEVELS_SECURITY_CAMERA_LABEL
          value: "Cámara frontal"
        - key: MOTION_LEVELS_SECURITY_CAMERA_ROLE
          value: front
        - key: MOTION_LEVELS_SECURITY_RECORDINGS_ROOT
          value: /var/lib/motion-levels/security-recordings
        - key: MOTION_LEVELS_SECURITY_RECORDER_AUDIO
          value: "0"
        - key: MOTION_LEVELS_SECURITY_RECORDER_SEGMENT_SECONDS
          value: "300"
        - key: MOTION_LEVELS_SECURITY_RECORDER_RETENTION_DAYS
          value: "14"
        - key: MOTION_LEVELS_SECURITY_RECORDER_DELETE_LOCAL_AFTER_UPLOAD
          value: "1"
      when: motion_levels_deploy_mode in motion_levels_runtime_modes

    - name: Resolve local deployed stack revision
      ansible.builtin.command:
        cmd: git rev-parse --short=7 HEAD
        chdir: "{{ motion_levels_repo_root }}"
      delegate_to: localhost
      register: motion_levels_stack_revision
      changed_when: false

    - name: Resolve local deployed stack commit date
      ansible.builtin.command:
        cmd: git show -s --format=%cI HEAD
        chdir: "{{ motion_levels_repo_root }}"
      delegate_to: localhost
      register: motion_levels_stack_commit_at
      changed_when: false

    - name: Install deployed stack metadata
      ansible.builtin.copy:
        dest: /etc/motion-levels/stack.json
        mode: "0644"
        content: |
          {
            "revision": "{{ motion_levels_stack_revision.stdout }}",
            "commit_at": "{{ motion_levels_stack_commit_at.stdout }}",
            "deployed_at": "{{ ansible_facts['date_time']['iso8601'] }}",
            "target": "{{ inventory_hostname }}"
          }

    - name: Check platform env exists
      ansible.builtin.stat:
        path: /etc/motion-levels/platform.env
      register: motion_levels_platform_env
      when: motion_levels_deploy_mode in motion_levels_runtime_modes

    - name: Warn when platform env is missing
      ansible.builtin.debug:
        msg: "/etc/motion-levels/platform.env is missing; platform sync and recording uploads need MOTION_LEVELS_PLATFORM_TOKEN."
      when:
        - motion_levels_deploy_mode in motion_levels_runtime_modes
        - not (motion_levels_platform_env.stat.exists | default(false))

    - name: Install Caddy config
      ansible.builtin.copy:
        src: "{{ motion_levels_remote_src }}/deploy/motionlevels-pc/Caddyfile"
        dest: /etc/caddy/Caddyfile
        mode: "0644"
        remote_src: true
      notify: Restart caddy
      when: motion_levels_deploy_mode in motion_levels_frontend_modes

    - name: Ensure Caddy systemd override directory
      ansible.builtin.file:
        path: /etc/systemd/system/caddy.service.d
        state: directory
        mode: "0755"
      when: motion_levels_deploy_mode in motion_levels_frontend_modes

    - name: Remove retired camera recorder Caddy environment
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/motion-levels/caddy.env
        - /etc/systemd/system/caddy.service.d/motion-levels-env.conf
      notify:
        - Reload systemd
        - Restart caddy
      when: motion_levels_deploy_mode in motion_levels_frontend_modes

    - name: Install kiosk player script
      ansible.builtin.copy:
        src: "{{ motion_levels_remote_src }}/deploy/motionlevels-pc/motion-levels-player-kiosk"
        dest: /usr/local/bin/motion-levels-player-kiosk
        mode: "0755"
        remote_src: true
      when: motion_levels_deploy_mode in motion_levels_runtime_modes

    - name: Install HDMI watchdog script
      ansible.builtin.copy:
        src: "{{ motion_levels_remote_src }}/deploy/motionlevels-pc/motion-levels-hdmi-watchdog"
        dest: /usr/local/bin/motion-levels-hdmi-watchdog
        mode: "0755"
        remote_src: true
      when: motion_levels_deploy_mode in motion_levels_runtime_modes

    - name: Create Chromium managed policy directory
      ansible.builtin.file:
        path: /etc/chromium/policies/managed
        state: directory
        mode: "0755"
      when: motion_levels_deploy_mode in motion_levels_runtime_modes

    - name: Install Chromium kiosk policy
      ansible.builtin.copy:
        src: "{{ motion_levels_remote_src }}/deploy/motionlevels-pc/chromium-policy.json"
        dest: /etc/chromium/policies/managed/motion-levels-kiosk.json
        mode: "0644"
        remote_src: true
      when: motion_levels_deploy_mode in motion_levels_runtime_modes

    - name: Disable old services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop: "{{ motion_levels_old_services }}"
      failed_when: false
      when: motion_levels_deploy_mode in motion_levels_runtime_modes

    - name: Persistently mask retired X5 recorder service
      ansible.builtin.systemd_service:
        name: motion-levels-camera-recorder.service
        enabled: false
        state: stopped
        masked: true
      when: motion_levels_deploy_mode in motion_levels_runtime_modes

    - name: Remove retired frontend static service units
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}"
        state: absent
      loop:
        - motion-levels-player-menu.service
        - motion-levels-player-display.service
      notify: Reload systemd
      when: motion_levels_deploy_mode in motion_levels_runtime_modes

    - name: Install systemd service units
      ansible.builtin.copy:
        src: "{{ motion_levels_remote_src }}/deploy/motionlevels-pc/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
        remote_src: true
      loop: "{{ motion_levels_services }}"
      notify: Reload systemd
      when: motion_levels_deploy_mode in motion_levels_runtime_modes

    - name: Flush unit/config handlers before validation
      ansible.builtin.meta: flush_handlers

    - name: Enable caddy
      ansible.builtin.systemd_service:
        name: caddy
        enabled: true

    - name: Enable Motion Levels services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
      loop: "{{ motion_levels_services }}"
      when: motion_levels_deploy_mode in motion_levels_runtime_modes

    - name: Validate Caddy config
      ansible.builtin.command:
        cmd: caddy validate --config /etc/caddy/Caddyfile
      changed_when: false
      when: motion_levels_deploy_mode in motion_levels_frontend_modes

    - name: Ensure caddy is running
      ansible.builtin.systemd_service:
        name: caddy
        state: started
      when: motion_levels_deploy_mode in motion_levels_frontend_modes

    - name: Ensure Motion Levels services are running
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
      loop: "{{ motion_levels_services }}"
      when: motion_levels_deploy_mode in motion_levels_runtime_modes

    - name: Read game engine state before activating rebuilt services
      ansible.builtin.uri:
        url: http://127.0.0.1:4102/api/status
        status_code: 200
        return_content: true
      register: motion_levels_engine_state_before_restart
      failed_when: false
      changed_when: false
      when: motion_levels_deploy_mode in motion_levels_runtime_modes

    - name: Decide whether rebuilt services can be activated now
      ansible.builtin.set_fact:
        motion_levels_can_restart_now: >-
          {{
            motion_levels_engine_state_before_restart.status != 200
            or (
              (motion_levels_engine_state_before_restart.json.currentGame | default('')) in ['loop', 'animations', 'salvapantallas', 'ambient-comet', 'ambient-pulse', 'ambient-spark']
              and (motion_levels_engine_state_before_restart.json.phase | default('')) in ['idle', 'ambient']
            )
          }}
      when: motion_levels_deploy_mode in motion_levels_runtime_modes

    - name: Queue rebuilt Motion Levels service activation when venue is idle
      ansible.builtin.command:
        cmd: >-
          systemd-run
          --unit=motion-levels-release-{{ (motion_levels_venue_revision.stdout | trim)[:12] }}
          --collect --no-block --
          /bin/systemctl restart {{ motion_levels_services | join(' ') }}
      when:
        - motion_levels_deploy_mode in motion_levels_runtime_modes
        - motion_levels_can_restart_now | default(false)
        - motion_levels_venue_activate.changed

    - name: Wait for venue SSH after service activation
      ansible.builtin.wait_for_connection:
        timeout: 90
        sleep: 2
      when:
        - motion_levels_deploy_mode in motion_levels_runtime_modes
        - motion_levels_can_restart_now | default(false)
        - motion_levels_venue_activate.changed

    - name: Verify activated Motion Levels services
      ansible.builtin.command:
        argv: "{{ ['systemctl', 'is-active'] + motion_levels_services }}"
      register: motion_levels_services_active
      changed_when: false
      retries: 30
      delay: 2
      until: motion_levels_services_active.rc == 0
      when:
        - motion_levels_deploy_mode in motion_levels_runtime_modes
        - motion_levels_can_restart_now | default(false)
        - motion_levels_venue_activate.changed

    - name: Keep rebuilt Motion Levels services staged while a session is active
      ansible.builtin.debug:
        msg: >-
          Rebuilt services were staged but not restarted because the engine is running
          {{ motion_levels_engine_state_before_restart.json.currentGame | default('unknown') }}
          in {{ motion_levels_engine_state_before_restart.json.phase | default('unknown') }}.
      when:
        - motion_levels_deploy_mode in motion_levels_runtime_modes
        - not (motion_levels_can_restart_now | default(false))

    - name: Wait for local service health
      ansible.builtin.uri:
        url: "{{ item }}"
        status_code: 200
      register: motion_levels_health
      until: motion_levels_health.status == 200
      retries: 80
      delay: 1
      loop: "{{ motion_levels_frontend_health_urls if motion_levels_deploy_mode == 'frontends' else motion_levels_health_urls }}"
      failed_when: false

    - name: Detect failed venue release health checks
      ansible.builtin.set_fact:
        motion_levels_release_health_failed: >-
          {{
            motion_levels_health.results
            | selectattr('status', 'ne', 200)
            | list
            | length > 0
          }}

    - name: Roll back failed venue release
      when: motion_levels_release_health_failed
      block:
        - name: Restore previous venue release symlink
          ansible.builtin.shell: |
            set -eu
            root="{{ motion_levels_remote_root }}"
            test -L "$root/previous"
            previous="$(readlink -f "$root/previous")"
            ln -sfn "$previous" "$root/current"
            printf '%s\trollback\t%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$previous" >> "$root/releases/history.tsv"
          args:
            executable: /bin/sh
          changed_when: true

        - name: Restart Caddy after venue rollback
          ansible.builtin.systemd_service:
            name: caddy
            state: restarted

        - name: Restart runtime services after venue rollback
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            state: restarted
          loop: "{{ motion_levels_services }}"
          when: motion_levels_deploy_mode in motion_levels_runtime_modes

        - name: Report failed venue release after rollback
          ansible.builtin.fail:
            msg: "Venue release {{ motion_levels_venue_revision.stdout | trim }} failed health checks and was rolled back."

  handlers:
    - name: Reconfigure dhcpcd LAN interface
      # -4 makes the running dhcpcd re-read its config and apply the static
      # IPv4 profile to the interface; a plain rebind (-n) drops the lease
      # without reliably applying the new static address.
      ansible.builtin.command:
        cmd: "dhcpcd -4 {{ motion_levels_lan_interface }}"
      changed_when: true

    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restart caddy
      ansible.builtin.systemd_service:
        name: caddy
        state: restarted
