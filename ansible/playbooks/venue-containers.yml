---
- name: Deploy the pinned Motion Levels venue container stack
  hosts: motion_levels_venues
  gather_facts: true
  vars:
    motion_levels_repo_root: "{{ playbook_dir }}/../.."
    motion_levels_ghcr_username: "{{ lookup('env', 'GHCR_USERNAME') | default('lobis', true) }}"
    motion_levels_ghcr_token: "{{ lookup('env', 'GHCR_TOKEN') }}"
    motion_levels_venue_compose_dir: /opt/motion-levels/venue-containers
    motion_levels_venue_config_root: /etc/motion-levels/venue
    motion_levels_venue_components_lock_path: "{{ motion_levels_repo_root }}/deploy/motionlevels-pc/venue-components.lock.json"
    motion_levels_effective_display_backend: "{{ motion_levels_display_backend | default('x11') }}"
    motion_levels_container_units:
      - motion-levels-audio-keepalive.service
      - motion-levels-audio.socket
      - motion-levels-audio@.service
      - motion-levels-container-firewall.service
      - motion-levels-venue-containers.service
      - motion-levels-venue-reconcile.service
      - motion-levels-venue-reconcile.timer
      - motion-levels-display-wayland.service
      - motion-levels-hdmi-agent.service
      - motion-levels-player-container.service
    motion_levels_native_core_services:
      - motion-levels-floor-controller.service
      - motion-levels-game-engine.service
      - motion-levels-camera-helper.service
      - motion-levels-security-recorder.service

  tasks:
    - name: Load the immutable venue component lock
      ansible.builtin.set_fact:
        motion_levels_venue_components_lock: >-
          {{ lookup('file', motion_levels_venue_components_lock_path) | from_json }}

    - name: Validate the pinned controller component contract
      ansible.builtin.assert:
        that:
          - motion_levels_venue_components_lock.schema == 'motion-levels-venue-components-v1'
          - motion_levels_venue_components_lock.components.controller.repository == 'ghcr.io/motionlevels/motion-levels-controller'
          - motion_levels_venue_components_lock.components.controller.revision is match('^[0-9a-f]{40}$')
          - motion_levels_venue_components_lock.components.controller.platform == 'linux/amd64'
          - motion_levels_venue_components_lock.components.controller.protocol == 'v1'
        fail_msg: >-
          deploy/motionlevels-pc/venue-components.lock.json must pin the
          controller repository, full revision, linux/amd64 platform, and v1 protocol.
      delegate_to: localhost
      become: false

    - name: Restrict the first container migration to opted-in venues
      ansible.builtin.assert:
        that:
          - motion_levels_containerized_venue | default(false) | bool
          - motion_levels_effective_display_backend in ["x11", "wayland"]
        fail_msg: >-
          Set motion_levels_containerized_venue=true for this venue and choose
          motion_levels_display_backend=x11 or wayland.

    - name: Verify platform checkout matches the image revision
      ansible.builtin.command:
        cmd: git status --porcelain
        chdir: "{{ motion_levels_repo_root }}"
      delegate_to: localhost
      become: false
      register: motion_levels_controller_worktree
      changed_when: false

    - name: Refuse mixed image and working-tree deployment artifacts
      ansible.builtin.assert:
        that:
          - motion_levels_controller_worktree.stdout | trim | length == 0
        fail_msg: Commit or remove local changes before deploying immutable venue artifacts.
      delegate_to: localhost
      become: false

    - name: Resolve the immutable venue revision
      ansible.builtin.command:
        cmd: git rev-parse HEAD
        chdir: "{{ motion_levels_repo_root }}"
      delegate_to: localhost
      become: false
      register: motion_levels_venue_revision
      changed_when: false

    - name: Resolve compact venue revision metadata
      ansible.builtin.command:
        cmd: git show -s --format=%h%n%cI HEAD
        chdir: "{{ motion_levels_repo_root }}"
      delegate_to: localhost
      become: false
      register: motion_levels_venue_revision_metadata
      changed_when: false

    - name: Set immutable venue image facts
      ansible.builtin.set_fact:
        motion_levels_venue_release_root: >-
          {{ motion_levels_venue_config_root }}/releases/{{ motion_levels_venue_revision.stdout | trim }}-{{ ansible_facts.date_time.epoch }}
        motion_levels_venue_images:
          FLOOR_IMAGE: >-
            {{
              motion_levels_venue_components_lock.components.controller.repository
            }}:sha-{{
              motion_levels_venue_components_lock.components.controller.revision
            }}
          ENGINE_IMAGE: "ghcr.io/motionlevels/motion-levels-venue-engine:sha-{{ motion_levels_venue_revision.stdout | trim }}"
          CAMERA_HELPER_IMAGE: "ghcr.io/motionlevels/motion-levels-venue-camera-helper:sha-{{ motion_levels_venue_revision.stdout | trim }}"
          SECURITY_RECORDER_IMAGE: "ghcr.io/motionlevels/motion-levels-venue-security-recorder:sha-{{ motion_levels_venue_revision.stdout | trim }}"
          CADDY_IMAGE: "ghcr.io/motionlevels/motion-levels-venue-caddy:sha-{{ motion_levels_venue_revision.stdout | trim }}"
          PLAYER_IMAGE: "ghcr.io/motionlevels/motion-levels-venue-player:sha-{{ motion_levels_venue_revision.stdout | trim }}"
        motion_levels_venue_image_revisions:
          FLOOR_IMAGE: "{{ motion_levels_venue_components_lock.components.controller.revision }}"
          ENGINE_IMAGE: "{{ motion_levels_venue_revision.stdout | trim }}"
          CAMERA_HELPER_IMAGE: "{{ motion_levels_venue_revision.stdout | trim }}"
          SECURITY_RECORDER_IMAGE: "{{ motion_levels_venue_revision.stdout | trim }}"
          CADDY_IMAGE: "{{ motion_levels_venue_revision.stdout | trim }}"
          PLAYER_IMAGE: "{{ motion_levels_venue_revision.stdout | trim }}"
        motion_levels_venue_image_protocols:
          FLOOR_IMAGE: "{{ motion_levels_venue_components_lock.components.controller.protocol }}"
        motion_levels_venue_image_architectures:
          FLOOR_IMAGE: amd64
          ENGINE_IMAGE: amd64
          CAMERA_HELPER_IMAGE: amd64
          SECURITY_RECORDER_IMAGE: amd64
          CADDY_IMAGE: amd64
          PLAYER_IMAGE: amd64

    - name: Validate GHCR pull credentials
      ansible.builtin.assert:
        that:
          - motion_levels_ghcr_token | length > 0
        fail_msg: Set GHCR_TOKEN to a GitHub token with read:packages.
      no_log: true

    - name: Install the small host boundary package set
      ansible.builtin.apt:
        name:
          - alsa-utils
          - curl
          - docker.io
          - kbd
          - nftables
          - python3
          - seatd
          - weston
        state: present
        update_cache: true
      when: ansible_facts.os_family == "Debian"

    - name: Verify Docker Compose v2 is available
      ansible.builtin.command:
        cmd: docker compose version
      changed_when: false

    - name: Inspect an unassigned legacy camera container
      ansible.builtin.command:
        cmd: docker container inspect motion-levels-cameras
      register: motion_levels_legacy_x5_container
      changed_when: false
      failed_when:
        - motion_levels_legacy_x5_container.rc != 0
        - "'No such container: motion-levels-cameras' not in motion_levels_legacy_x5_container.stderr"
      when:
        - not (motion_levels_x5_enabled | default(false) | bool)
        - motion_levels_camera_recorder_url | default('') | length == 0

    - name: Remove an unassigned legacy camera runtime
      ansible.builtin.command:
        cmd: docker container rm --force motion-levels-cameras
      when:
        - not (motion_levels_x5_enabled | default(false) | bool)
        - motion_levels_camera_recorder_url | default('') | length == 0
        - (motion_levels_legacy_x5_container.rc | default(1)) == 0

    - name: Create the audio broker group
      ansible.builtin.group:
        name: motionlevels-audio
        system: true
        state: present

    - name: Create the audio broker user
      ansible.builtin.user:
        name: motionlevels-audio
        group: motionlevels-audio
        groups: audio
        append: true
        system: true
        create_home: false
        home: /nonexistent
        shell: /usr/sbin/nologin
        state: present

    - name: Create the display boundary group
      ansible.builtin.group:
        name: motionlevels-display
        gid: 10003
        state: present

    - name: Create the display boundary user
      ansible.builtin.user:
        name: motionlevels-display
        uid: 10003
        group: motionlevels-display
        groups: video,render
        append: true
        create_home: false
        home: /nonexistent
        shell: /usr/sbin/nologin
        state: present

    - name: Create the HDMI control group
      ansible.builtin.group:
        name: motionlevels-hdmi
        gid: 10004
        state: present

    - name: Create the HDMI control user
      ansible.builtin.user:
        name: motionlevels-hdmi
        uid: 10004
        group: motionlevels-hdmi
        groups: audio
        append: true
        create_home: false
        home: /nonexistent
        shell: /usr/sbin/nologin
        state: present

    - name: Resolve audio broker group ID
      ansible.builtin.command:
        cmd: getent group motionlevels-audio
      register: motion_levels_audio_group
      changed_when: false

    - name: Resolve render group ID
      ansible.builtin.command:
        cmd: getent group render
      register: motion_levels_render_group
      changed_when: false

    - name: Create venue container configuration directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner | default('root') }}"
        group: "{{ item.group | default('root') }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: /etc/motion-levels, mode: "0755" }
        - { path: "{{ motion_levels_venue_config_root }}", mode: "0700" }
        - { path: "{{ motion_levels_venue_config_root }}/secrets", mode: "0700" }
        - { path: "{{ motion_levels_venue_config_root }}/releases", mode: "0700" }
        - { path: "{{ motion_levels_venue_release_root }}", mode: "0700" }
        - { path: "{{ motion_levels_venue_release_root }}/secrets", mode: "0700" }
        - { path: /etc/motion-levels/venue-public, mode: "0755" }
        - { path: "{{ motion_levels_venue_compose_dir }}", mode: "0755" }
        - { path: /opt/motion-levels/rebuild/var/floor-controller, owner: "10001", group: "10001", mode: "0750" }
        - { path: /var/lib/motion-levels/platform-asset-cache, owner: "10001", group: "10001", mode: "0750" }
        - { path: /var/lib/motion-levels/security-recordings, owner: "10002", group: "10002", mode: "0750" }
        - { path: /var/lib/motion-levels/player-profile, owner: "10003", group: "10003", mode: "0750" }
        - { path: /etc/systemd/system/docker.service.d, mode: "0755" }

    - name: Give container service users their existing writable state
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        recurse: true
      loop:
        - { path: /opt/motion-levels/rebuild/var/floor-controller, owner: "10001", group: "10001" }
        - { path: /var/lib/motion-levels/platform-asset-cache, owner: "10001", group: "10001" }
        - { path: /var/lib/motion-levels/security-recordings, owner: "10002", group: "10002" }

    - name: Verify the existing venue environment is present
      ansible.builtin.stat:
        path: /etc/motion-levels/motion-levels.env
      register: motion_levels_existing_env

    - name: Require the existing venue configuration
      ansible.builtin.assert:
        that:
          - motion_levels_existing_env.stat.exists
        fail_msg: /etc/motion-levels/motion-levels.env is required for container migration.

    - name: Configure production camera segment policy
      ansible.builtin.lineinfile:
        path: /etc/motion-levels/motion-levels.env
        regexp: '^MOTION_LEVELS_CAMERA_RECORDER_SEGMENT_SECONDS='
        line: "MOTION_LEVELS_CAMERA_RECORDER_SEGMENT_SECONDS={{ motion_levels_camera_recorder_segment_seconds | default(300) | int }}"
        mode: "0644"

    - name: Build a secret-free runtime env and least-readable secret files
      ansible.builtin.shell: |
        /usr/bin/python3 - <<'PY'
        import json
        import os
        import secrets
        import shlex
        from pathlib import Path

        config_root = Path("{{ motion_levels_venue_release_root }}")
        source_paths = [
            Path("/etc/motion-levels/motion-levels.env"),
            Path("/etc/motion-levels/platform.env"),
            Path("/etc/motion-levels/camera.env"),
            Path("/etc/motion-levels/security-recorder.env"),
            Path("/etc/motion-levels/tv.env"),
        ]

        def decoded(raw: str) -> str:
            raw = raw.strip()
            if len(raw) >= 2 and raw[0] in {'"', "'"} and raw[-1] == raw[0]:
                parsed = shlex.split(raw, comments=False, posix=True)
                return parsed[0] if parsed else ""
            return raw

        values: dict[str, str] = {}
        for path in source_paths:
            if not path.exists():
                continue
            for line in path.read_text(encoding="utf-8").splitlines():
                stripped = line.strip()
                if not stripped or stripped.startswith("#") or "=" not in stripped:
                    continue
                key, raw = stripped.split("=", 1)
                values[key.strip()] = decoded(raw)

        x5_enabled = {{ (motion_levels_x5_enabled | default(false) | bool) | ternary('True', 'False') }}
        inventory_camera_recorder_url = {{ motion_levels_camera_recorder_url | default('') | to_json }}
        values["MOTION_LEVELS_X5_ENABLED"] = "1" if x5_enabled else "0"
        values["MOTION_LEVELS_CAMERA_RECORDER_URL"] = inventory_camera_recorder_url
        values["MOTION_LEVELS_CAMERA_RECORDER_SEGMENT_SECONDS"] = str(
            {{ motion_levels_camera_recorder_segment_seconds | default(300) | int }}
        )

        platform_token = values.get("MOTION_LEVELS_SECURITY_RECORDER_PLATFORM_TOKEN") or values.get("MOTION_LEVELS_PLATFORM_TOKEN") or ""
        camera_password = (
            values.get("MOTION_LEVELS_SECURITY_CAMERA_PASSWORD")
            or values.get("MOTION_LEVELS_CAMERA_PASSWORD")
            or values.get("ML_TAPO_PASSWORD")
            or ""
        )
        camera_recorder_secret = Path("/etc/motion-levels/camera-recorder-token")
        camera_recorder_token = ""
        if inventory_camera_recorder_url:
            camera_recorder_token = values.get("MOTION_LEVELS_CAMERA_RECORDER_TOKEN") or ""
            if not camera_recorder_token and camera_recorder_secret.exists():
                camera_recorder_token = camera_recorder_secret.read_text(encoding="utf-8").strip()
            if not camera_recorder_token:
                camera_recorder_token = secrets.token_urlsafe(48)
            camera_recorder_secret_tmp = camera_recorder_secret.with_suffix(".tmp")
            camera_recorder_secret_tmp.write_text(camera_recorder_token, encoding="utf-8")
            os.chown(camera_recorder_secret_tmp, 10001, 10001)
            os.chmod(camera_recorder_secret_tmp, 0o400)
            os.replace(camera_recorder_secret_tmp, camera_recorder_secret)
        if not platform_token:
            raise SystemExit("MOTION_LEVELS_PLATFORM_TOKEN is missing")
        if not camera_password:
            raise SystemExit("the Tapo camera password is missing")

        runtime_lines = [
            f"{key}={json.dumps(value, ensure_ascii=False)}"
            for key, value in sorted(values.items())
            if not any(marker in key for marker in ("TOKEN", "PASSWORD", "SECRET"))
        ]
        runtime_tmp = config_root / "runtime.env.tmp"
        runtime_tmp.write_text("\n".join(runtime_lines) + "\n", encoding="utf-8")
        os.chmod(runtime_tmp, 0o600)
        os.replace(runtime_tmp, config_root / "runtime.env")

        secret_specs = [
            ("platform-token-core", platform_token, 10001, 10001),
            ("camera-recorder-token-core", camera_recorder_token, 10001, 10001),
            ("platform-token-security", platform_token, 10002, 10002),
            ("tapo-password", camera_password, 10002, 10002),
        ]
        for name, value, uid, gid in secret_specs:
            destination = config_root / "secrets" / name
            temporary = destination.with_suffix(".tmp")
            temporary.write_text(value, encoding="utf-8")
            os.chown(temporary, uid, gid)
            os.chmod(temporary, 0o400)
            os.replace(temporary, destination)
        PY
      args:
        executable: /bin/sh
      changed_when: false
      no_log: true

    - name: Install the venue Compose manifest
      ansible.builtin.copy:
        src: "{{ motion_levels_repo_root }}/deploy/motionlevels-pc/docker-compose.yml"
        dest: "{{ motion_levels_venue_release_root }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0644"

    - name: Install the dormant X5 venue-gateway binding
      ansible.builtin.copy:
        src: "{{ motion_levels_repo_root }}/deploy/motionlevels-pc/x5-camera-gateway.compose.yml"
        dest: "{{ motion_levels_venue_config_root }}/x5-camera-gateway.compose.yml"
        owner: root
        group: root
        mode: "0644"

    - name: Install container-boundary executables
      ansible.builtin.copy:
        src: "{{ motion_levels_repo_root }}/deploy/motionlevels-pc/{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "0755"
      loop:
        - { src: activate-venue-containers, dest: /usr/local/sbin/motion-levels-venue-containers }
        - { src: reconcile-venue-release, dest: /usr/local/sbin/motion-levels-venue-reconcile }
        - { src: motion-levels-container-firewall, dest: /usr/local/sbin/motion-levels-container-firewall }
        - { src: motion-levels-display-agent, dest: /usr/local/bin/motion-levels-display-agent }
        - { src: motion-levels-hdmi-agent, dest: /usr/local/bin/motion-levels-hdmi-agent }
        - { src: motion-levels-player-kiosk, dest: /usr/local/bin/motion-levels-player-kiosk }

    - name: Install the camera-container egress policy
      ansible.builtin.copy:
        src: "{{ motion_levels_repo_root }}/deploy/motionlevels-pc/motion-levels-container-firewall.nft"
        dest: "{{ motion_levels_venue_config_root }}/firewall.nft"
        owner: root
        group: root
        mode: "0600"
      notify: Reload venue container firewall

    - name: Validate the camera-container egress policy
      ansible.builtin.command:
        cmd: "nft --check --file {{ motion_levels_venue_config_root }}/firewall.nft"
      changed_when: false

    - name: Install container and display systemd units
      ansible.builtin.copy:
        src: "{{ motion_levels_repo_root }}/deploy/motionlevels-pc/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ motion_levels_container_units }}"
      notify: Reload systemd

    - name: Order Docker after the camera-container firewall
      ansible.builtin.copy:
        dest: /etc/systemd/system/docker.service.d/motion-levels-firewall.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Wants=motion-levels-container-firewall.service
          After=motion-levels-container-firewall.service
      notify: Reload systemd

    - name: Install the broker ALSA configuration
      ansible.builtin.copy:
        src: "{{ motion_levels_repo_root }}/deploy/motionlevels-pc/asound.conf"
        dest: /etc/asound.conf
        owner: root
        group: root
        mode: "0644"

    - name: Install the fixed 1080p60 Weston configuration
      ansible.builtin.copy:
        src: "{{ motion_levels_repo_root }}/deploy/motionlevels-pc/weston.ini"
        dest: /etc/motion-levels/weston.ini
        owner: root
        group: root
        mode: "0644"

    - name: Install the hardened native Caddy rollback configuration
      ansible.builtin.copy:
        src: "{{ motion_levels_repo_root }}/deploy/motionlevels-pc/Caddyfile"
        dest: /etc/caddy/Caddyfile
        owner: root
        group: root
        mode: "0644"

    - name: Ensure the native Caddy override directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/caddy.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install the native Caddy X5 capability environment
      ansible.builtin.copy:
        dest: /etc/motion-levels/caddy.env
        owner: root
        group: root
        mode: "0600"
        content: |
          MOTION_LEVELS_X5_ENABLED={{ (motion_levels_x5_enabled | default(false) | bool) | ternary('1', '0') }}
          MOTION_LEVELS_X5_UPSTREAM=http://127.0.0.1:8040

    - name: Attach the X5 capability environment to native Caddy rollback
      ansible.builtin.copy:
        dest: /etc/systemd/system/caddy.service.d/motion-levels-x5.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Service]
          EnvironmentFile=-/etc/motion-levels/caddy.env
      notify: Reload systemd

    - name: Validate native Caddy rollback configuration
      ansible.builtin.command:
        cmd: caddy validate --config /etc/caddy/Caddyfile
      changed_when: false

    - name: Install the hardened X11 kiosk unit for rollback
      ansible.builtin.copy:
        src: "{{ motion_levels_repo_root }}/deploy/motionlevels-pc/motion-levels-kiosk.service"
        dest: /etc/systemd/system/motion-levels-kiosk.service
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Check existing native stack metadata
      ansible.builtin.stat:
        path: /etc/motion-levels/stack.json
      register: motion_levels_native_stack_metadata

    - name: Check public container stack metadata
      ansible.builtin.stat:
        path: /etc/motion-levels/venue-public/stack.json
      register: motion_levels_public_stack_metadata

    - name: Seed public metadata from the native deployment
      ansible.builtin.copy:
        src: /etc/motion-levels/stack.json
        dest: /etc/motion-levels/venue-public/stack.json
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      when:
        - motion_levels_native_stack_metadata.stat.exists
        - not motion_levels_public_stack_metadata.stat.exists

    - name: Seed fallback native metadata on a new appliance
      ansible.builtin.copy:
        dest: /etc/motion-levels/venue-public/stack.json
        owner: root
        group: root
        mode: "0644"
        force: false
        content: |
          {
            "revision": "native",
            "commit_at": "",
            "deployed_at": "{{ ansible_facts['date_time']['iso8601'] }}",
            "target": "{{ inventory_hostname }}",
            "runtime": "native"
          }

    - name: Log Docker into GHCR
      ansible.builtin.command:
        cmd: docker login ghcr.io --username "{{ motion_levels_ghcr_username }}" --password-stdin
        stdin: "{{ motion_levels_ghcr_token }}"
      changed_when: false
      no_log: true

    - name: Check Docker storage headroom
      ansible.builtin.shell: df --output=avail -k /var/lib/docker | tail -n 1
      args:
        executable: /bin/sh
      register: motion_levels_docker_free_kb
      changed_when: false

    - name: Read the currently committed display backend before image pulls
      ansible.builtin.command:
        cmd: sed -n 's/^VENUE_DISPLAY_BACKEND=//p' /etc/motion-levels/venue/current.env
      register: motion_levels_committed_display_backend
      changed_when: false
      failed_when: false

    - name: Require bounded image-pull headroom
      ansible.builtin.assert:
        that:
          - >-
            (motion_levels_docker_free_kb.stdout | trim | int) >=
            (10485760 if (motion_levels_effective_display_backend == 'wayland' or motion_levels_committed_display_backend.stdout | trim == 'wayland') else 8388608)
        fail_msg: >-
          Insufficient free space below /var/lib/docker for the venue images;
          no broad Docker prune is performed because the X5 stack shares this host.

    - name: Pull immutable venue service images
      ansible.builtin.command:
        cmd: "docker pull {{ item.value }}"
      loop: "{{ motion_levels_venue_images | dict2items }}"
      register: motion_levels_image_pulls
      changed_when: "'Downloaded newer image' in motion_levels_image_pulls.stdout"
      when: >-
        item.key != 'PLAYER_IMAGE'
        or motion_levels_effective_display_backend == 'wayland'
        or motion_levels_committed_display_backend.stdout | trim == 'wayland'

    - name: Resolve pulled SHA tags to verified registry digests
      ansible.builtin.shell: |
        /usr/bin/python3 - \
          "{{ item.value }}" \
          "{{ motion_levels_venue_image_revisions[item.key] }}" \
          "{{ motion_levels_venue_image_architectures[item.key] }}" \
          "{{ motion_levels_venue_image_protocols[item.key] | default('') }}" <<'PY'
        import json
        import subprocess
        import sys

        image, expected_revision, expected_architecture, expected_protocol = sys.argv[1:]
        payload = json.loads(subprocess.check_output(["docker", "image", "inspect", image]))[0]
        labels = payload.get("Config", {}).get("Labels") or {}
        revision = labels.get("org.opencontainers.image.revision")
        if revision != expected_revision:
            raise SystemExit(f"{image} revision label is {revision!r}, expected {expected_revision!r}")
        architecture = payload.get("Architecture")
        if architecture != expected_architecture:
            raise SystemExit(
                f"{image} architecture is {architecture!r}, expected {expected_architecture!r}"
            )
        if expected_protocol:
            protocol = labels.get("io.motionlevels.controller.protocol")
            if protocol != expected_protocol:
                raise SystemExit(
                    f"{image} controller protocol is {protocol!r}, expected {expected_protocol!r}"
                )
        repository = image.rsplit(":sha-", 1)[0]
        digests = [value for value in payload.get("RepoDigests") or [] if value.startswith(repository + "@sha256:")]
        if not digests:
            raise SystemExit(f"{image} has no matching registry digest")
        print(digests[0])
        PY
      args:
        executable: /bin/sh
      loop: "{{ motion_levels_venue_images | dict2items }}"
      register: motion_levels_image_digests
      changed_when: false
      when: >-
        item.key != 'PLAYER_IMAGE'
        or motion_levels_effective_display_backend == 'wayland'
        or motion_levels_committed_display_backend.stdout | trim == 'wayland'

    - name: Initialize candidate images from full-commit tags
      ansible.builtin.set_fact:
        motion_levels_venue_pinned_images: "{{ motion_levels_venue_images }}"

    - name: Replace pulled tags with cryptographic image digests
      ansible.builtin.set_fact:
        motion_levels_venue_pinned_images: >-
          {{ motion_levels_venue_pinned_images | combine({item.item.key: item.stdout | trim}) }}
      loop: "{{ motion_levels_image_digests.results }}"
      when: not (item.skipped | default(false))

    - name: Render immutable desired image manifest
      ansible.builtin.copy:
        dest: "{{ motion_levels_venue_release_root }}/desired.env"
        owner: root
        group: root
        mode: "0600"
        content: |
          VENUE_MODE=containers
          VENUE_REVISION={{ motion_levels_venue_revision.stdout | trim }}
          VENUE_SHORT_REVISION={{ motion_levels_venue_revision_metadata.stdout_lines[0] }}
          VENUE_COMMIT_AT={{ motion_levels_venue_revision_metadata.stdout_lines[1] }}
          VENUE_TARGET={{ inventory_hostname }}
          VENUE_DISPLAY_BACKEND={{ motion_levels_effective_display_backend }}
          VENUE_LAN_INTERFACE={{ motion_levels_lan_interface }}
          VENUE_LAN_IPV4={{ motion_levels_lan_ipv4 | regex_replace('/.*$', '') }}
          VENUE_TAILSCALE_IPV4={{ motion_levels_tailscale_ipv4 }}
          VENUE_LAN_SUBNET={{ motion_levels_lan_subnet }}
          VENUE_FLOOR_LAN_IPV4={{ motion_levels_floor_lan_ipv4 }}
          VENUE_FLOOR_BROADCAST_IPV4={{ motion_levels_floor_broadcast_ipv4 }}
          MOTION_LEVELS_X5_ENABLED={{ (motion_levels_x5_enabled | default(false) | bool) | ternary('1', '0') }}
          MOTION_LEVELS_X5_UPSTREAM={{ motion_levels_x5_caddy_upstream | default('') if (motion_levels_x5_enabled | default(false) | bool) else '' }}
          VENUE_CONFIG_ROOT={{ motion_levels_venue_release_root }}
          VENUE_RUNTIME_ENV={{ motion_levels_venue_release_root }}/runtime.env
          VENUE_COMPOSE_FILE={{ motion_levels_venue_release_root }}/docker-compose.yml
          VENUE_AUDIO_GID={{ motion_levels_audio_group.stdout.split(':')[2] }}
          VENUE_RENDER_GID={{ motion_levels_render_group.stdout.split(':')[2] }}
          FLOOR_REVISION={{ motion_levels_venue_components_lock.components.controller.revision }}
          FLOOR_PLATFORM={{ motion_levels_venue_components_lock.components.controller.platform }}
          FLOOR_PROTOCOL={{ motion_levels_venue_components_lock.components.controller.protocol }}
          FLOOR_IMAGE={{ motion_levels_venue_pinned_images.FLOOR_IMAGE }}
          ENGINE_IMAGE={{ motion_levels_venue_pinned_images.ENGINE_IMAGE }}
          CAMERA_HELPER_IMAGE={{ motion_levels_venue_pinned_images.CAMERA_HELPER_IMAGE }}
          SECURITY_RECORDER_IMAGE={{ motion_levels_venue_pinned_images.SECURITY_RECORDER_IMAGE }}
          CADDY_IMAGE={{ motion_levels_venue_pinned_images.CADDY_IMAGE }}
          PLAYER_IMAGE={{ motion_levels_venue_pinned_images.PLAYER_IMAGE }}

    - name: Validate the fully resolved candidate Compose configuration
      ansible.builtin.command:
        cmd: >-
          docker compose
          --env-file {{ motion_levels_venue_release_root }}/desired.env
          --file {{ motion_levels_venue_release_root }}/docker-compose.yml
          config --quiet
      changed_when: false

    - name: Persist the newest explicitly desired venue release
      ansible.builtin.command:
        cmd: >-
          flock --wait 300 /run/lock/motion-levels-venue-containers.lock
          install --mode 0600
          {{ motion_levels_venue_release_root }}/desired.env
          {{ motion_levels_venue_config_root }}/candidate.env
      changed_when: true

    - name: Flush systemd unit changes before activation
      ansible.builtin.meta: flush_handlers

    - name: Start the hardware and egress brokers before the cutover
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - motion-levels-container-firewall.service
        - motion-levels-audio-keepalive.service
        - motion-levels-audio.socket

    - name: Detect a connected display before a Wayland switchover
      ansible.builtin.shell: grep -l '^connected$' /sys/class/drm/card0-*/status
      args:
        executable: /bin/sh
      register: motion_levels_connected_displays
      changed_when: false
      failed_when: false
      when: motion_levels_effective_display_backend == "wayland"

    - name: Require a physical display for the Wayland switchover
      ansible.builtin.assert:
        that:
          - motion_levels_connected_displays.stdout_lines | length > 0
        fail_msg: The Wayland path remains staged because no HDMI display is connected.
      when: motion_levels_effective_display_backend == "wayland"

    - name: Attempt the desired release immediately
      ansible.builtin.command:
        cmd: /usr/local/sbin/motion-levels-venue-reconcile
      register: motion_levels_container_activation
      changed_when: "'activation complete' in motion_levels_container_activation.stdout"

    - name: Enable durable local venue release reconciliation
      ansible.builtin.systemd_service:
        name: motion-levels-venue-reconcile.timer
        daemon_reload: true
        enabled: true
        state: started

    - name: Read the currently committed display backend
      ansible.builtin.command:
        cmd: sed -n 's/^VENUE_DISPLAY_BACKEND=//p' /etc/motion-levels/venue/current.env
      register: motion_levels_active_display_backend
      changed_when: false
      when: "' activated' in motion_levels_container_activation.stdout"

    - name: Select X11 with rollback to an already-active Wayland path
      when:
        - motion_levels_effective_display_backend == "x11"
        - "' activated' in motion_levels_container_activation.stdout"
      block:
        - name: Stop the Wayland display path
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            enabled: false
            state: stopped
          loop:
            - motion-levels-player-container.service
            - motion-levels-hdmi-agent.service
            - motion-levels-display-wayland.service

        - name: Start the X11 display path
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            enabled: true
            state: started
          loop:
            - motion-levels-kiosk.service
            - motion-levels-hdmi-watchdog.service

        - name: Commit the verified X11 backend
          ansible.builtin.lineinfile:
            path: /etc/motion-levels/venue/current.env
            regexp: '^VENUE_DISPLAY_BACKEND='
            line: VENUE_DISPLAY_BACKEND=x11
            mode: "0600"

      rescue:
        - name: Stop failed X11 services before restoring Wayland
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            enabled: false
            state: stopped
          loop:
            - motion-levels-hdmi-watchdog.service
            - motion-levels-kiosk.service
          failed_when: false
          when: motion_levels_active_display_backend.stdout | trim == "wayland"

        - name: Restore the previously active Wayland path
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            enabled: true
            state: started
          loop:
            - motion-levels-display-wayland.service
            - motion-levels-hdmi-agent.service
            - motion-levels-player-container.service
          when: motion_levels_active_display_backend.stdout | trim == "wayland"

        - name: Fail after display rollback
          ansible.builtin.fail:
            msg: X11 validation failed; the previous display path was restored where available.

    - name: Switch to the narrow Wayland display path with X11 rescue
      when:
        - motion_levels_effective_display_backend == "wayland"
        - motion_levels_container_activation.rc == 0
      block:
        - name: Stop the X11 display path
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            enabled: false
            state: stopped
          loop:
            - motion-levels-hdmi-watchdog.service
            - motion-levels-kiosk.service

        - name: Start the Weston compositor boundary
          ansible.builtin.systemd_service:
            name: motion-levels-display-wayland.service
            enabled: true
            state: started

        - name: Wait for the compositor socket
          ansible.builtin.wait_for:
            path: /run/motion-levels-display/wayland-0
            state: present
            timeout: 30

        - name: Start the narrow HDMI control agent
          ansible.builtin.systemd_service:
            name: motion-levels-hdmi-agent.service
            enabled: true
            state: started

        - name: Recreate the player from the selected immutable manifest
          ansible.builtin.systemd_service:
            name: motion-levels-player-container.service
            enabled: true
            state: restarted

        - name: Verify player container health
          ansible.builtin.command:
            cmd: docker inspect motion-levels-venue-player
          register: motion_levels_player_inspect
          changed_when: false
          retries: 20
          delay: 2
          until: >-
            ((motion_levels_player_inspect.stdout | from_json)[0].State.Health.Status | default('')) == 'healthy'

        - name: Verify the player has only the render-node boundary
          ansible.builtin.shell: |
            /usr/bin/python3 - <<'PY'
            import json
            import subprocess

            payload = json.loads(subprocess.check_output(["docker", "inspect", "motion-levels-venue-player"]))[0]
            host = payload["HostConfig"]
            devices = host.get("Devices") or []
            assert host.get("Privileged") is False
            assert len(devices) == 1, devices
            assert devices[0].get("PathOnHost") == "/dev/dri/renderD128", devices
            assert devices[0].get("PathInContainer") == "/dev/dri/renderD128", devices
            assert devices[0].get("CgroupPermissions") == "rw", devices
            assert "ALL" in (host.get("CapDrop") or [])
            assert any(option.startswith("no-new-privileges") for option in (host.get("SecurityOpt") or []))
            assert payload["Config"].get("User") == "10003:10003"
            assert host.get("NetworkMode") == "motion-levels-venue-display"
            sources = {mount.get("Source") for mount in payload.get("Mounts") or []}
            assert not any(source and source.startswith("/dev/snd") for source in sources)
            assert not any(source and source.startswith("/dev/input") for source in sources)
            PY
          args:
            executable: /bin/sh
          changed_when: false

        - name: Commit the verified Wayland backend
          ansible.builtin.lineinfile:
            path: /etc/motion-levels/venue/current.env
            regexp: '^VENUE_DISPLAY_BACKEND='
            line: VENUE_DISPLAY_BACKEND=wayland
            mode: "0600"

      rescue:
        - name: Stop the failed Wayland path
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            enabled: false
            state: stopped
          loop:
            - motion-levels-player-container.service
            - motion-levels-hdmi-agent.service
            - motion-levels-display-wayland.service
          failed_when: false

        - name: Restore the X11 display path
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            enabled: true
            state: started
          loop:
            - motion-levels-kiosk.service
            - motion-levels-hdmi-watchdog.service

        - name: Record the restored X11 backend
          ansible.builtin.lineinfile:
            path: /etc/motion-levels/venue/current.env
            regexp: '^VENUE_DISPLAY_BACKEND='
            line: VENUE_DISPLAY_BACKEND=x11
            mode: "0600"

        - name: Fail after restoring X11
          ansible.builtin.fail:
            msg: Wayland validation failed; the X11 kiosk and HDMI watchdog were restored.

    - name: Verify venue container confinement
      ansible.builtin.shell: |
        /usr/bin/python3 - <<'PY'
        import json
        import subprocess

        names = [
            "motion-levels-venue-floor",
            "motion-levels-venue-engine",
            "motion-levels-venue-camera-helper",
            "motion-levels-venue-security-recorder",
            "motion-levels-venue-caddy",
        ]
        for name in names:
            payload = json.loads(subprocess.check_output(["docker", "inspect", name]))[0]
            host = payload["HostConfig"]
            assert host.get("Privileged") is False, f"{name} is privileged"
            assert not host.get("Devices"), f"{name} has hardware devices"
            assert "ALL" in (host.get("CapDrop") or []), f"{name} did not drop all capabilities"
            assert any(option.startswith("no-new-privileges") for option in (host.get("SecurityOpt") or [])), f"{name} lacks no-new-privileges"
            assert payload["Config"].get("User") not in {"", "0", "root"}, f"{name} runs as root"
        PY
      args:
        executable: /bin/sh
      changed_when: false
      when: "' activated' in motion_levels_container_activation.stdout"

    - name: Verify final venue status
      ansible.builtin.command:
        cmd: /usr/local/sbin/motion-levels-venue-containers status
      changed_when: false
      when: "' activated' in motion_levels_container_activation.stdout"

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Reload venue container firewall
      ansible.builtin.command:
        cmd: systemctl try-reload-or-restart motion-levels-container-firewall.service
      changed_when: true
