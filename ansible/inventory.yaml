all:
  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
    motion_levels_go_version: "1.26.3"
    motion_levels_go_bin: /usr/local/go/bin/go
    motion_levels_remote_root: /opt/motion-levels/rebuild
    motion_levels_remote_src: /opt/motion-levels/rebuild/src
    # The X5 implementation stays in the repo, but its runtime capabilities are
    # disabled. Set this to true and deploy both platform and motionlevels-1 to
    # restore the preserved recorder URL, token paths, proxy, and operator UI.
    motion_levels_x5_enabled: false
  children:
    motion_levels_platform:
      hosts:
        motionlevels-platform:
          ansible_host: 100.102.24.118
          motion_levels_repo_root: /opt/motion-levels/repo
          motion_levels_platform_health_url: http://10.137.25.242:3000/api/healthz
          motion_levels_platform_readiness_url: http://10.137.25.242:3000/api/readyz
          motion_levels_platform_bind_ip: 10.137.25.242
          motion_levels_platform_url: https://platform.motionlevels.obis.dev
          motion_levels_tailscale_host_overrides: motionlevels-1-camera-dev=100.66.119.123
          # Dormant while motion_levels_x5_enabled=false; retained verbatim so
          # restoring the X5 does not require reconstructing its registration.
          motion_levels_room_camera_recorders: local|X5 protegida|http://100.76.156.89/camera-recorder
    homelab_caddy:
      hosts:
        caddy:
          ansible_host: 10.137.25.208
          motion_levels_platform_proxy_target: 10.137.25.242:3000
          motion_levels_website_cdn_proxy_target: 192.168.1.7:9000
    motion_levels_website:
      hosts:
        motionlevels-website:
          ansible_host: 100.103.216.65
          motion_levels_repo_root: /opt/motion-levels/repo
          motion_levels_website_strapi_health_url: http://127.0.0.1:1337/healthz
          motion_levels_website_strapi_url: https://strapi.motionlevels.obis.dev
    motion_levels_postgres:
      hosts:
        motionlevels-postgres-1:
          ansible_host: 100.124.16.23
          motion_levels_postgres_version: "18"
          motion_levels_postgres_data_device: /dev/sdb
          motion_levels_postgres_data_partition: /dev/sdb1
          motion_levels_postgres_data_mount: /var/lib/postgresql
          motion_levels_postgres_tailscale_hostname: motionlevels-postgres-1
          motion_levels_postgres_tailscale_tags: tag:motion-levels-core
          motion_levels_postgres_tailscale_ip: 100.124.16.23
          motion_levels_postgres_listen_addresses: "127.0.0.1,100.124.16.23"
          motion_levels_postgres_allowed_cidrs:
            - 127.0.0.1/32
            - 100.64.0.0/10
    motion_levels_object_storage:
      hosts:
        motionlevels-objects-1:
          ansible_host: 100.69.44.59
          motion_levels_objects_image: rustfs/rustfs:1.0.0-beta.8
          motion_levels_objects_data_device: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
          motion_levels_objects_data_partition: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1-part1
          motion_levels_objects_data_mount: /srv/motion-levels/objects
          motion_levels_objects_bind_ip: 100.69.44.59
          motion_levels_objects_lan_bind_ip: "192.168.1.7"
          motion_levels_objects_tailscale_hostname: motionlevels-objects-1
          motion_levels_objects_tailscale_tags: tag:motion-levels-core
          motion_levels_objects_buckets:
            - motionlevels-media-assets
            - motionlevels-recordings
            - motionlevels-security-recordings
            - motionlevels-session-exports
            - motionlevels-website-cdn
    motion_levels_venues:
      hosts:
        motionlevels-1:
          ansible_host: 100.76.156.89
          motion_levels_hostname: motionlevels-1
          motion_levels_containerized_venue: true
          # The player is isolated behind the host Weston compositor and the
          # render-only device boundary; validate TV hotplug and HDMI audio live.
          motion_levels_display_backend: wayland
          # Dormant while motion_levels_x5_enabled=false. The explicit egress
          # gateway is deterministic from both core containers; use the camera
          # host's Tailnet URL instead after a future dedicated-host cutover.
          motion_levels_camera_recorder_url: http://172.30.53.1:8040
          motion_levels_x5_caddy_upstream: http://172.30.53.1:8040
          motion_levels_lan_interface: enp2s0
          motion_levels_lan_ipv4: 192.168.1.142/24
          motion_levels_lan_gateway: 192.168.1.1
          motion_levels_lan_subnet: 192.168.1.0/24
          motion_levels_tailscale_ipv4: 100.76.156.89
          # Dedicated ipvlan L2 address for the floor hardware interface. Live
          # ARP and passive broadcast validation confirmed that .143 is unused.
          motion_levels_floor_lan_ipv4: 192.168.1.143
          # Tiles use link-local addresses, so preserve limited broadcast; the
          # controller pins the source/interface with IPv4 packet information.
          motion_levels_floor_broadcast_ipv4: 255.255.255.255
        motionlevels-cloud-1:
          ansible_host: 100.94.69.53
          motion_levels_hostname: motionlevels-cloud-1
