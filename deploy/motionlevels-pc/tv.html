<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Motion Levels TV</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #020406;
        color: #f8fafc;
        font-family: Arial, Helvetica, sans-serif;
      }

      .stage {
        position: absolute;
        left: 0;
        top: 0;
        right: 0;
        bottom: 0;
        background: #020406;
      }

      .camera,
      .floor {
        position: absolute;
        overflow: hidden;
        background: #05080c;
        border: 1px solid #172033;
      }

      .camera {
        left: 0.75%;
        width: 67.65%;
        height: 48.15%;
      }

      .camera-top {
        top: 0.9%;
      }

      .camera-bottom {
        bottom: 0.9%;
      }

      .camera img {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        -ms-interpolation-mode: bicubic;
      }

      .floor {
        top: 0.9%;
        right: 0.75%;
        bottom: 0.9%;
        width: 29.25%;
        border-color: #1f2a44;
      }

      .floor-inner {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 88%;
        height: 94%;
        margin-left: -44%;
        margin-top: -47%;
      }

      .floor-board {
        position: absolute;
        left: 0;
        top: 0;
        right: 0;
        bottom: 0;
        background: #000;
      }

      .tile {
        position: absolute;
        background: #000;
        border: 0;
      }

      .tile.pressed {
        border-color: #fff;
        box-shadow: inset 0 0 0 2px #fff;
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="Motion Levels TV">
      <section class="camera camera-top" data-state="loading">
        <img id="camera-back" alt="Camara trasera">
      </section>

      <section class="floor" data-state="loading">
        <div class="floor-inner">
          <div id="floor-board" class="floor-board"></div>
        </div>
      </section>

      <section class="camera camera-bottom" data-state="loading">
        <img id="camera-side" alt="Camara lateral">
      </section>
    </main>

    <script>
      (function () {
        var cameraRefreshMs = 500;
        var reconnectMs = 1000;
        var tileWidth = 16;
        var tileHeight = 32;
        var tiles = [];
        var socket = null;

        function setState(panel, state, text) {
          var stateNode = panel.getElementsByClassName("state")[0];
          panel.setAttribute("data-state", state);
          if (stateNode) stateNode.innerHTML = text;
        }

        function refreshCamera(imgId, src) {
          var img = document.getElementById(imgId);
          if (!img) return;
          var panel = img.parentNode;

          img.onload = function () {
            setState(panel, "live", "Directo");
          };
          img.onerror = function () {
            setState(panel, "error", "Sin senal");
          };

          function update() {
            img.src = src + "?t=" + new Date().getTime();
          }

          update();
          window.setInterval(update, cameraRefreshMs);
        }

        function buildFloor(width, height) {
          var board = document.getElementById("floor-board");
          var index;
          var x;
          var y;
          var tile;
          tileWidth = width || 16;
          tileHeight = height || 32;
          tiles = [];
          board.innerHTML = "";

          for (index = 0; index < tileWidth * tileHeight; index += 1) {
            x = index % tileWidth;
            y = Math.floor(index / tileWidth);
            tile = document.createElement("i");
            tile.className = "tile";
            tile.style.left = (x * 100 / tileWidth) + "%";
            tile.style.top = (y * 100 / tileHeight) + "%";
            tile.style.width = (100 / tileWidth) + "%";
            tile.style.height = (100 / tileHeight) + "%";
            board.appendChild(tile);
            tiles.push(tile);
          }
        }

        function renderFrame(buffer) {
          var view = new DataView(buffer);
          var frameWidth;
          var frameHeight;
          var flags;
          var headerLength;
          var tileCount;
          var rgbOffset;
          var pressureOffset;
          var bytes;
          var hasPressure;
          var index;
          var rgbIndex;
          var tile;
          var pressed;

          if (
            view.byteLength < 16 ||
            view.getUint8(0) !== 77 ||
            view.getUint8(1) !== 76 ||
            view.getUint8(2) !== 70 ||
            view.getUint8(3) !== 49
          ) {
            return;
          }

          frameWidth = view.getUint16(8, true);
          frameHeight = view.getUint16(10, true);
          flags = view.getUint8(12);
          headerLength = view.getUint16(14, true);
          tileCount = frameWidth * frameHeight;
          rgbOffset = headerLength;
          pressureOffset = rgbOffset + tileCount * 3;
          if (view.byteLength < pressureOffset) return;

          if (frameWidth !== tileWidth || frameHeight !== tileHeight || tiles.length !== tileCount) {
            buildFloor(frameWidth, frameHeight);
          }

          bytes = new Uint8Array(buffer);
          hasPressure = Boolean(flags & 1) && bytes.length >= pressureOffset + Math.ceil(tileCount / 8);

          for (index = 0; index < tileCount; index += 1) {
            tile = tiles[index];
            if (!tile) continue;
            rgbIndex = rgbOffset + index * 3;
            tile.style.backgroundColor = "rgb(" + bytes[rgbIndex] + "," + bytes[rgbIndex + 1] + "," + bytes[rgbIndex + 2] + ")";
            if (hasPressure) {
              pressed = Boolean(bytes[pressureOffset + Math.floor(index / 8)] & (1 << (index % 8)));
              tile.className = pressed ? "tile pressed" : "tile";
            }
          }

          setState(document.getElementsByClassName("floor")[0], "live", "Directo");
        }

        function connectFloor() {
          var protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
          var floorPanel = document.getElementsByClassName("floor")[0];

          try {
            socket = new WebSocket(protocol + "//" + window.location.host + "/ws");
            socket.binaryType = "arraybuffer";
          } catch (err) {
            setState(floorPanel, "error", "Sin websocket");
            return;
          }

          socket.onopen = function () {
            setState(floorPanel, "live", "Directo");
          };
          socket.onmessage = function (event) {
            if (event.data && event.data.byteLength) renderFrame(event.data);
          };
          socket.onerror = function () {
            setState(floorPanel, "error", "Error");
          };
          socket.onclose = function () {
            setState(floorPanel, "error", "Reconectando");
            window.setTimeout(connectFloor, reconnectMs);
          };
        }

        buildFloor(16, 32);
        refreshCamera("camera-back", "/cam/128.jpg");
        refreshCamera("camera-side", "/cam/129.jpg");
        connectFloor();
      }());
    </script>
  </body>
</html>
