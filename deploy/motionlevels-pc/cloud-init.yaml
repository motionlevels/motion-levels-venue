#cloud-config
# Motion Levels Venue Appliance provisioning configuration for Debian 13 (Trixie)
#
# Instructions:
# 1. Set MOTION_LEVELS_PROVISION_HOSTNAME and TAILSCALE_AUTHKEY in
#    /etc/motion-levels/provision.env below, or use
#    deploy/homelab/create-motionlevels-venue-vm.sh to render them for Proxmox.
# 2. Add SSH keys through your cloud platform or hypervisor cloud-init settings.
# 3. Boot your VM/server, wait for cloud-init to finish, then deploy updates with
#    ansible/playbooks/venue.yml.

preserve_hostname: false
manage_etc_hosts: true
ssh_pwauth: false
disable_root: false

users:
  - default
  - name: root
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-rsa  lobis@lobisapa-cern-macbook-pro.dyndns.cern.ch
      # MOTION_LEVELS_SSH_AUTHORIZED_KEYS

# Write configuration files and helper scripts before packages are installed
write_files:
  # 0. Per-machine bootstrap inputs. Leave empty to use the hypervisor hostname
  # and skip Tailnet registration.
  - path: /etc/motion-levels/provision.env
    owner: root:root
    permissions: '0600'
    content: |
      MOTION_LEVELS_PROVISION_HOSTNAME=""
      TAILSCALE_AUTHKEY=""
      TAILSCALE_ADVERTISE_TAGS="tag:motion-levels-edge"

  # 1. Kiosk display launcher script
  - path: /usr/local/bin/motion-levels-player-kiosk
    owner: root:root
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # Motion Levels Kiosk Launcher
      set -euo pipefail

      ENV_FILE=/etc/motion-levels/motion-levels.env

      env_file_value() {
        local key="$1"
        local fallback="${2:-}"
        local value=""

        if [ -f "${ENV_FILE}" ]; then
          value="$(awk -v key="${key}" '
            /^[[:space:]]*#/ { next }
            /^[[:space:]]*$/ { next }
            index($0, key "=") == 1 {
              sub(/^[^=]*=/, "")
              print
              exit
            }
          ' "${ENV_FILE}")"
        fi

        value="${value%$'\r'}"
        if [ "${#value}" -ge 2 ]; then
          local first="${value:0:1}"
          local last="${value: -1}"
          if { [ "${first}" = '"' ] && [ "${last}" = '"' ]; } || { [ "${first}" = "'" ] && [ "${last}" = "'" ]; }; then
            value="${value:1:${#value}-2}"
          fi
        fi

        if [ -n "${value}" ]; then
          printf '%s' "${value}"
        else
          printf '%s' "${fallback}"
        fi
      }

      MOTION_LEVELS_XRANDR_MODE="$(env_file_value MOTION_LEVELS_XRANDR_MODE)"
      MOTION_LEVELS_XRANDR_RATE="$(env_file_value MOTION_LEVELS_XRANDR_RATE 60)"
      MOTION_LEVELS_PLAYER_PROFILE="$(env_file_value MOTION_LEVELS_PLAYER_PROFILE /var/lib/motion-levels/rebuild-player-chromium)"
      MOTION_LEVELS_PLAYER_URL="$(env_file_value MOTION_LEVELS_PLAYER_URL http://127.0.0.1/display/)"
      MOTION_LEVELS_FORCE_ALSA_OUTPUT="$(env_file_value MOTION_LEVELS_FORCE_ALSA_OUTPUT 0)"

      truthy_env() {
        case "$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')" in
          1|true|yes|on) return 0 ;;
          *) return 1 ;;
        esac
      }

      configure_display() {
        local output mode rate attempt geometry size
        mode="${MOTION_LEVELS_XRANDR_MODE:-}"
        rate="${MOTION_LEVELS_XRANDR_RATE:-60}"
        for attempt in $(seq 1 15); do
          output=$(/usr/bin/xrandr --query 2>/dev/null | awk '/ connected/ { print $1; exit }')
          if [ -n "${output}" ]; then
            /usr/bin/xrandr --output "${output}" --auto --primary 2>/dev/null || true
            if [ -n "${mode}" ]; then
              /usr/bin/xrandr --output "${output}" --mode "${mode}" --rate "${rate}" 2>/dev/null || true
            fi
            geometry="$(/usr/bin/xrandr --query 2>/dev/null | grep -oE '[0-9]+x[0-9]+\+0\+0' | head -1)"
            size="${geometry%%+*}"
            if [ -n "${geometry}" ] && [ "${size}" != "1024x768" ]; then
              echo "Display configured: ${output} ${geometry}"
              return 0
            fi
          fi
          sleep 1
        done
        echo "Warning: could not configure a connected display after retries; leaving X at its default."
      }
      configure_display

      configure_audio_output() {
        local output control
        if ! truthy_env "${MOTION_LEVELS_FORCE_ALSA_OUTPUT}"; then
          return 0
        fi

        output=$(/usr/bin/xrandr --query 2>/dev/null | awk '/ connected/ { print $1; exit }')
        if [ -n "${output}" ]; then
          /usr/bin/xrandr --output "${output}" --set audio on 2>/dev/null || true
        fi

        if command -v /usr/bin/amixer >/dev/null 2>&1; then
          for control in IEC958 "IEC958,0" "IEC958,1" "IEC958,2"; do
            /usr/bin/amixer -q sset "${control}" unmute 2>/dev/null || true
            /usr/bin/amixer -q sset "${control}" on 2>/dev/null || true
          done
        fi

        if command -v /usr/sbin/alsactl >/dev/null 2>&1; then
          /usr/sbin/alsactl store >/dev/null 2>&1 || true
        fi
      }
      configure_audio_output

      SCREEN_GEOMETRY="$(/usr/bin/xrandr --query 2>/dev/null | grep -oE '[0-9]+x[0-9]+\+0\+0' | head -1)"
      SCREEN_SIZE="${SCREEN_GEOMETRY%%+*}"
      SCREEN_WIDTH="${SCREEN_SIZE%x*}"
      SCREEN_HEIGHT="${SCREEN_SIZE#*x}"

      USER_DATA_DIR="${MOTION_LEVELS_PLAYER_PROFILE}"
      mkdir -p "${USER_DATA_DIR}"

      if command -v /usr/bin/unclutter >/dev/null 2>&1; then
        /usr/bin/unclutter -idle 0.1 -root &
      fi

      CHROME_FLAGS=(
        --kiosk
        --no-first-run
        --new-window
        --user-data-dir="${USER_DATA_DIR}"
        --noerrdialogs
        --disable-infobars
        --disable-session-crashed-bubble
        --disable-features=Translate
        --check-for-update-interval=31536000
        --autoplay-policy=no-user-gesture-required
      )

      if [ -n "${SCREEN_WIDTH:-}" ] && [ -n "${SCREEN_HEIGHT:-}" ]; then
        CHROME_FLAGS+=( --window-position=0,0 "--window-size=${SCREEN_WIDTH},${SCREEN_HEIGHT}" )
      fi

      if [ "$(id -u)" -eq 0 ]; then
        CHROME_FLAGS+=( --no-sandbox )
      fi

      TARGET_URL="${MOTION_LEVELS_PLAYER_URL}"
      echo "Starting Chromium kiosk pointing to ${TARGET_URL}..."
      exec /usr/bin/chromium "${CHROME_FLAGS[@]}" "${TARGET_URL}"

  - path: /etc/asound.conf
    owner: root:root
    permissions: '0644'
    content: |
      pcm.!default {
        type plug
        slave.pcm "motionlevels_hdmi"
      }

      pcm.motionlevels_hdmi {
        type dmix
        ipc_key 2048
        ipc_perm 0600
        slave {
          pcm {
            type hw
            card 0
            device 5
          }
          channels 2
          rate 48000
          format S16_LE
          period_size 1024
          buffer_size 8192
        }
        bindings {
          0 0
          1 1
        }
      }

      ctl.!default {
        type hw
        card 0
      }

  - path: /usr/local/bin/motion-levels-hdmi-watchdog
    owner: root:root
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      ENV_FILE=/etc/motion-levels/motion-levels.env

      env_file_value() {
        local key="$1"
        local fallback="${2:-}"
        local value=""

        if [ -f "${ENV_FILE}" ]; then
          value="$(awk -v key="${key}" '
            /^[[:space:]]*#/ { next }
            /^[[:space:]]*$/ { next }
            index($0, key "=") == 1 {
              sub(/^[^=]*=/, "")
              print
              exit
            }
          ' "${ENV_FILE}")"
        fi

        value="${value%$'\r'}"
        if [ -n "${value}" ]; then
          printf '%s' "${value}"
        else
          printf '%s' "${fallback}"
        fi
      }

      truthy_env() {
        case "$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')" in
          1|true|yes|on) return 0 ;;
          *) return 1 ;;
        esac
      }

      log() {
        printf 'motion-levels-hdmi-watchdog: %s\n' "$*"
      }

      MOTION_LEVELS_XRANDR_MODE="$(env_file_value MOTION_LEVELS_XRANDR_MODE)"
      MOTION_LEVELS_XRANDR_RATE="$(env_file_value MOTION_LEVELS_XRANDR_RATE 60)"
      MOTION_LEVELS_PLAYER_URL="$(env_file_value MOTION_LEVELS_PLAYER_URL http://127.0.0.1/display/)"
      MOTION_LEVELS_FORCE_ALSA_OUTPUT="$(env_file_value MOTION_LEVELS_FORCE_ALSA_OUTPUT 0)"
      POLL_SECONDS="$(env_file_value MOTION_LEVELS_HDMI_WATCHDOG_INTERVAL 10)"
      RESTART_COOLDOWN_SECONDS="$(env_file_value MOTION_LEVELS_HDMI_WATCHDOG_RESTART_COOLDOWN 45)"
      FAILURES_BEFORE_RESTART="$(env_file_value MOTION_LEVELS_HDMI_WATCHDOG_FAILURES 3)"

      last_restart=0
      failure_count=0

      set_hdmi_audio_on() {
        local output="$1"
        local control

        if [ -n "${output}" ]; then
          /usr/bin/xrandr --output "${output}" --set audio on 2>/dev/null || true
        fi

        if command -v /usr/bin/amixer >/dev/null 2>&1; then
          for control in IEC958 "IEC958,0" "IEC958,1" "IEC958,2"; do
            /usr/bin/amixer -q sset "${control}" unmute 2>/dev/null || true
            /usr/bin/amixer -q sset "${control}" on 2>/dev/null || true
          done
        fi
      }

      configure_display() {
        local output="$1"
        local mode="${MOTION_LEVELS_XRANDR_MODE:-}"
        local rate="${MOTION_LEVELS_XRANDR_RATE:-60}"

        /usr/bin/xrandr --output "${output}" --auto --primary 2>/dev/null || true
        if [ -n "${mode}" ]; then
          /usr/bin/xrandr --output "${output}" --mode "${mode}" --rate "${rate}" 2>/dev/null || true
        fi
      }

      chromium_running() {
        pgrep -f "/usr/lib/chromium/chromium .*--app=${MOTION_LEVELS_PLAYER_URL}" >/dev/null 2>&1 ||
          pgrep -f "/usr/lib/chromium/chromium .*${MOTION_LEVELS_PLAYER_URL}" >/dev/null 2>&1
      }

      restart_kiosk_if_needed() {
        local reason="$1"
        local now
        now="$(date +%s)"

        failure_count=$((failure_count + 1))
        if [ "${failure_count}" -lt "${FAILURES_BEFORE_RESTART}" ]; then
          log "${reason}; failure ${failure_count}/${FAILURES_BEFORE_RESTART}"
          return 0
        fi

        if [ $((now - last_restart)) -lt "${RESTART_COOLDOWN_SECONDS}" ]; then
          log "${reason}; restart cooling down"
          return 0
        fi

        log "${reason}; restarting motion-levels-kiosk.service"
        systemctl restart motion-levels-kiosk.service || true
        last_restart="${now}"
        failure_count=0
      }

      while true; do
        xrandr_output="$(/usr/bin/xrandr --query 2>/dev/null || true)"
        output="$(printf '%s\n' "${xrandr_output}" | awk '/ connected/ { print $1; exit }')"

        if [ -z "${xrandr_output}" ]; then
          restart_kiosk_if_needed "X display is unavailable"
          sleep "${POLL_SECONDS}"
          continue
        fi

        if [ -z "${output}" ]; then
          failure_count=0
          log "no HDMI/DP output connected"
          sleep "${POLL_SECONDS}"
          continue
        fi

        geometry="$(printf '%s\n' "${xrandr_output}" | grep -oE '[0-9]+x[0-9]+\+0\+0' | head -1)"
        size="${geometry%%+*}"
        audio_state="$(printf '%s\n' "${xrandr_output}" | awk -v output="${output}" '
          $1 == output && $2 == "connected" { in_output = 1; next }
          in_output && /^[^[:space:]]/ { in_output = 0 }
          in_output && $1 == "audio:" { print $2; exit }
        ')"

        if [ -z "${geometry}" ] || [ "${size}" = "1024x768" ]; then
          log "repairing HDMI geometry '${geometry:-none}' on ${output}"
          configure_display "${output}"
          xrandr_output="$(/usr/bin/xrandr --query 2>/dev/null || true)"
          geometry="$(printf '%s\n' "${xrandr_output}" | grep -oE '[0-9]+x[0-9]+\+0\+0' | head -1)"
          size="${geometry%%+*}"
          audio_state="$(printf '%s\n' "${xrandr_output}" | awk -v output="${output}" '
            $1 == output && $2 == "connected" { in_output = 1; next }
            in_output && /^[^[:space:]]/ { in_output = 0 }
            in_output && $1 == "audio:" { print $2; exit }
          ')"
        fi

        if truthy_env "${MOTION_LEVELS_FORCE_ALSA_OUTPUT}" && [ -n "${audio_state}" ] && [ "${audio_state}" != "on" ]; then
          log "repairing HDMI audio state '${audio_state}' on ${output}"
          set_hdmi_audio_on "${output}"
          xrandr_output="$(/usr/bin/xrandr --query 2>/dev/null || true)"
          audio_state="$(printf '%s\n' "${xrandr_output}" | awk -v output="${output}" '
            $1 == output && $2 == "connected" { in_output = 1; next }
            in_output && /^[^[:space:]]/ { in_output = 0 }
            in_output && $1 == "audio:" { print $2; exit }
          ')"
        fi

        if [ -z "${geometry}" ] || [ "${size}" = "1024x768" ]; then
          restart_kiosk_if_needed "bad HDMI geometry '${geometry:-none}' on ${output}"
          sleep "${POLL_SECONDS}"
          continue
        fi

        if truthy_env "${MOTION_LEVELS_FORCE_ALSA_OUTPUT}" && [ -n "${audio_state}" ] && [ "${audio_state}" != "on" ]; then
          restart_kiosk_if_needed "HDMI audio state is '${audio_state}' on ${output}"
          sleep "${POLL_SECONDS}"
          continue
        fi

        if ! chromium_running; then
          restart_kiosk_if_needed "Chromium kiosk is not running"
          sleep "${POLL_SECONDS}"
          continue
        fi

        failure_count=0
        sleep "${POLL_SECONDS}"
      done

  # 2. Default runtime environment file
  - path: /etc/motion-levels/motion-levels.env
    owner: root:root
    permissions: '0644'
    content: |
      # Motion Levels local appliance defaults.
      MOTION_LEVELS_CONTROLLER_HTTP=127.0.0.1:4101
      MOTION_LEVELS_ENGINE_HTTP=127.0.0.1:4102

      MOTION_LEVELS_CONTROLLER_FRAMES=127.0.0.1:4201
      MOTION_LEVELS_CONTROLLER_INPUT_EVENTS=127.0.0.1:4202

      MOTION_LEVELS_FLOOR_RECV_PORT=7800
      MOTION_LEVELS_LED_BROADCAST_IP=255.255.255.255
      MOTION_LEVELS_LED_BROADCAST_PORT=4626

      MOTION_LEVELS_PLATFORM_URL=https://platform.motionlevels.obis.dev
      MOTION_LEVELS_PLATFORM_ASSET_CACHE_DIR=/var/lib/motion-levels/platform-asset-cache
      MOTION_LEVELS_CONTROLLER_LABEL=Venue Floor 1
      MOTION_LEVELS_CONTROLLER_HOSTNAME=motionlevels-1
      # Controller frame recording is opt-in; leave upload disabled by default.
      MOTION_LEVELS_RECORDING_UPLOAD_PLATFORM_URL=
      MOTION_LEVELS_LIVE_PUSH_PLATFORM_URL=https://platform.motionlevels.obis.dev
      MOTION_LEVELS_LIVE_PUSH_FPS=5
      MOTION_LEVELS_LIVE_PUSH_TIMEOUT=10s

      MOTION_LEVELS_REFRESH_FPS=50
      MOTION_LEVELS_ENGINE_FPS=50
      MOTION_LEVELS_ENGINE_BRIGHTNESS=100
      MOTION_LEVELS_GAMES_ROOT=/opt/motion-levels/rebuild/src/game-bundles/motion-levels-games
      MOTION_LEVELS_DISPLAY_SNAPSHOT_FPS=4
      MOTION_LEVELS_REPLAY_MAX_LOCAL_BYTES=536870912
      MOTION_LEVELS_CAMERA_RECORDER_URL=http://127.0.0.1:8030
      MOTION_LEVELS_CAMERA_RECORDER_PROXY_TARGET=127.0.0.1:8030
      MOTION_LEVELS_CAMERA_RECORDER_TIMEOUT=20s
      MOTION_LEVELS_CAMERA_RECORDER_SEGMENT_SECONDS=1200
      MOTION_LEVELS_CAMERA_RECORDER_BACKEND=fake
      MOTION_LEVELS_CAMERA_RECORDINGS_ROOT=/var/lib/motion-levels/camera-recordings
      MOTION_LEVELS_CAMERA_DELETE_LOCAL_AFTER_UPLOAD=1
      MOTION_LEVELS_CAMERA_HDR_DEFAULT=0
      MOTION_LEVELS_CAMERA_VIDEO_PROJECTION_DEFAULT=360
      MOTION_LEVELS_CAMERA_VIDEO_LENS_DEFAULT=all
      MOTION_LEVELS_INSTA360_VIDEO_RESOLUTION=5.7kplus30
      MOTION_LEVELS_INSTA360_VIDEO_FRAME_RATE=30
      MOTION_LEVELS_CAMERA_SESSION_SEGMENT_SECONDS=1200
      MOTION_LEVELS_CAMERA_SESSION_MAX_SECONDS=7200
      MOTION_LEVELS_CAMERA_DELETE_REMOTE_AFTER_DOWNLOAD=1
      # For Insta360 X4/X5 SDK control, connect the camera by USB and select
      # Android mode on the camera prompt. Linux should then show USB vendor
      # 2e1a. Configure real camera capture on the appliance, preferably in
      # /etc/motion-levels/camera-recorder.env:
      # MOTION_LEVELS_CAMERA_RECORDER_BACKEND=command
      # MOTION_LEVELS_CAMERA_REGULAR_MEDIA_EXTENSION=.mp4
      # MOTION_LEVELS_CAMERA_360_MEDIA_EXTENSION=.insv
      # MOTION_LEVELS_CAMERA_PHOTO_EXTENSION=.insp
      # MOTION_LEVELS_CAMERA_START_COMMAND=/usr/local/bin/motion-levels-insta360 start
      # MOTION_LEVELS_CAMERA_STOP_COMMAND=/usr/local/bin/motion-levels-insta360 stop
      # MOTION_LEVELS_CAMERA_PHOTO_COMMAND=/usr/local/bin/motion-levels-insta360 photo
      # Object-storage uploads use an rclone S3 remote configured outside this
      # file. The current Motion Levels target is:
      # MOTION_LEVELS_CAMERA_RCLONE_DEST=motionlevels-objects:motionlevels-recordings
      # MOTION_LEVELS_CAMERA_RCLONE_PATH_PREFIX=x5-camera
      MOTION_LEVELS_CAMERA_RCLONE_DEST=
      MOTION_LEVELS_CAMERA_RCLONE_PATH_PREFIX=

      MOTION_LEVELS_PLAYER_URL=http://127.0.0.1/display/
      MOTION_LEVELS_PLAYER_PROFILE=/var/lib/motion-levels/rebuild-player-chromium
      MOTION_LEVELS_PLAYER_WINDOW_SIZE=auto
      MOTION_LEVELS_HDMI_ALSA_DEVICE=plughw:0,5
      MOTION_LEVELS_XRANDR_MODE=1920x1080
      MOTION_LEVELS_XRANDR_RATE=60
      MOTION_LEVELS_FORCE_ALSA_OUTPUT=1
      MOTION_LEVELS_HDMI_WATCHDOG_INTERVAL=10
      MOTION_LEVELS_HDMI_WATCHDOG_FAILURES=3
      MOTION_LEVELS_HDMI_WATCHDOG_RESTART_COOLDOWN=45

      # Camera snapshot helper. Store secrets only on the appliance, preferably
      # in /etc/motion-levels/camera.env as MOTION_LEVELS_CAMERA_PASSWORD.
      MOTION_LEVELS_CAMERA_USER=motionlevels
      MOTION_LEVELS_CAMERA_128_HOST=192.168.1.128
      MOTION_LEVELS_CAMERA_129_HOST=192.168.1.129
      MOTION_LEVELS_CAMERA_130_HOST=192.168.1.130
      MOTION_LEVELS_CAMERA_FPS=2
      MOTION_LEVELS_CAMERA_JPEG_QUALITY=55
      MOTION_LEVELS_CAMERA_IDLE_SECONDS=20

  - path: /etc/motion-levels/caddy.env
    owner: root:root
    permissions: '0644'
    content: |
      MOTION_LEVELS_CAMERA_RECORDER_PROXY_TARGET=127.0.0.1:8030

  - path: /etc/systemd/system/caddy.service.d/motion-levels-env.conf
    owner: root:root
    permissions: '0644'
    content: |
      [Service]
      EnvironmentFile=-/etc/motion-levels/caddy.env

  # 3. Default Caddy reverse proxy config
  - path: /etc/caddy/Caddyfile
    owner: root:root
    permissions: '0644'
    content: |
      :80 {
        encode zstd gzip

        handle_path /controller/* {
          reverse_proxy 127.0.0.1:4101
        }

        handle /controller {
          rewrite * /
          reverse_proxy 127.0.0.1:4101
        }

        handle /ws {
          reverse_proxy 127.0.0.1:4101
        }

        handle_path /engine/* {
          reverse_proxy 127.0.0.1:4102
        }

        # The /tv and /cameras pages — and the platform assets/APIs and camera
        # streams they depend on — are exposed only on the wired venue LAN
        # address (192.168.1.142), which lives solely on the ethernet
        # interface. Each handler ANDs the host with its path so other routes
        # (/menu, /display, /engine, ...) keep working on 192.168.1.142, while
        # /tv and /cameras stay unreachable from wifi or any other address.
        @platform_tv {
          host 192.168.1.142
          path /tv /tv/
        }
        handle @platform_tv {
          rewrite * /salas/motionlevels-1/tv
          reverse_proxy https://84.7.190.81 {
            header_up Host platform.motionlevels.obis.dev
            transport http {
              dial_timeout 10s
              tls_server_name platform.motionlevels.obis.dev
            }
          }
        }

        @platform_cameras {
          host 192.168.1.142
          path /cameras /cameras/
        }
        handle @platform_cameras {
          root * /opt/motion-levels/rebuild/src/deploy/motionlevels-pc
          rewrite * /cameras.html
          header Cache-Control "no-store"
          file_server
        }

        # Camera frame endpoint. NOT restricted to the wired LAN address: the
        # platform pulls these snapshots over Tailscale (Host: motionlevels-1)
        # for its own cameras page, so gating this to 192.168.1.142 would break
        # it. Only the /cameras page above is ethernet-only.
        handle /cam/* {
          reverse_proxy 127.0.0.1:8020
        }

        # The recorder can start/stop the USB camera, so expose it only to
        # callers reaching the room over Tailscale. Platform API routes provide
        # the logged-in operator boundary before proxying here.
        @camera_recorder_tailscale {
          remote_ip 100.64.0.0/10
          path /camera-recorder/*
        }
        handle @camera_recorder_tailscale {
          uri strip_prefix /camera-recorder
          reverse_proxy {$MOTION_LEVELS_CAMERA_RECORDER_PROXY_TARGET:127.0.0.1:8030}
        }
        handle /camera-recorder/* {
          respond "Not found" 404
        }

        @platform_next {
          host 192.168.1.142
          path /_next/*
        }
        handle @platform_next {
          reverse_proxy https://84.7.190.81 {
            header_up Host platform.motionlevels.obis.dev
            transport http {
              dial_timeout 10s
              tls_server_name platform.motionlevels.obis.dev
            }
          }
        }

        @platform_rooms {
          host 192.168.1.142
          path /api/rooms/*
        }
        handle @platform_rooms {
          reverse_proxy https://84.7.190.81 {
            header_up Host platform.motionlevels.obis.dev
            transport http {
              dial_timeout 10s
              tls_server_name platform.motionlevels.obis.dev
            }
          }
        }

        @platform_live_floor {
          host 192.168.1.142
          path /api/live-floor/*
        }
        handle @platform_live_floor {
          reverse_proxy https://84.7.190.81 {
            header_up Host platform.motionlevels.obis.dev
            transport http {
              dial_timeout 10s
              tls_server_name platform.motionlevels.obis.dev
            }
          }
        }

        handle /motion-levels-icon.png {
          root * /opt/motion-levels/rebuild/apps/player-menu/dist
          header Cache-Control "public, max-age=31536000, immutable"
          file_server
        }

        handle /motion-levels-icon.webp {
          root * /opt/motion-levels/rebuild/apps/player-menu/dist
          header Cache-Control "public, max-age=31536000, immutable"
          file_server
        }

        redir /menu /menu/
        handle_path /menu/* {
          root * /opt/motion-levels/rebuild/apps/player-menu/dist
          @menu_assets path /assets/*
          header @menu_assets Cache-Control "public, max-age=31536000, immutable"
          @menu_index path / /index.html
          header @menu_index Cache-Control "no-cache"
          try_files {path} {path}/ /index.html
          file_server
        }

        redir /display /display/
        handle_path /display/* {
          root * /opt/motion-levels/rebuild/apps/player-display/dist
          @display_assets path /assets/*
          header @display_assets Cache-Control "public, max-age=31536000, immutable"
          @display_index path / /index.html
          header @display_index Cache-Control "no-cache"
          try_files {path} {path}/ /index.html
          file_server
        }

        redir /games /games/
        handle_path /games/* {
          root * /opt/motion-levels/rebuild/src/game-bundles/motion-levels-games
          header Cache-Control "public, max-age=31536000, immutable"
          file_server
        }

        redir /status /engine/api/status
        redir / /menu/
      }

  # 3a. Xwrapper configuration to allow xinit/Xorg running from systemd service
  - path: /etc/X11/Xwrapper.config
    owner: root:root
    permissions: '0644'
    content: |
      allowed_users=anybody
      needs_root_rights=yes

  # 4. Systemd unit: floor-controller
  - path: /etc/systemd/system/motion-levels-floor-controller.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Motion Levels floor controller
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      WorkingDirectory=/opt/motion-levels/rebuild
      EnvironmentFile=/etc/motion-levels/motion-levels.env
      EnvironmentFile=-/etc/motion-levels/platform.env
      ExecStart=/opt/motion-levels/rebuild/bin/floor-controller \
        -http ${MOTION_LEVELS_CONTROLLER_HTTP} \
        -frames ${MOTION_LEVELS_CONTROLLER_FRAMES} \
        -input-events ${MOTION_LEVELS_CONTROLLER_INPUT_EVENTS} \
        -recv-port ${MOTION_LEVELS_FLOOR_RECV_PORT} \
        -broadcast-ip ${MOTION_LEVELS_LED_BROADCAST_IP} \
        -broadcast-port ${MOTION_LEVELS_LED_BROADCAST_PORT} \
        -controller-id-file /opt/motion-levels/rebuild/var/floor-controller/controller-id \
        -record-frames "" \
        -record-compression none \
        -record-post-compression zstd \
        -record-segment-bytes 268435456 \
        -record-segment-duration 10m \
        -record-delete-raw-after 1h \
        -record-max-pending-raw-bytes 4294967296 \
        -record-upload-platform-url "" \
        -record-upload-queue-size 256 \
        -record-upload-timeout 5m \
        -zstd-path /usr/bin/zstd \
        -refresh-fps ${MOTION_LEVELS_REFRESH_FPS} \
        -engine-fade-delay 2s \
        -engine-fade-duration 3s
      Restart=always
      RestartSec=2
      Nice=-5
      CPUWeight=1000
      LimitNOFILE=65536
      Environment=GOMAXPROCS=2

      [Install]
      WantedBy=multi-user.target

  # 5. Systemd unit: game-engine
  - path: /etc/systemd/system/motion-levels-game-engine.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Motion Levels game engine
      After=network-online.target sound.target motion-levels-floor-controller.service motion-levels-camera-recorder.service
      Wants=network-online.target sound.target motion-levels-floor-controller.service motion-levels-camera-recorder.service

      [Service]
      Type=simple
      WorkingDirectory=/opt/motion-levels/rebuild
      EnvironmentFile=/etc/motion-levels/motion-levels.env
      EnvironmentFile=-/etc/motion-levels/platform.env
      RuntimeDirectory=motion-levels-game-engine
      RuntimeDirectoryMode=0755
      ExecStart=/opt/motion-levels/rebuild/bin/game-engine \
        -http ${MOTION_LEVELS_ENGINE_HTTP} \
        -controller ${MOTION_LEVELS_CONTROLLER_FRAMES} \
        -pressure-events ${MOTION_LEVELS_CONTROLLER_INPUT_EVENTS} \
        -game salvapantallas \
        -fps ${MOTION_LEVELS_ENGINE_FPS} \
        -brightness ${MOTION_LEVELS_ENGINE_BRIGHTNESS} \
        -audio=true \
        -audio-player aplay-raw \
        -audio-assets /opt/motion-levels/rebuild/content/audio \
        -record-replay /run/motion-levels-game-engine/replays \
        -replay-keep-local=false \
        -replay-keyframe-interval 5s \
        -replay-zstd-path /usr/bin/zstd \
        -display-snapshot-fps ${MOTION_LEVELS_DISPLAY_SNAPSHOT_FPS} \
        -camera-recorder-url ${MOTION_LEVELS_CAMERA_RECORDER_URL} \
        -camera-recorder-segment-seconds ${MOTION_LEVELS_CAMERA_RECORDER_SEGMENT_SECONDS} \
        -platform-url ${MOTION_LEVELS_PLATFORM_URL} \
        -platform-asset-cache ${MOTION_LEVELS_PLATFORM_ASSET_CACHE_DIR} \
        -platform-sync-interval 1s \
        -controller-label "${MOTION_LEVELS_CONTROLLER_LABEL}" \
        -controller-hostname ${MOTION_LEVELS_CONTROLLER_HOSTNAME} \
        -controller-id-file /opt/motion-levels/rebuild/var/floor-controller/controller-id
      Restart=always
      RestartSec=2
      Environment=GOMAXPROCS=2

      [Install]
      WantedBy=multi-user.target

  # 6. Systemd unit: kiosk
  - path: /etc/systemd/system/motion-levels-kiosk.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Motion Levels HDMI kiosk browser
      After=network-online.target sound.target caddy.service motion-levels-game-engine.service
      Wants=network-online.target sound.target caddy.service motion-levels-game-engine.service
      Conflicts=getty@tty7.service display-manager.service
      
      [Service]
      Type=simple
      EnvironmentFile=/etc/motion-levels/motion-levels.env
      Environment=DISPLAY=:0
      Environment=XDG_RUNTIME_DIR=/run/user/0
      WorkingDirectory=/var/lib/motion-levels
      ExecStart=/usr/bin/xinit /usr/local/bin/motion-levels-player-kiosk -- :0 vt7 -nolisten tcp -s 0 -dpms
      Restart=always
      RestartSec=3

      [Install]
      WantedBy=multi-user.target

  # 7. Systemd unit: HDMI watchdog
  - path: /etc/systemd/system/motion-levels-hdmi-watchdog.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Motion Levels HDMI audio/video watchdog
      After=network-online.target sound.target motion-levels-kiosk.service
      Wants=network-online.target sound.target motion-levels-kiosk.service

      [Service]
      Type=simple
      EnvironmentFile=/etc/motion-levels/motion-levels.env
      Environment=DISPLAY=:0
      Environment=XDG_RUNTIME_DIR=/run/user/0
      WorkingDirectory=/var/lib/motion-levels
      ExecStart=/usr/local/bin/motion-levels-hdmi-watchdog
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

# Shell commands executed sequentially during the boot setup phase
runcmd:
  # 1. Update package database and install prerequisites
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get -o Dpkg::Options::=--force-confold install -y curl gpg ca-certificates apt-transport-https

  # 2. Add Caddy official repository
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | tee /etc/apt/sources.list.d/caddy-stable.list

  # 3. Add Tailscale and install it using the official script
  - curl -fsSL https://tailscale.com/install.sh | sh

  # 4. Install all runtime, build, VM agent, and display/kiosk packages
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get -o Dpkg::Options::=--force-confold install -y caddy build-essential cmake pkg-config libasound2-dev libudev-dev libusb-1.0-0-dev usbutils zstd git rclone rsync nodejs python3 python3-opencv sudo openssh-server qemu-guest-agent xinit xserver-xorg x11-xserver-utils chromium unclutter alsa-utils

  # 5. Download and install Go compiler (required to build Go programs during deploy)
  - |
    GO_VERSION="1.26.3"
    ARCH=$(uname -m)
    case "$ARCH" in
      x86_64|amd64) GO_ARCH=amd64 ;;
      aarch64|arm64) GO_ARCH=arm64 ;;
      *) echo "Unsupported architecture: $ARCH" >&2; exit 1 ;;
    esac
    TMP_DIR=$(mktemp -d)
    curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-${GO_ARCH}.tar.gz" -o "${TMP_DIR}/go.tar.gz"
    rm -rf /usr/local/go
    tar -C /usr/local -xzf "${TMP_DIR}/go.tar.gz"
    rm -rf "${TMP_DIR}"

  # 6. Create required appliance deployment directories
  - mkdir -p /opt/motion-levels/rebuild/src
  - mkdir -p /opt/motion-levels/rebuild/bin
  - mkdir -p /opt/motion-levels/rebuild/apps/player-menu
  - mkdir -p /opt/motion-levels/rebuild/apps/player-display
  - mkdir -p /var/lib/motion-levels

  # 7. Apply per-machine hostname and start Tailscale auto-registration
  - |
    set -euo pipefail
    if [ -f /etc/motion-levels/provision.env ]; then
      set -a
      . /etc/motion-levels/provision.env
      set +a
    fi

    PROVISION_HOSTNAME="${MOTION_LEVELS_PROVISION_HOSTNAME:-}"
    if [ -z "${PROVISION_HOSTNAME}" ]; then
      PROVISION_HOSTNAME="$(hostname -s)"
    fi

    if [ -n "${PROVISION_HOSTNAME}" ]; then
      hostnamectl set-hostname "${PROVISION_HOSTNAME}"
      sed -i "s/^MOTION_LEVELS_CONTROLLER_HOSTNAME=.*/MOTION_LEVELS_CONTROLLER_HOSTNAME=${PROVISION_HOSTNAME}/" /etc/motion-levels/motion-levels.env
    fi

    systemctl enable --now ssh
    systemctl enable --now qemu-guest-agent
    systemctl enable --now tailscaled

    if [ -n "${TAILSCALE_AUTHKEY:-}" ]; then
      echo "Registering machine with Tailscale..."
      tailscale up \
        --auth-key="${TAILSCALE_AUTHKEY}" \
        --hostname="${PROVISION_HOSTNAME}" \
        --advertise-tags="${TAILSCALE_ADVERTISE_TAGS:-tag:motion-levels-edge}" \
        --ssh \
        --accept-dns=false
    else
      echo "WARNING: Tailscale auth key was not set."
      echo "To join later: tailscale up --auth-key <key> --hostname ${PROVISION_HOSTNAME} --advertise-tags ${TAILSCALE_ADVERTISE_TAGS:-tag:motion-levels-edge} --ssh --accept-dns=false"
    fi

  # 8. Reload systemd daemon to recognize newly written services
  - systemctl daemon-reload
  
  # 9. Enable Caddy web server (will start up and reload Caddyfile)
  - systemctl enable --now caddy
