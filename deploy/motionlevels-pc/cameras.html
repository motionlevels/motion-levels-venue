<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Motion Levels Cameras</title>
    <style>
      :root {
        color-scheme: dark;
        background: #030609;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(90% 120% at 82% 8%, rgba(0, 84, 255, 0.12), transparent 52%),
          radial-gradient(55% 95% at 0% 100%, rgba(45, 216, 255, 0.065), transparent 58%),
          #030609;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: 100vw;
        height: 100dvh;
        display: grid;
        place-items: center;
        padding: clamp(4px, 0.55vw, 10px);
      }

      .stage {
        width: min(100%, calc((100dvh - clamp(8px, 1.1vw, 20px)) * 16 / 9));
        height: min(100%, calc((100vw - clamp(8px, 1.1vw, 20px)) * 9 / 16));
        aspect-ratio: 16 / 9;
        min-width: 0;
        min-height: 0;
        display: grid;
        grid-template-rows: repeat(2, minmax(0, 1fr));
        gap: clamp(5px, 0.55vw, 9px);
      }

      .camera {
        position: relative;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        border: 1px solid rgba(148, 163, 184, 0.16);
        border-radius: clamp(5px, 0.45vw, 8px);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.018), transparent 62px),
          #020304;
        box-shadow: 0 14px 38px rgba(0, 0, 0, 0.28);
      }

      .camera img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        object-position: center top;
      }

      .camera[data-state="loading"]::after,
      .camera[data-state="error"]::after {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: rgba(203, 213, 225, 0.72);
        background:
          linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px),
          #020304;
        background-size: 32px 32px;
        font-size: clamp(11px, 0.9vw, 14px);
        font-weight: 820;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        content: "Cargando";
      }

      .camera[data-state="error"]::after {
        content: "Sin senal";
      }
    </style>
  </head>
  <body>
    <main aria-label="Motion Levels Cameras">
      <section class="stage">
        <article class="camera" data-state="loading">
          <img alt="Camara trasera" data-src="/cam/128.jpg">
        </article>
        <article class="camera" data-state="loading">
          <img alt="Camara lateral" data-src="/cam/129.jpg">
        </article>
      </section>
    </main>
    <script>
      const refreshMs = 500;

      for (const img of document.querySelectorAll("img[data-src]")) {
        const panel = img.closest(".camera");
        const src = img.dataset.src;
        const refresh = () => {
          img.src = `${src}?t=${Date.now()}`;
        };

        img.addEventListener("load", () => {
          panel.dataset.state = "live";
        });
        img.addEventListener("error", () => {
          panel.dataset.state = "error";
        });

        refresh();
        window.setInterval(refresh, refreshMs);
      }
    </script>
  </body>
</html>
