name: motion-levels-venue

services:
  floor:
    image: ${FLOOR_IMAGE:?set FLOOR_IMAGE to an immutable full-SHA tag}
    pull_policy: never
    container_name: motion-levels-venue-floor
    user: "10001:10001"
    init: true
    restart: unless-stopped
    network_mode: host
    env_file:
      - ${VENUE_RUNTIME_ENV:-/etc/motion-levels/venue/runtime.env}
    environment:
      MOTION_LEVELS_PLATFORM_TOKEN_FILE: /run/secrets/platform-token
    volumes:
      - type: bind
        source: /opt/motion-levels/rebuild/var/floor-controller
        target: /var/lib/motion-levels/floor-controller
      - type: bind
        source: ${VENUE_CONFIG_ROOT:-/etc/motion-levels/venue}/secrets/platform-token-core
        target: /run/secrets/platform-token
        read_only: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges=true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    pids_limit: 128
    mem_limit: 256m
    cpu_shares: 1024
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:4101/health]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    labels:
      com.motionlevels.revision: ${FLOOR_REVISION:?set FLOOR_REVISION}
      com.motionlevels.release-revision: ${VENUE_REVISION:?set VENUE_REVISION}
      com.motionlevels.protocol: ${FLOOR_PROTOCOL:?set FLOOR_PROTOCOL}

  engine:
    image: ${ENGINE_IMAGE:?set ENGINE_IMAGE to an immutable full-SHA tag}
    pull_policy: never
    container_name: motion-levels-venue-engine
    user: "10001:10001"
    group_add:
      - ${VENUE_AUDIO_GID:?set VENUE_AUDIO_GID}
    init: true
    restart: unless-stopped
    network_mode: host
    depends_on:
      floor:
        condition: service_healthy
    env_file:
      - ${VENUE_RUNTIME_ENV:-/etc/motion-levels/venue/runtime.env}
    environment:
      MOTION_LEVELS_AUDIO_SOCKET: /run/motion-levels-audio/audio.sock
      MOTION_LEVELS_CAMERA_RECORDER_TOKEN_FILE: /run/secrets/camera-recorder-token
      MOTION_LEVELS_GAMES_ROOT: /app/game-bundles/motion-levels-games
      MOTION_LEVELS_PLATFORM_ASSET_CACHE_DIR: /var/lib/motion-levels/platform-asset-cache
      MOTION_LEVELS_PLATFORM_TOKEN_FILE: /run/secrets/platform-token
    volumes:
      - type: bind
        source: /run/motion-levels-audio
        target: /run/motion-levels-audio
        read_only: true
      - type: bind
        source: /opt/motion-levels/rebuild/var/floor-controller
        target: /var/lib/motion-levels/floor-controller
        read_only: true
      - type: bind
        source: /var/lib/motion-levels/platform-asset-cache
        target: /var/lib/motion-levels/platform-asset-cache
      - type: bind
        source: ${VENUE_CONFIG_ROOT:-/etc/motion-levels/venue}/secrets/platform-token-core
        target: /run/secrets/platform-token
        read_only: true
      - type: bind
        source: ${VENUE_CONFIG_ROOT:-/etc/motion-levels/venue}/secrets/camera-recorder-token-core
        target: /run/secrets/camera-recorder-token
        read_only: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges=true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /run/motion-levels-game-engine:rw,noexec,nosuid,nodev,size=640m,uid=10001,gid=10001
    pids_limit: 512
    mem_limit: 1792m
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:4102/api/health]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 20s
    labels:
      com.motionlevels.revision: ${VENUE_REVISION:?set VENUE_REVISION}

  camera-helper:
    image: ${CAMERA_HELPER_IMAGE:?set CAMERA_HELPER_IMAGE to an immutable full-SHA tag}
    pull_policy: never
    container_name: motion-levels-venue-camera-helper
    user: "10002:10002"
    init: true
    restart: unless-stopped
    env_file:
      - ${VENUE_RUNTIME_ENV:-/etc/motion-levels/venue/runtime.env}
    environment:
      MOTION_LEVELS_CAMERA_BIND: 0.0.0.0
      MOTION_LEVELS_CAMERA_PASSWORD_FILE: /run/secrets/tapo-password
    ports:
      - 127.0.0.1:8020:8020
    networks:
      cameras:
        ipv4_address: 172.30.50.10
    volumes:
      - type: bind
        source: ${VENUE_CONFIG_ROOT:-/etc/motion-levels/venue}/secrets/tapo-password
        target: /run/secrets/tapo-password
        read_only: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges=true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    pids_limit: 256
    mem_limit: 512m
    cpus: 0.45
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    labels:
      com.motionlevels.revision: ${VENUE_REVISION:?set VENUE_REVISION}

  security-recorder:
    image: ${SECURITY_RECORDER_IMAGE:?set SECURITY_RECORDER_IMAGE to an immutable full-SHA tag}
    pull_policy: never
    container_name: motion-levels-venue-security-recorder
    user: "10002:10002"
    init: true
    restart: unless-stopped
    env_file:
      - ${VENUE_RUNTIME_ENV:-/etc/motion-levels/venue/runtime.env}
    environment:
      MOTION_LEVELS_CAMERA_PASSWORD_FILE: /run/secrets/tapo-password
      MOTION_LEVELS_PLATFORM_TOKEN_FILE: /run/secrets/platform-token
      MOTION_LEVELS_SECURITY_RECORDER_HEARTBEAT: /tmp/security-recorder-heartbeat.json
    networks:
      cameras:
        ipv4_address: 172.30.50.11
    volumes:
      - type: bind
        source: /var/lib/motion-levels/security-recordings
        target: /var/lib/motion-levels/security-recordings
      - type: bind
        source: ${VENUE_CONFIG_ROOT:-/etc/motion-levels/venue}/secrets/tapo-password
        target: /run/secrets/tapo-password
        read_only: true
      - type: bind
        source: ${VENUE_CONFIG_ROOT:-/etc/motion-levels/venue}/secrets/platform-token-security
        target: /run/secrets/platform-token
        read_only: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges=true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10002,gid=10002
    pids_limit: 256
    mem_limit: 512m
    cpus: 0.50
    stop_grace_period: 2m
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import json,time; p='/tmp/security-recorder-heartbeat.json'; d=json.load(open(p)); assert time.time()-__import__('os').stat(p).st_mtime < 90 and d.get('ffmpegRunning') is True"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 45s
    labels:
      com.motionlevels.revision: ${VENUE_REVISION:?set VENUE_REVISION}

  caddy:
    image: ${CADDY_IMAGE:?set CADDY_IMAGE to an immutable full-SHA tag}
    pull_policy: never
    container_name: motion-levels-venue-caddy
    user: "10003:10003"
    restart: unless-stopped
    network_mode: host
    depends_on:
      floor:
        condition: service_healthy
      engine:
        condition: service_healthy
      camera-helper:
        condition: service_healthy
    volumes:
      - type: bind
        source: /etc/motion-levels/venue-public
        target: /srv/runtime
        read_only: true
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges=true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
      - /data:rw,noexec,nosuid,nodev,size=16m,uid=10003,gid=10003
      - /config:rw,noexec,nosuid,nodev,size=16m,uid=10003,gid=10003
    pids_limit: 128
    mem_limit: 192m
    cpus: 0.35
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1/menu/]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    labels:
      com.motionlevels.revision: ${VENUE_REVISION:?set VENUE_REVISION}

  player:
    profiles: [wayland-display]
    image: ${PLAYER_IMAGE:?set PLAYER_IMAGE to an immutable full-SHA tag}
    pull_policy: never
    container_name: motion-levels-venue-player
    user: "10003:10003"
    group_add:
      - ${VENUE_RENDER_GID:?set VENUE_RENDER_GID}
    init: true
    restart: unless-stopped
    depends_on:
      caddy:
        condition: service_healthy
    environment:
      XDG_RUNTIME_DIR: /run/motion-levels-display
      WAYLAND_DISPLAY: wayland-0
      MOTION_LEVELS_PLAYER_PROFILE: /var/lib/motion-levels/player-profile
      MOTION_LEVELS_PLAYER_URL: http://172.30.51.1/display/
      MOTION_LEVELS_PLAYER_WINDOW_SIZE: 1920,1080
    networks:
      display:
        ipv4_address: 172.30.51.10
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128:rw
    volumes:
      - type: bind
        source: /run/motion-levels-display
        target: /run/motion-levels-display
        read_only: true
      - type: bind
        source: /var/lib/motion-levels/player-profile
        target: /var/lib/motion-levels/player-profile
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges=true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
      - /dev/shm:rw,noexec,nosuid,nodev,size=256m
    pids_limit: 512
    mem_limit: 1024m
    cpus: 1.25
    healthcheck:
      test: [CMD-SHELL, "grep -aq chromium /proc/[0-9]*/comm && curl -fsS http://172.30.51.1/display/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    labels:
      com.motionlevels.revision: ${VENUE_REVISION:?set VENUE_REVISION}

networks:
  cameras:
    name: motion-levels-venue-cameras
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.50.0/24
  display:
    name: motion-levels-venue-display
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.51.0/24
