<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Motion Levels · Venue</title>
    <style>
      :root{color-scheme:dark;--bg:#070a0f;--panel:#111721;--line:#283241;--text:#eef4fb;--muted:#8f9aa9;--good:#63e6a6;--warn:#ffca69;--bad:#ff7b87;--blue:#74a7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#15263f 0,transparent 36%),var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif}main{width:min(1120px,calc(100% - 32px));margin:0 auto;padding:28px 0 48px}header{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:20px}h1{font-size:clamp(25px,4vw,42px);margin:0;letter-spacing:-.04em}.eyebrow{margin:0 0 5px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);font-size:12px;font-weight:800}.stamp{color:var(--muted);text-align:right}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{grid-column:span 4;background:linear-gradient(180deg,#141b26,#0e141d);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 18px 45px #0005}.card.wide{grid-column:span 8}.card.full{grid-column:1/-1}.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 14px}.hero{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:780}.dot{width:12px;height:12px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 5px #ffffff0c}.ok .dot,.pill.ok{background:var(--good)}.bad .dot,.pill.bad{background:var(--bad)}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}.fact{padding:11px;border-radius:10px;background:#070b11;border:1px solid #202a37}.fact b{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.fact span{overflow-wrap:anywhere}.services{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:9px}.service{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#080c12;border:1px solid #202a37;padding:10px 12px;border-radius:10px}.pill{width:9px;height:9px;border-radius:50%;background:var(--warn)}button{appearance:none;border:1px solid #35445a;background:#172131;color:var(--text);border-radius:10px;padding:10px 14px;font:inherit;font-weight:760;cursor:pointer}button:hover{border-color:var(--blue)}button:disabled{opacity:.45;cursor:wait}.actions{display:flex;gap:9px;flex-wrap:wrap}.message{min-height:22px;color:var(--muted);margin:13px 0 0}.message.bad{color:var(--bad)}a{color:var(--blue)}@media(max-width:760px){header{align-items:flex-start;flex-direction:column}.stamp{text-align:left}.card,.card.wide{grid-column:1/-1}.facts{grid-template-columns:1fr}}
    </style>
  </head>
  <body>
    <main>
      <header><div><p class="eyebrow">Venue appliance</p><h1 id="venue">Motion Levels</h1></div><div class="stamp" id="stamp">Consultando…</div></header>
      <section class="grid">
        <article class="card" id="overall"><h2>Estado general</h2><div class="hero"><i class="dot"></i><span id="overall-label">Conectando</span></div><div class="facts"><div class="fact"><b>Revisión</b><span id="revision">—</span></div><div class="fact"><b>Display</b><span id="display">—</span></div></div></article>
        <article class="card wide"><h2>Juego</h2><div class="hero"><span id="game">Sin juego</span></div><div class="facts"><div class="fact"><b>Fase</b><span id="phase">—</span></div><div class="fact"><b>Controlador</b><span id="controller">—</span></div></div></article>
        <article class="card wide" id="camera-card"><h2>GoPro</h2><div class="hero"><i class="dot"></i><span id="camera">Consultando cámara</span></div><div class="facts"><div class="fact"><b>Batería / alimentación</b><span id="battery">—</span></div><div class="fact"><b>Backend</b><span id="backend">—</span></div></div></article>
        <article class="card"><h2>Video de comprobación</h2><div class="actions"><button data-duration="10">10 s</button><button data-duration="30">30 s</button><button data-duration="60">60 s</button></div><p class="message" id="record-message">Graba y sube un clip corto con la GoPro.</p></article>
        <article class="card full"><h2>Servicios systemd</h2><div class="services" id="services"></div></article>
      </section>
    </main>
    <script>
      const $=id=>document.getElementById(id);let busy=false;
      const text=(value,fallback="—")=>value===null||value===undefined||value===""?fallback:String(value);
      function cameraBattery(data){const status=data?.cameraStatus||{};const value=status.batteryPercent??status.batteryLevel??data?.batteryPercent;if(Number.isFinite(Number(value)))return `${value}%`;return status.externalPower===true||status.usbPower===true?"Alimentación USB":"Sin datos (puede funcionar por cable)"}
      function render(snapshot){$("venue").textContent=snapshot.venue?.hostname||"Motion Levels";$("stamp").textContent=`Actualizado ${new Date(snapshot.generatedAt).toLocaleTimeString()}`;$("overall").className=`card ${snapshot.ok?"ok":"bad"}`;$("overall-label").textContent=snapshot.ok?"Operativo":"Necesita atención";$("revision").textContent=text(snapshot.venue?.release?.revision);$("display").textContent=snapshot.summary?.displayHealthy?"Saludable":"No confirmado";$("game").textContent=text(snapshot.summary?.game,"Modo ambiente");$("phase").textContent=text(snapshot.summary?.phase,"idle");$("controller").textContent=snapshot.controller?.ok?"Conectado":"Sin respuesta";const cam=snapshot.camera?.data||{};const detected=snapshot.summary?.cameraDetected===true;$("camera-card").className=`card wide ${detected?"ok":"bad"}`;$("camera").textContent=detected?"GoPro conectada":snapshot.camera?.ok?"Recorder online, USB sin cámara":"Recorder sin respuesta";$("battery").textContent=cameraBattery(cam);$("backend").textContent=text(cam.backend,cam.backendReady?"Listo":"No disponible");$("services").innerHTML=Object.entries(snapshot.services||{}).map(([name,state])=>`<div class="service"><span>${name}</span><i class="pill ${state==="active"?"ok":"bad"}" title="${state}"></i></div>`).join("")}
      async function refresh(){try{const response=await fetch("/venue-api/v1/snapshot",{cache:"no-store"});const payload=await response.json();if(!response.ok)throw new Error(payload.error||`HTTP ${response.status}`);render(payload)}catch(error){$("overall").className="card bad";$("overall-label").textContent="Supervisor sin respuesta";$("stamp").textContent=error.message}}
      async function record(duration){if(busy)return;busy=true;document.querySelectorAll("button").forEach(button=>button.disabled=true);const message=$("record-message");message.className="message";message.textContent=`Grabando ${duration} segundos…`;try{const response=await fetch("/venue-api/v1/camera/record",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({durationSeconds:duration})});const payload=await response.json();if(!response.ok||payload.ok===false)throw new Error(payload.error||`HTTP ${response.status}`);message.textContent=`Clip de ${duration} s completado${payload.fileName?`: ${payload.fileName}`:""}.`;await refresh()}catch(error){message.className="message bad";message.textContent=`No se pudo grabar: ${error.message}`}finally{busy=false;document.querySelectorAll("button").forEach(button=>button.disabled=false)}}
      document.querySelectorAll("button[data-duration]").forEach(button=>button.addEventListener("click",()=>record(Number(button.dataset.duration))));refresh();setInterval(refresh,5000);
    </script>
  </body>
</html>
