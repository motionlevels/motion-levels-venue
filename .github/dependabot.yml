version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /apps/player-display
    schedule:
      interval: monthly
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /apps/player-menu
    schedule:
      interval: monthly
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /packages/floor-view
    schedule:
      interval: monthly
    groups:
      npm-dependencies:
        patterns:
          - "*"
