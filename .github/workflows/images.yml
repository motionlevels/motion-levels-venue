name: Container images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: platform
            image: ghcr.io/motionlevels/motion-levels-platform
            dockerfile: deploy/homelab/platform.Dockerfile
            target: runtime
          - name: deployer
            image: ghcr.io/motionlevels/motion-levels-deployer
            dockerfile: deploy/homelab/platform.Dockerfile
            target: deployer
          - name: venue-bundle
            image: ghcr.io/motionlevels/motion-levels-venue-bundle
            dockerfile: deploy/motionlevels-pc/venue-bundle.Dockerfile
            target: runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: type=sha,format=long

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_CREATED_AT=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            PLATFORM_BUILD_REVISION=${{ github.sha }}
            PLATFORM_BUILD_DEPLOYED_AT=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true
