name: Container images

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact CI-verified venue revision to publish
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: images-${{ inputs.release_sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  validate-venue:
    name: Validate venue confinement manifests
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    env:
      RELEASE_SHA: ${{ inputs.release_sha || github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Validate scripts and Python services
        run: |
          bash -n \
            deploy/motionlevels-pc/activate-venue-containers \
            deploy/motionlevels-pc/motion-levels-container-firewall \
            deploy/motionlevels-pc/motion-levels-display-agent \
            deploy/motionlevels-pc/motion-levels-hdmi-agent \
            deploy/motionlevels-pc/motion-levels-player-container \
            deploy/motionlevels-pc/venue-game-engine \
            scripts/request-venue-deployment.sh
          python3 -m py_compile \
            deploy/motionlevels-pc/motion-levels-camera-helper.py \
            deploy/motionlevels-pc/motion-levels-security-recorder.py
          python3 -m unittest discover -s deploy/motionlevels-pc/tests

      - name: Validate the venue component lock
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          payload = json.loads(
              Path("deploy/motionlevels-pc/venue-components.lock.json").read_text(encoding="utf-8")
          )
          assert payload.get("schema") == "motion-levels-venue-components-v1"
          controller = payload.get("components", {}).get("controller", {})
          assert controller.get("repository") == "ghcr.io/motionlevels/motion-levels-controller"
          assert re.fullmatch(r"[0-9a-f]{40}", controller.get("revision", ""))
          assert controller.get("platform") == "linux/amd64"
          assert controller.get("protocol") == "v1"
          PY

      - name: Resolve the venue Compose model
        run: |
          config_root="${RUNNER_TEMP}/venue"
          install -d -m 0700 "${config_root}/secrets"
          : >"${config_root}/runtime.env"
          : >"${config_root}/secrets/platform-token-core"
          : >"${config_root}/secrets/camera-recorder-token-core"
          : >"${config_root}/secrets/platform-token-security"
          : >"${config_root}/secrets/tapo-password"
          cat >"${config_root}/candidate.env" <<EOF
          VENUE_MODE=containers
          VENUE_REVISION=${RELEASE_SHA}
          VENUE_SHORT_REVISION=${RELEASE_SHA::7}
          VENUE_COMMIT_AT=1970-01-01T00:00:00Z
          VENUE_TARGET=ci
          VENUE_DISPLAY_BACKEND=x11
          VENUE_LAN_INTERFACE=enp2s0
          VENUE_LAN_IPV4=192.168.1.142
          VENUE_TAILSCALE_IPV4=100.76.156.89
          VENUE_LAN_SUBNET=192.168.1.0/24
          VENUE_FLOOR_LAN_IPV4=192.168.1.143
          VENUE_FLOOR_BROADCAST_IPV4=255.255.255.255
          MOTION_LEVELS_X5_ENABLED=0
          MOTION_LEVELS_X5_UPSTREAM=
          VENUE_CONFIG_ROOT=/config
          VENUE_RUNTIME_ENV=/config/runtime.env
          VENUE_AUDIO_GID=10001
          VENUE_RENDER_GID=10002
          FLOOR_REVISION=0000000000000000000000000000000000000000
          FLOOR_PLATFORM=linux/amd64
          FLOOR_PROTOCOL=v1
          FLOOR_IMAGE=example.invalid/controller:sha-${RELEASE_SHA}
          ENGINE_IMAGE=example.invalid/engine:sha-${RELEASE_SHA}
          CAMERA_HELPER_IMAGE=example.invalid/helper:sha-${RELEASE_SHA}
          SECURITY_RECORDER_IMAGE=example.invalid/security:sha-${RELEASE_SHA}
          CADDY_IMAGE=example.invalid/caddy:sha-${RELEASE_SHA}
          PLAYER_IMAGE=example.invalid/player:sha-${RELEASE_SHA}
          EOF
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "${config_root}:/config:ro" \
            --workdir /workspace \
            docker:28-cli@sha256:625d9431a9f54c5a2bc90f24f0e1c3d55b1349fd857dd85035f98c2c9acbdd4d \
            compose \
            --env-file /config/candidate.env \
            --file deploy/motionlevels-pc/docker-compose.yml \
            config --quiet

  image-preflight:
    name: Check immutable image set
    needs: validate-venue
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    permissions:
      contents: read
      packages: read
    env:
      RELEASE_SHA: ${{ inputs.release_sha || github.event.workflow_run.head_sha }}
      RELEASE_IMAGES: |
        ghcr.io/motionlevels/motion-levels-venue-bundle
        ghcr.io/motionlevels/motion-levels-venue-engine
        ghcr.io/motionlevels/motion-levels-venue-camera-helper
        ghcr.io/motionlevels/motion-levels-venue-security-recorder
        ghcr.io/motionlevels/motion-levels-venue-caddy
        ghcr.io/motionlevels/motion-levels-venue-player
    outputs:
      build_required: ${{ steps.check.outputs.build_required }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify all-or-none immutable SHA tags
        id: check
        shell: bash
        run: |
          set -euo pipefail
          total=0
          existing=0
          missing=0
          while IFS= read -r image; do
            [ -n "$image" ] || continue
            total=$((total + 1))
            reference="${image}:sha-${RELEASE_SHA}"
            output="$(mktemp)"
            if docker pull --platform linux/amd64 "$reference" >"$output" 2>&1; then
              existing=$((existing + 1))
              revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$reference")"
              architecture="$(docker image inspect --format '{{ .Architecture }}' "$reference")"
              if [ "$revision" != "$RELEASE_SHA" ] || [ "$architecture" != amd64 ]; then
                echo "Existing immutable tag is invalid: $reference revision=${revision:-missing} architecture=${architecture:-missing}" >&2
                exit 1
              fi
              echo "Verified existing $reference"
            elif grep -Eqi 'manifest unknown|not found' "$output"; then
              missing=$((missing + 1))
              echo "Missing $reference"
            else
              echo "Could not inspect $reference" >&2
              cat "$output" >&2
              exit 1
            fi
          done <<<"$RELEASE_IMAGES"

          if [ "$total" -gt 0 ] && [ "$existing" -eq 0 ] && [ "$missing" -eq "$total" ]; then
            echo "build_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$total" -gt 0 ] && [ "$existing" -eq "$total" ] && [ "$missing" -eq 0 ]; then
            echo "build_required=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Immutable image set is partial: existing=$existing missing=$missing" >&2
          exit 1

  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    needs:
      - validate-venue
      - image-preflight
    if: needs.image-preflight.outputs.build_required == 'true'
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_SHA: ${{ inputs.release_sha || github.event.workflow_run.head_sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: venue-bundle
            image: ghcr.io/motionlevels/motion-levels-venue-bundle
            dockerfile: deploy/motionlevels-pc/venue-bundle.Dockerfile
            target: runtime
          - name: venue-engine
            image: ghcr.io/motionlevels/motion-levels-venue-engine
            dockerfile: deploy/motionlevels-pc/venue-bundle.Dockerfile
            target: engine-runtime
          - name: venue-camera-helper
            image: ghcr.io/motionlevels/motion-levels-venue-camera-helper
            dockerfile: deploy/motionlevels-pc/venue-bundle.Dockerfile
            target: camera-helper-runtime
          - name: venue-security-recorder
            image: ghcr.io/motionlevels/motion-levels-venue-security-recorder
            dockerfile: deploy/motionlevels-pc/venue-bundle.Dockerfile
            target: security-recorder-runtime
          - name: venue-caddy
            image: ghcr.io/motionlevels/motion-levels-venue-caddy
            dockerfile: deploy/motionlevels-pc/venue-bundle.Dockerfile
            target: caddy-runtime
          - name: venue-player
            image: ghcr.io/motionlevels/motion-levels-venue-player
            dockerfile: deploy/motionlevels-pc/venue-bundle.Dockerfile
            target: player-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ matrix.image }}:sha-${{ env.RELEASE_SHA }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.created=${{ github.event.workflow_run.updated_at || github.event.repository.updated_at }}
          build-args: |
            BUILD_REVISION=${{ env.RELEASE_SHA }}
            BUILD_CREATED_AT=${{ github.event.workflow_run.updated_at || github.event.repository.updated_at }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }},ignore-error=true
          provenance: mode=max
          sbom: true

  trigger-deployment:
    name: Continue dispatched release with production deployment
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.validate-venue.result == 'success' &&
      needs.image-preflight.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    needs:
      - validate-venue
      - image-preflight
      - publish
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - name: Dispatch exact production deployment
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"ref\":\"main\",\"inputs\":{\"venue_revision\":\"${RELEASE_SHA}\"}}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-production.yml/dispatches"
