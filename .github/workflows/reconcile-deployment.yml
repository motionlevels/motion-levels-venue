name: Reconcile venue deployment

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: venue-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Reconcile motionlevels-1
    runs-on: ${{ vars.DEPLOYMENT_RUNNER_LABEL }}
    timeout-minutes: 45
    environment: Production
    env:
      GH_TOKEN: ${{ github.token }}
      VENUE_DEPLOY_REVISION: ${{ github.sha }}
      VENUE_AUTO_DEPLOY_TOKEN: ${{ secrets.VENUE_AUTO_DEPLOY_TOKEN }}
      VENUE_AUTO_DEPLOY_URL: ${{ vars.VENUE_AUTO_DEPLOY_URL || 'https://platform.motionlevels.obis.dev/api/venue/auto-deploy' }}
    steps:
      - name: Confirm immutable images were published
        id: images
        shell: bash
        run: |
          set -euo pipefail
          conclusion="$(
            curl --fail --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/images.yml/runs?head_sha=${VENUE_DEPLOY_REVISION}&status=success&per_page=1" \
              | python3 -c 'import json,sys; runs=json.load(sys.stdin).get("workflow_runs", []); print(runs[0].get("conclusion", "") if runs else "")'
          )"
          if [ "$conclusion" != success ]; then
            echo "Immutable venue images are not ready for $VENUE_DEPLOY_REVISION; reconciliation will retry later"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Checkout the exact venue release
        if: steps.images.outputs.ready == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ env.VENUE_DEPLOY_REVISION }}

      - name: Reconcile the exact venue release
        if: steps.images.outputs.ready == 'true'
        run: scripts/request-venue-deployment.sh
