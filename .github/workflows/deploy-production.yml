name: Deploy production venue

on:
  workflow_run:
    workflows:
      - Container images
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      venue_revision:
        description: Exact image-backed venue revision to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: venue-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy motionlevels-1
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ${{ vars.DEPLOYMENT_RUNNER_LABEL }}
    timeout-minutes: 45
    environment: Production
    env:
      VENUE_DEPLOY_REVISION: ${{ inputs.venue_revision || github.event.workflow_run.head_sha }}
      VENUE_AUTO_DEPLOY_TOKEN: ${{ secrets.VENUE_AUTO_DEPLOY_TOKEN }}
      VENUE_AUTO_DEPLOY_URL: ${{ vars.VENUE_AUTO_DEPLOY_URL || 'https://platform.motionlevels.obis.dev/api/venue/auto-deploy' }}
    steps:
      - name: Checkout the exact venue release
        uses: actions/checkout@v6
        with:
          ref: ${{ env.VENUE_DEPLOY_REVISION }}

      - name: Activate the exact venue release
        run: scripts/request-venue-deployment.sh
