name: Deploy production venue

on:
  workflow_run:
    workflows:
      - Container images
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: venue-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy motionlevels-1
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ${{ vars.DEPLOYMENT_RUNNER_LABEL }}
    timeout-minutes: 45
    environment: Production
    env:
      VENUE_DEPLOY_REVISION: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout the exact venue release
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.VENUE_DEPLOY_REVISION }}
          persist-credentials: false

      - name: Join production tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions
          hostname: motionlevels-venue-release-${{ github.run_id }}
          args: --accept-dns=false

      - name: Verify direct venue SSH access
        run: |
          tailscale ping --until-direct=false --timeout=10s --c=1 100.76.156.89
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=10 \
            root@100.76.156.89 true

      - name: Install deployment dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pipx rsync
          pipx install ansible-core
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Persist and attempt the exact desired venue release
        run: ansible-playbook --limit motionlevels-1 ansible/playbooks/venue-containers.yml
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify durable exact-revision ownership
        shell: bash
        run: |
          set -euo pipefail
          ssh root@100.76.156.89 "EXPECTED_REVISION=$VENUE_DEPLOY_REVISION sh -s" <<'REMOTE'
          set -eu
          value() {
            sed -n "s/^VENUE_REVISION=//p" "$1" | tail -n 1
          }
          current=/etc/motion-levels/venue/current.env
          desired=/etc/motion-levels/venue/candidate.env
          if [ -s "$current" ] && [ "$(value "$current")" = "$EXPECTED_REVISION" ]; then
            /usr/local/sbin/motion-levels-venue-containers status
            echo "Venue release $EXPECTED_REVISION is active"
            exit 0
          fi
          if [ -s "$desired" ] && [ "$(value "$desired")" = "$EXPECTED_REVISION" ]; then
            systemctl is-enabled --quiet motion-levels-venue-reconcile.timer
            systemctl is-active --quiet motion-levels-venue-reconcile.timer
            echo "Venue release $EXPECTED_REVISION is durably queued behind the local safety gate"
            exit 0
          fi
          echo "Neither active nor desired state owns $EXPECTED_REVISION" >&2
          exit 1
          REMOTE

      - name: Remove transient registry credentials
        if: always()
        continue-on-error: true
        run: ssh root@100.76.156.89 docker logout ghcr.io
