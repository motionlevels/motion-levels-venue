name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static repository boundaries
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run static repository tests
        run: npm run test:static

  go:
    name: Go
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node for the embedded games runner
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run Go checks in a pinned dependency container
        shell: bash
        run: |
          set -euo pipefail
          node_root="$(dirname "$(dirname "$(command -v node)")")"
          docker run --rm \
            --env HOME=/tmp/motion-levels-ci \
            --env PATH=/opt/node/bin:/usr/local/go/bin:/usr/local/bin:/usr/bin:/bin \
            --volume "$node_root:/opt/node:ro" \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            golang:1.24-bookworm \
            bash -lc '
              mkdir -p "$HOME"
              apt-get update
              apt-get install -y --no-install-recommends libasound2-dev pkg-config
              git config --global --add safe.directory /workspace
              go test ./...
              go build ./...
              go run ./game-engine/cmd/motion-go-seeds -check
            '

  node:
    name: Node / ${{ matrix.name }}
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: player-display
            working-directory: apps/player-display
            lockfile: apps/player-display/package-lock.json
            commands: |
              npm test
              npm run build
          - name: player-menu
            working-directory: apps/player-menu
            lockfile: apps/player-menu/package-lock.json
            commands: |
              npm test
              npm run build
          - name: floor-view
            working-directory: packages/floor-view
            lockfile: packages/floor-view/package-lock.json
            commands: npm run typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Install dependencies
        working-directory: ${{ matrix.working-directory }}
        run: npm ci

      - name: Install shared floor-view dependencies
        run: npm ci --prefix packages/floor-view

      - name: Run checks
        working-directory: ${{ matrix.working-directory }}
        run: ${{ matrix.commands }}

      - name: Run player-display E2E in pinned Playwright container
        if: matrix.name == 'player-display'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/playwright-home"
          docker run --rm --ipc=host \
            --user "$(id -u):$(id -g)" \
            --env HOME=/runner-temp/playwright-home \
            --env PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP:/runner-temp" \
            --workdir /workspace/apps/player-display \
            mcr.microsoft.com/playwright:v1.62.1-noble \
            bash -lc 'npm run test:e2e'

  trigger-images:
    name: Continue dispatched release with immutable images
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
    needs:
      - static
      - go
      - node
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Dispatch exact release images
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"ref\":\"main\",\"inputs\":{\"release_sha\":\"${RELEASE_SHA}\"}}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/images.yml/dispatches"
