name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Native venue boundaries
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run repository and service tests
        run: npm test

      - name: Validate native release and host scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n \
            scripts/build-native-release.sh \
            deploy/motionlevels-pc/motion-levels-gopro-reconcile \
            deploy/motionlevels-pc/motion-levels-hdmi-watchdog \
            deploy/motionlevels-pc/motion-levels-player-kiosk \
            deploy/motionlevels-pc/venue-runtime
          python3 -m py_compile \
            scripts/verify-native-release.py \
            deploy/motionlevels-pc/motion-levels-camera-helper.py \
            deploy/motionlevels-pc/motion-levels-security-recorder.py \
            deploy/motionlevels-pc/motion-levels-venue-supervisor.py
