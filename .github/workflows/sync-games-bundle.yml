name: Sync Motion Levels games bundle

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published games release tag (games-vMAJOR.MINOR.PATCH)
        required: true
        type: string
      source_revision:
        description: Full games repository source revision
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-motion-levels-games
  cancel-in-progress: false

jobs:
  sync:
    name: Verify, pin, and publish games release
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_REVISION: ${{ inputs.source_revision }}
      GAMES_REPOSITORY: motionlevels/motion-levels-games
    steps:
      - name: Checkout venue main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^games-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]

      - name: Download exact private release assets
        env:
          GH_TOKEN: ${{ secrets.GAMES_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          release_dir="$RUNNER_TEMP/motion-levels-games-release"
          mkdir -p "$release_dir"
          archive="motion-levels-games-${SOURCE_REVISION}.tgz"
          release_json="$(curl --fail --silent --show-error \
            --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GAMES_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          for asset in "$archive" "$archive.sha256"; do
            asset_id="$(printf '%s' "$release_json" | ASSET_NAME="$asset" node -e '
              const fs = require("node:fs");
              const release = JSON.parse(fs.readFileSync(0, "utf8"));
              const match = release.assets?.find(({ name }) => name === process.env.ASSET_NAME);
              if (!match) process.exit(1);
              process.stdout.write(String(match.id));
            ')"
            curl --fail --silent --show-error \
              --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/octet-stream" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$release_dir/$asset" \
              "https://api.github.com/repos/${GAMES_REPOSITORY}/releases/assets/${asset_id}"
          done
          test -f "$release_dir/$archive"
          test -f "$release_dir/$archive.sha256"

      - name: Import verified release
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/motion-levels-games-release"
          archive="motion-levels-games-${SOURCE_REVISION}.tgz"
          node scripts/import-motion-levels-games-release.mjs \
            --archive "$release_dir/$archive" \
            --checksum "$release_dir/$archive.sha256" \
            --release-tag "$RELEASE_TAG" \
            --source-revision "$SOURCE_REVISION"

      - name: Verify venue bundle boundary
        run: |
          npm run verify:games-bundle
          go test ./game-engine/internal/games/motionlevelsgames/...

      - name: Commit pin update
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- game-bundles/motion-levels-games)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "motion-levels-games-release[bot]"
          git config user.email "motion-levels-games-release[bot]@users.noreply.github.com"
          git add game-bundles/motion-levels-games
          git commit -m "Pin Motion Levels games ${RELEASE_TAG}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push normal forward commit
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "venue main kept moving; refusing to rewrite history" >&2
              exit 1
            fi
            git fetch origin main
            git merge --no-edit origin/main
            npm run verify:games-bundle
          done

      - name: Run venue CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"main"}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches"
