name: Update controller pin

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full controller commit SHA
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: controller-pin-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Validate and update immutable pin
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          tmp="$(mktemp)"
          jq --arg revision "$REVISION" '.components.controller.revision = $revision' deploy/motionlevels-pc/venue-components.lock.json > "$tmp"
          mv "$tmp" deploy/motionlevels-pc/venue-components.lock.json
      - name: Commit pin
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Controller already pinned at $REVISION"
            exit 0
          fi
          git config user.name "Motion Levels"
          git config user.email "noreply@motionlevels.com"
          git add deploy/motionlevels-pc/venue-components.lock.json
          git commit -m "chore: update controller to ${REVISION:0:12}"
          git push origin HEAD:main
      - name: Dispatch verified venue release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"main"}' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches"
